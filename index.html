    CLIENT_FIELDS.forEach(f => Random._set(body, f.key, data[f.key]));
  },

  fillBikeForm(body) {
    const data = Random.bikeData();
    Random._set(body, "label", data.label);
    SPEC_FIELDS.forEach(f => Random._set(body, f.key, data.specs[f.key] || ""));

    const rows = body.querySelector('[data-rows="kv"]');
    if (rows) {
      rows.innerHTML = "";
      data.other.forEach(entry => rows.append(DynRows.kvRow(entry)));
    }
  },

  fillEventForm(body, bike, kind) {
    const data = Random.eventData(bike, kind);
    ["date", "by", "title", "description", "cost"].forEach(key => Random._set(body, key, data[key]));

    const rows = body.querySelector('[data-rows="change"]');
    if (!rows) return;
    rows.innerHTML = "";
    data.changes.forEach(change => {
      // Built the same way a mechanic builds it: the part is named, not picked.
      const row = DynRows.changeRow(bike, change.key);
      rows.append(row);
      row.querySelector('[data-change="to"]').value = change.to;
      row.querySelector('[data-change="cost"]').value = change.cost || "";
    });
    rows.append(DynRows.changeRow(bike));          // leave one blank row ready
  },

  /** The 🎲 on the work-item form borrows one of the shipped templates. */
  fillWorkItemForm(body) {
    const item = Random.pick(DEFAULT_WORK_ITEMS);
    ["name", "price", "description"].forEach(key => Random._set(body, key, item[key]));
    const rows = body.querySelector('[data-rows="step-editor"]');
    if (!rows) return;
    rows.innerHTML = "";
    item.steps.forEach(step => rows.append(DynRows.stepRow(step)));
  }
};

/* ==========================================================================
   7. VIEWS — pure functions returning HTML strings
   ========================================================================== */

const TABS = [
  { id: "clients",  label: "Clients" },
  { id: "bikes",    label: "Bikes" },
  { id: "work",     label: "Work" },
  { id: "activity", label: "Activity" },
  { id: "settings", label: "Settings" },
  { id: "data",     label: "Data" }
];

const View = {

  /** The Work tab carries a count: how many bikes are on the bench right now. */
  tabs(route, db) {
    const inShop = Domain.allBikes(db).filter(({ bike }) => Domain.status(bike).id === "in_shop").length;
    return TABS.map(t => `
      <button class="tab" role="tab" aria-selected="${t.id === route.tab}"
              data-action="tab" data-tab="${t.id}">${esc(t.label)}${
        t.id === "work" && inShop ? `<span class="count">${inShop}</span>` : ""}</button>`).join("");
  },

  /* --- shared fragments ------------------------------------------------- */

  empty(icon, title, body, action) {
    return `<div class="empty">
      <span class="big">${icon}</span>
      <h3>${esc(title)}</h3>
      <p class="small">${esc(body)}</p>
      ${action ? `<p style="margin-top:14px">${action}</p>` : ""}
    </div>`;
  },

  /** The bike's current status as a badge. `short` fits inside card titles. */
  statusBadge(bike, short) {
    const s = Domain.status(bike);
    return `<span class="badge ${s.badge}">${esc(short ? s.short : s.label)}</span>`;
  },

  /**
   * The single button that matters for a bike right now, wherever it appears
   * in a list. A bike due in wants checking in; a bike on the bench wants
   * opening in the work space. One click, no menu, no detail page first.
   */
  quickAction(client, bike) {
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;
    switch (Domain.status(bike).id) {
      case "scheduled":
        return `<button class="btn btn-sm btn-primary" data-action="bike:checkin" ${ids}
                        title="Mark this bike as arrived and put it on the work board">→ Check in</button>`;
      case "in_shop":
        return `<button class="btn btn-sm btn-primary" data-action="work:open" ${ids}>Open work</button>`;
      case "completed":
        return `<button class="btn btn-sm" data-action="bike:status" data-status="out" ${ids}>Mark picked up</button>`;
      default:
        return `<button class="btn btn-sm" data-action="work:schedule" ${ids}>Schedule work</button>`;
    }
  },

  /** "2 items · 7/18 steps" — the one-line state of a bike's open work. */
  workLine(bike) {
    const s = Domain.bikeWorkStats(bike);
    if (!s.jobs) return "";
    return `${s.jobs} work item${s.jobs === 1 ? "" : "s"} · ${s.done}/${s.total} steps`
      + (s.loggedMinutes ? ` · ${esc(Util.duration(s.loggedMinutes))} logged` : "");
  },

  progressBar(percent) {
    return `<div class="progress${percent >= 100 ? " full" : ""}"><span style="width:${percent}%"></span></div>`;
  },

  /**
   * Tagging control for the bike page: where it is now, the one-click next
   * step in the workflow, and a segmented control for jumping anywhere else.
   */
  statusBar(client, bike) {
    const current = Domain.status(bike);
    const next = Domain.nextStatus(bike);

    const segment = BIKE_STATUSES.map(s => `
      <button type="button" aria-pressed="${s.id === current.id}"
              title="${esc(s.action)}"
              data-action="bike:status" data-client="${esc(client.id)}"
              data-bike="${esc(bike.id)}" data-status="${esc(s.id)}">${esc(s.short)}</button>`).join("");

    return `
      <div class="status-bar">
        <span class="small muted">Status</span>
        ${View.statusBadge(bike)}
        ${bike.statusDate ? `<span class="small muted">since ${esc(Util.formatDate(bike.statusDate))}</span>` : ""}
        <span class="spacer"></span>
        <button class="btn btn-sm btn-primary" data-action="bike:status"
                data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"
                data-status="${esc(next.id)}">${esc(next.action)}</button>
        <div class="seg" role="group" aria-label="Set status">${segment}</div>
      </div>`;
  },

  specChips(bike) {
    const s = bike.specs || {};
    return ["bikeType", "groupset", "frameMaterial", "frameSize", "drivetrain"]
      .filter(k => s[k])
      .map(k => `<span class="chip">${esc(SPEC_FIELDS.get(k).label)}: <strong>${esc(s[k])}</strong></span>`)
      .join(" ");
  },

  /** One changelog entry. `context` adds the client/bike line for feeds. */
  entry(clientId, bikeId, event, context) {
    const kind = ENTRY_KINDS[event.kind] || ENTRY_KINDS.work;
    const changes = (event.changes || []).map(ch => `
      <li>
        <span class="diff-label">${esc(Domain.changeLabel(ch))}:</span>
        ${ch.from ? `<span class="diff-from">${esc(ch.from)}</span><span class="diff-arrow">→</span>` : ""}
        <span class="diff-to">${esc(ch.to || "—")}</span>
        ${ch.cost ? `<span class="muted money"> · ${esc(Util.money(ch.cost))}</span>` : ""}
      </li>`).join("");

    return `<li class="type-${esc(event.kind)}">
      <div class="entry-head">
        <span class="badge ${kind.badge}">${esc(kind.label)}</span>
        <strong>${esc(event.title || "(untitled)")}</strong>
        <span class="entry-date">${esc(Util.formatDate(event.date))}</span>
        ${event.by ? `<span class="entry-date">· ${esc(event.by)}</span>` : ""}
        <span class="spacer"></span>
        ${event.cost ? `<strong class="money">${esc(Util.money(event.cost))}</strong>` : ""}
        <button class="btn btn-sm btn-danger" data-action="event:delete"
                data-client="${esc(clientId)}" data-bike="${esc(bikeId)}"
                data-event="${esc(event.id)}" title="Delete this entry">✕</button>
      </div>
      ${context ? `<div class="small muted">${esc(context)}</div>` : ""}
      ${event.description ? `<div class="entry-body small">${esc(event.description)}</div>` : ""}
      ${changes ? `<ul class="diff-list">${changes}</ul>` : ""}
    </li>`;
  },

  breadcrumb(items) {
    return `<nav class="breadcrumb">` + items.map((item, i) => {
      const sep = i ? `<span aria-hidden="true">›</span>` : "";
      const node = item.action
        ? `<button data-action="${esc(item.action)}"${item.client ? ` data-client="${esc(item.client)}"` : ""}>${esc(item.label)}</button>`
        : `<span>${esc(item.label)}</span>`;
      return sep + node;
    }).join("") + `</nav>`;
  },

  /* --- tab: clients ----------------------------------------------------- */

  clientList(db, filter) {
    const needle = (filter || "").toLowerCase();
    const clients = db.clients
      .filter(c => !needle || Domain.clientSearchText(c).includes(needle))
      .sort((a, b) => a.name.localeCompare(b.name));

    const cards = clients.map(c => {
      // Only the statuses that need attention are worth the space here;
      // "out of shop" is the norm and says nothing.
      const counts = Domain.clientStatusCounts(c);
      const active = BIKE_STATUSES_RANKED
        .filter(s => s.id !== DEFAULT_STATUS && counts[s.id])
        .map(s => `<span class="badge ${s.badge}">${counts[s.id]} ${esc(s.short.toLowerCase())}</span>`)
        .join(" ");

      return `
      <article class="card clickable" data-action="client:open" data-client="${esc(c.id)}">
        <div class="card-title">
          <h3>${esc(c.name)}</h3>
          <span class="badge">${c.bikes.length} bike${c.bikes.length === 1 ? "" : "s"}</span>
        </div>
        <p class="small muted">${esc([c.phone, c.email].filter(Boolean).join(" · ") || "No contact details")}</p>
        ${active ? `<p style="margin-top:8px">${active}</p>` : ""}
        ${c.bikes.length ? `<p class="small" style="margin-top:8px">${
          c.bikes.slice(0, 3).map(b => esc(Domain.bikeTitle(b))).join("<br>")
        }${c.bikes.length > 3 ? `<br><span class="muted">+${c.bikes.length - 3} more</span>` : ""}</p>` : ""}
      </article>`;
    }).join("");

    return `
      <div class="stack">
        <div class="row between">
          <h2>Clients</h2>
          <div class="row">
            <input class="search" type="search" placeholder="Search clients, bikes, parts…"
                   value="${esc(filter || "")}" data-input="search" data-scope="searchClients"
                   data-focus-key="search-clients">
            <button class="btn btn-primary" data-action="client:add">+ Add client</button>
          </div>
        </div>
        ${clients.length
          ? `<div class="grid">${cards}</div>`
          : View.empty("👤", db.clients.length ? "No matches" : "No clients yet",
              db.clients.length ? "Try a different search term."
                                : "Add your first client to start tracking their bikes.",
              db.clients.length ? "" : `<button class="btn btn-primary" data-action="client:add">+ Add client</button>`)}
      </div>`;
  },

  clientDetail(db, client) {
    const statusCounts = Domain.clientStatusCounts(client);
    const details = CLIENT_FIELDS
      .filter(f => f.key !== "name" && f.key !== "notes" && client[f.key])
      .map(f => `<div class="spec-item"><dt>${esc(f.label)}</dt><dd>${esc(client[f.key])}</dd></div>`)
      .join("");

    // Same ordering as the Bikes tab: whatever the shop is holding first.
    const bikes = client.bikes.slice()
      .sort((a, b) => Domain.status(a).rank - Domain.status(b).rank ||
                      Domain.bikeTitle(a).localeCompare(Domain.bikeTitle(b)))
      .map(b => {
      const work = View.workLine(b);
      const last = Domain.lastEvent(b);
      return `
      <article class="card clickable" data-status="${esc(Domain.status(b).id)}"
               data-action="bike:open" data-client="${esc(client.id)}" data-bike="${esc(b.id)}">
        <div class="card-title">
          <h3>${esc(Domain.bikeTitle(b))}</h3>
          ${View.statusBadge(b, true)}
        </div>
        <p class="small muted">${esc(Domain.bikeSubtitle(b) || "—")}${
          b.stub ? ` · <span class="badge">details pending</span>` : ""}</p>
        <p style="margin-top:10px">${View.specChips(b)}</p>
        <p class="small muted" style="margin-top:10px">
          ${work || (last ? `last ${esc(Util.formatDate(last.date))} — ${esc(last.title || ENTRY_KINDS[last.kind].label)}`
                          : "nothing recorded yet")}
        </p>
        <div class="row" style="margin-top:10px">${View.quickAction(client, b)}</div>
      </article>`;
    }).join("");

    return `
      <div class="stack">
        ${View.breadcrumb([{ label: "Clients", action: "nav:clients" }, { label: client.name }])}

        <div class="card">
          <div class="row between">
            <div>
              <h2>${esc(client.name)}</h2>
              <p class="small muted">${esc([client.phone, client.email, client.company].filter(Boolean).join(" · ") || "No contact details")}</p>
            </div>
            <div class="row">
              <button class="btn" data-action="client:edit" data-client="${esc(client.id)}">Edit client</button>
              <button class="btn btn-danger" data-action="client:delete" data-client="${esc(client.id)}">Delete</button>
            </div>
          </div>
          ${details ? `<dl class="spec-grid" style="margin-top:14px">${details}</dl>` : ""}
          ${client.notes ? `<p class="small" style="margin-top:14px;white-space:pre-wrap">${esc(client.notes)}</p>` : ""}
          <div class="row" style="margin-top:14px">
            <span class="chip">Bikes: <strong>${client.bikes.length}</strong></span>
            <span class="chip">Recorded spend: <strong>${esc(Util.money(Domain.clientSpend(client)))}</strong></span>
            ${BIKE_STATUSES_RANKED
              .filter(s => s.id !== DEFAULT_STATUS && statusCounts[s.id])
              .map(s => `<span class="badge ${s.badge}">${statusCounts[s.id]} ${esc(s.short.toLowerCase())}</span>`)
              .join(" ")}
          </div>
        </div>

        <div class="row between">
          <h3>Bikes</h3>
          <div class="row">
            <button class="btn btn-primary" data-action="bike:stub" data-client="${esc(client.id)}"
                    title="For a bike we have not seen yet — schedule work against it now, fill in the details when it arrives">+ New bike</button>
            <button class="btn" data-action="bike:add" data-client="${esc(client.id)}">+ Add with full details</button>
          </div>
        </div>
        ${client.bikes.length
          ? `<div class="grid">${bikes}</div>`
          : View.empty("🚲", "No bikes yet",
              "“New bike” takes a name and nothing else — enough to book work in over the phone.",
              `<button class="btn btn-primary" data-action="bike:stub" data-client="${esc(client.id)}">+ New bike</button>`)}
      </div>`;
  },

  /** Compact summary of one job, as it appears on the bike's record page. */
  jobSummaryRow(client, bike, job) {
    const stats = Domain.jobStats(job);
    const state = JOB_STATES[job.status];
    return `
      <div class="job-card${job.status === "done" ? " is-done" : ""}">
        <div class="job-head">
          <span class="badge ${state.badge}">${esc(state.label)}</span>
          <strong>${esc(job.name)}</strong>
          <span class="small muted">${stats.done}/${stats.total} steps${
            stats.loggedMinutes ? " · " + esc(Util.duration(stats.loggedMinutes)) : ""}</span>
          <span class="spacer"></span>
          <span class="money small">${esc(Util.money(job.status === "done" ? (job.charged || stats.charge) : stats.charge))}</span>
        </div>
        ${View.progressBar(stats.percent)}
        ${job.request ? `<div class="job-request">${esc(job.request)}</div>` : ""}
        <div class="row" style="margin-top:10px">
          <span class="small muted">${job.status === "done"
            ? `Completed ${esc(Util.formatDate(job.completedDate))}${job.by ? " by " + esc(job.by) : ""}`
            : `Scheduled ${esc(Util.formatDate(job.scheduledDate))}`}</span>
          <span class="spacer"></span>
          ${job.status === "done" ? "" : `
            <button class="btn btn-sm btn-primary" data-action="work:open"
                    data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">Open in Work</button>`}
          <button class="btn btn-sm btn-danger" data-action="job:delete"
                  data-client="${esc(client.id)}" data-bike="${esc(bike.id)}" data-job="${esc(job.id)}"
                  title="Remove this work item from the bike">✕</button>
        </div>
      </div>`;
  },

  bikeDetail(db, client, bike) {
    const specSection = (group) => {
      const rows = group.fields
        .filter(f => bike.specs[f.key])
        .map(f => `<div class="spec-item"><dt>${esc(f.label)}</dt><dd>${esc(bike.specs[f.key])}</dd></div>`)
        .join("");
      return `
        <section class="card">
          <h4>${esc(group.label)}</h4>
          ${rows ? `<dl class="spec-grid" style="margin-top:10px">${rows}</dl>`
                 : `<p class="small muted" style="margin-top:8px">Nothing recorded. Use “Edit details”.</p>`}
        </section>`;
    };

    const otherRows = (bike.other || []).filter(o => o.label || o.value)
      .map(o => `<div class="spec-item"><dt>${esc(o.label)}</dt><dd>${esc(o.value)}</dd></div>`).join("");

    const events = bike.events.slice().sort(Util.byDateDesc)
      .map(e => View.entry(client.id, bike.id, e)).join("");

    const open = Domain.openJobs(bike);
    const done = Domain.doneJobs(bike).sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

    return `
      <div class="stack">
        ${View.breadcrumb([
          { label: "Clients", action: "nav:clients" },
          { label: client.name, action: "client:open", client: client.id },
          { label: Domain.bikeTitle(bike) }
        ])}

        <div class="card" data-status="${esc(Domain.status(bike).id)}">
          <div class="row between">
            <div>
              <h2>${esc(Domain.bikeTitle(bike))}</h2>
              <p class="small muted">${esc(Domain.bikeSubtitle(bike) || "")} · owned by ${esc(client.name)}</p>
            </div>
            <div class="row">
              <button class="btn" data-action="bike:edit" data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">Edit details</button>
              <button class="btn btn-danger" data-action="bike:delete" data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">Delete</button>
            </div>
          </div>
          ${bike.stub ? `<p class="small" style="margin-top:10px">
            <span class="badge badge-sched">Details pending</span>
            <span class="muted"> — created from a phone call. “Edit details” once the bike is in front of you.</span></p>` : ""}
          <p style="margin-top:12px">${View.specChips(bike)}</p>
          <div class="row" style="margin-top:12px">
            <span class="chip">Log entries: <strong>${bike.events.length}</strong></span>
            <span class="chip">Recorded spend: <strong>${esc(Util.money(Domain.bikeSpend(bike)))}</strong></span>
            ${open.length ? `<span class="chip">Open work: <strong>${open.length}</strong></span>` : ""}
          </div>
          ${View.statusBar(client, bike)}
        </div>

        <div class="card">
          <div class="row between">
            <h3>Work</h3>
            <div class="row">
              ${View.quickAction(client, bike)}
              <button class="btn btn-primary" data-action="work:schedule"
                      data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">+ Schedule work</button>
            </div>
          </div>
          <div style="margin-top:12px">
            ${open.map(j => View.jobSummaryRow(client, bike, j)).join("")
              || `<p class="small muted">No work outstanding.</p>`}
          </div>
          ${done.length ? `
            <h4 style="margin-top:18px">Completed</h4>
            <div style="margin-top:8px">${done.slice(0, 5).map(j => View.jobSummaryRow(client, bike, j)).join("")}</div>
            ${done.length > 5 ? `<p class="small muted" style="margin-top:8px">+${done.length - 5} earlier — see the changelog below.</p>` : ""}
          ` : ""}
        </div>

        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
          ${SPEC_GROUPS.map(specSection).join("")}
          <section class="card">
            <h4>Other</h4>
            ${otherRows ? `<dl class="spec-grid" style="margin-top:10px">${otherRows}</dl>`
                        : `<p class="small muted" style="margin-top:8px">No extra notes recorded.</p>`}
          </section>
        </div>

        <div class="card">
          <div class="row between">
            <h3>Changelog</h3>
            <div class="row">
              <button class="btn" data-action="event:add" data-kind="work"
                      data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"
                      title="For work done outside the step-by-step flow">+ Add work</button>
              <button class="btn" data-action="event:add" data-kind="owner"
                      data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">+ Add owner change</button>
            </div>
          </div>
          <div style="margin-top:14px">
            ${events ? `<ul class="timeline">${events}</ul>`
                     : View.empty("🧰", "Nothing logged yet",
                        "Completing a work item in the Work tab writes an entry here. Owner changes and record corrections land here too.")}
          </div>
        </div>
      </div>`;
  },

  /* --- tab: bikes ------------------------------------------------------- */

  bikesTab(db, filter) {
    const needle = (filter || "").toLowerCase();
    const matches = Domain.allBikes(db)
      .filter(({ client, bike }) =>
        !needle || (Domain.bikeSearchText(bike) + " " + client.name.toLowerCase()).includes(needle));

    const card = ({ client, bike }) => {
      const work = View.workLine(bike);
      return `
      <article class="card clickable" data-status="${esc(Domain.status(bike).id)}"
               data-action="bike:open" data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">
        <div class="card-title">
          <h3>${esc(Domain.bikeTitle(bike))}</h3>
          ${View.statusBadge(bike, true)}
        </div>
        <p class="small muted">${esc(client.name)}${Domain.bikeSubtitle(bike) ? " · " + esc(Domain.bikeSubtitle(bike)) : ""}${
          bike.stub ? " · details pending" : ""}</p>
        <p style="margin-top:10px">${View.specChips(bike)}</p>
        <p class="small muted" style="margin-top:10px">
          ${work || `${bike.events.length} log entr${bike.events.length === 1 ? "y" : "ies"}`}${
            bike.statusDate ? ` · ${esc(Domain.status(bike).short.toLowerCase())} since ${esc(Util.formatDate(bike.statusDate))}` : ""}
        </p>
        <div class="row" style="margin-top:10px">${View.quickAction(client, bike)}</div>
      </article>`;
    };

    // Grouped by status in workflow-urgency order — in shop, completed,
    // scheduled, then everything resting with its owner.
    const groups = Domain.byStatus(matches)
      .filter(group => group.items.length)
      .map(({ status, items }) => `
        <section class="status-group">
          <div class="row">
            <h3>${esc(status.label)}</h3>
            <span class="badge ${status.badge}">${items.length}</span>
            <span class="small muted">${esc(status.groupHint)}</span>
          </div>
          <div class="grid">${
            items.sort((a, b) => Domain.bikeTitle(a.bike).localeCompare(Domain.bikeTitle(b.bike)))
                 .map(card).join("")
          }</div>
        </section>`).join("");

    const summary = BIKE_STATUSES_RANKED.map(s => {
      const n = matches.filter(m => Domain.status(m.bike).id === s.id).length;
      return `<span class="chip">${esc(s.label)}: <strong>${n}</strong></span>`;
    }).join(" ");

    return `
      <div class="stack">
        <div class="row between">
          <h2>Bikes</h2>
          <input class="search" type="search" placeholder="Search by bike, part, owner or status…"
                 value="${esc(filter || "")}" data-input="search" data-scope="searchBikes"
                 data-focus-key="search-bikes">
        </div>
        ${matches.length ? `<div class="row">${summary}</div>` : ""}
        ${groups || View.empty("🔍", "No bikes to show", "Bikes appear here once they are added to a client.")}
      </div>`;
  },

  /* --- tab: work -------------------------------------------------------- */

  /**
   * The Work tab is two panes: a rail of everything the shop is holding, and
   * the work space for whichever bike is selected. Selection lives in the
   * route, so switching to Clients and back returns the mechanic to the bike
   * they were on — and every keystroke was already saved, so nothing is lost.
   */
  workTab(db, route, filter) {
    const needle = (filter || "").toLowerCase();
    const match = ({ client, bike }) =>
      !needle || (Domain.bikeSearchText(bike) + " " + client.name.toLowerCase()).includes(needle);

    const all = Domain.allBikes(db).filter(match);
    const inShop = all.filter(({ bike }) => Domain.status(bike).id === "in_shop");
    const dueIn = all.filter(({ bike }) => Domain.status(bike).id === "scheduled");
    const ready = all.filter(({ bike }) => Domain.status(bike).id === "completed");

    const selected = route.workBikeId
      ? Domain.bike(db, route.workClientId, route.workBikeId) : null;
    const selectedClient = selected ? Domain.client(db, route.workClientId) : null;

    const railItem = ({ client, bike }) => {
      const stats = Domain.bikeWorkStats(bike);
      const current = bike.id === route.workBikeId;
      return `
        <button class="rail-item" data-status="${esc(Domain.status(bike).id)}"
                aria-current="${current}" data-action="work:open"
                data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">
          <span class="t">${esc(Domain.bikeTitle(bike))}</span>
          <span class="s">${esc(client.name)}</span>
          ${stats.jobs ? View.progressBar(stats.percent) : ""}
          <span class="s">${stats.jobs
            ? `${stats.done}/${stats.total} steps · ${stats.jobs} item${stats.jobs === 1 ? "" : "s"}`
            : "No work scheduled"}</span>
        </button>`;
    };

    const railGroup = (label, items, hint) => items.length ? `
      <h4>${esc(label)} <span class="badge">${items.length}</span></h4>
      ${hint ? `<p class="hint" style="margin:0 2px">${esc(hint)}</p>` : ""}
      ${items.sort((a, b) => Domain.bikeTitle(a.bike).localeCompare(Domain.bikeTitle(b.bike)))
             .map(railItem).join("")}` : "";

    const rail = railGroup("On the bench", inShop)
      + railGroup("Due in", dueIn, "Check in from the bike's card when it arrives.")
      + railGroup("Ready for collection", ready);

    return `
      <div class="stack">
        <div class="row between">
          <h2>Work</h2>
          <input class="search" type="search" placeholder="Filter by bike, owner or requested work…"
                 value="${esc(filter || "")}" data-input="search" data-scope="searchWork"
                 data-focus-key="search-work">
        </div>
        <div class="work-layout">
          <aside class="rail">
            ${rail || `<p class="small muted">Nothing in the shop.</p>`}
          </aside>
          <section>
            ${selected && selectedClient
              ? View.workspace(db, selectedClient, selected)
              : View.empty("🔧", inShop.length ? "Pick a bike" : "Nothing on the bench",
                  inShop.length
                    ? "Choose a bike from the list to open its work items. Everything you tick or type is saved as you go."
                    : "Bikes appear here once they are checked in. Schedule work from a client or bike page first.")}
          </section>
        </div>
      </div>`;
  },

  /** One step of a job in progress: the row a mechanic actually works in. */
  workStep(client, bike, job, step) {
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`
      + ` data-job="${esc(job.id)}" data-step="${esc(step.id)}"`;
    const locked = job.status === "done";

    const parts = (step.changes || []).map(ch => `
      <li>
        <span class="diff-label">${esc(Domain.changeLabel(ch))}:</span>
        ${ch.from ? `<span class="diff-from">${esc(ch.from)}</span><span class="diff-arrow">→</span>` : ""}
        <span class="diff-to">${esc(ch.to || "—")}</span>
        ${ch.cost ? `<span class="muted money">· ${esc(Util.money(ch.cost))}</span>` : ""}
        ${locked ? "" : `<button class="btn btn-sm btn-danger" data-action="step:part-remove"
                                 ${ids} data-change="${esc(ch.id)}" title="Remove this part change">✕</button>`}
      </li>`).join("");

    const meta = [
      step.estMinutes ? "~" + Util.duration(step.estMinutes) : "",
      step.price ? "+" + Util.money(step.price) : ""
    ].filter(Boolean).join(" · ");

    return `
      <li class="step${step.done ? " done" : ""}">
        <div>
          <input type="checkbox" ${step.done ? "checked" : ""} ${locked ? "disabled" : ""}
                 data-action="step:toggle" ${ids} data-focus-key="step-${esc(step.id)}-chk"
                 aria-label="Mark “${esc(step.title)}” done">
        </div>
        <div>
          <div class="step-head">
            <span class="step-title">${esc(step.title)}</span>
            ${step.optional ? `<span class="badge">Optional</span>` : ""}
            ${meta ? `<span class="small muted">${esc(meta)}</span>` : ""}
          </div>
          ${step.note ? `<p class="step-note">${esc(step.note)}</p>` : ""}
          ${locked ? `
            <p class="small" style="margin-top:6px">
              ${step.minutes ? `<span class="chip">${esc(Util.duration(step.minutes))}</span> ` : ""}
              ${step.notes ? esc(step.notes) : ""}
            </p>`
          : `
            <div class="step-fields">
              <input type="number" min="0" step="5" placeholder="min" value="${esc(step.minutes)}"
                     data-input="step:field" data-field="minutes" ${ids}
                     data-focus-key="step-${esc(step.id)}-min" aria-label="Minutes spent">
              <input type="text" placeholder="Notes — what you found, what you did"
                     value="${esc(step.notes)}" data-input="step:field" data-field="notes" ${ids}
                     data-focus-key="step-${esc(step.id)}-notes" aria-label="Step notes">
              <button class="btn btn-sm" data-action="step:parts" ${ids}>+ Parts</button>
            </div>`}
          ${parts ? `<ul class="step-parts">${parts}</ul>` : ""}
        </div>
      </li>`;
  },

  /** One work item on the bench, with its whole checklist. */
  workJob(client, bike, job) {
    const stats = Domain.jobStats(job);
    const state = JOB_STATES[job.status];
    const done = job.status === "done";

    const breakdown = [
      `${esc(Util.money(job.price))} item`,
      stats.stepCharges ? `${esc(Util.money(stats.stepCharges))} steps` : "",
      stats.partsCost ? `${esc(Util.money(stats.partsCost))} parts` : ""
    ].filter(Boolean).join(" + ");

    return `
      <div class="job-card${done ? " is-done" : ""}" data-job="${esc(job.id)}">
        <div class="job-head">
          <span class="badge ${state.badge}">${esc(state.label)}</span>
          <h3>${esc(job.name)}</h3>
          <span class="spacer"></span>
          <span class="small muted">${stats.done}/${stats.total} steps${
            stats.estMinutes ? ` · est ${esc(Util.duration(stats.estMinutes))}` : ""}${
            stats.loggedMinutes ? ` · ${esc(Util.duration(stats.loggedMinutes))} logged` : ""}</span>
        </div>
        ${View.progressBar(stats.percent)}
        ${job.description ? `<p class="small muted">${esc(job.description)}</p>` : ""}
        ${job.request ? `<div class="job-request"><strong>Client asked:</strong> ${esc(job.request)}</div>` : ""}

        <ul class="steps">
          ${job.steps.map(step => View.workStep(client, bike, job, step)).join("")}
        </ul>

        <div class="row between" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <div>
            <div class="money"><strong>${esc(Util.money(done ? (job.charged || stats.charge) : stats.charge))}</strong></div>
            <div class="hint">${breakdown}</div>
          </div>
          <div class="row">
            ${done
              ? `<span class="small muted">Completed ${esc(Util.formatDate(job.completedDate))}${
                   job.by ? " by " + esc(job.by) : ""}</span>
                 <button class="btn btn-sm btn-danger" data-action="job:delete"
                         data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"
                         data-job="${esc(job.id)}">Remove from board</button>`
              : `${stats.openRequired
                    ? `<span class="small muted">${stats.openRequired} required step${
                        stats.openRequired === 1 ? "" : "s"} left</span>` : ""}
                 <button class="btn btn-sm btn-danger" data-action="job:delete"
                         data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"
                         data-job="${esc(job.id)}">Cancel</button>
                 <button class="btn btn-primary" data-action="job:complete"
                         data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"
                         data-job="${esc(job.id)}">Complete work item</button>`}
          </div>
        </div>
      </div>`;
  },

  /** The right-hand pane: one bike, everything outstanding on it. */
  workspace(db, client, bike) {
    const open = Domain.openJobs(bike);
    const done = Domain.doneJobs(bike).sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
    const stats = Domain.bikeWorkStats(bike);
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;

    return `
      <div class="stack">
        <div class="card" data-status="${esc(Domain.status(bike).id)}">
          <div class="row between">
            <div>
              <h2>${esc(Domain.bikeTitle(bike))}</h2>
              <p class="small muted">${esc(client.name)}${
                client.phone ? " · " + esc(client.phone) : ""}${
                Domain.bikeSubtitle(bike) ? " · " + esc(Domain.bikeSubtitle(bike)) : ""}</p>
            </div>
            ${View.statusBadge(bike)}
          </div>
          ${bike.stub ? `<p class="small" style="margin-top:10px">
            <span class="badge badge-sched">Details pending</span>
            <span class="muted"> — the bike is here now, so its build can be recorded.</span>
            <button class="btn btn-sm" data-action="bike:edit" ${ids}>Add details</button></p>` : ""}
          <div class="row" style="margin-top:12px">
            <span class="chip">Open items: <strong>${open.length}</strong></span>
            <span class="chip">Steps: <strong>${stats.done}/${stats.total}</strong></span>
            <span class="chip">Logged: <strong>${esc(Util.duration(stats.loggedMinutes) || "—")}</strong></span>
            <span class="spacer"></span>
            <button class="btn btn-sm" data-action="bike:open" ${ids}>Open bike record</button>
            <button class="btn btn-sm" data-action="work:schedule" ${ids}
                    title="Something else needs doing while it is on the stand">+ Add work item</button>
            ${Domain.status(bike).id === "scheduled"
              ? `<button class="btn btn-sm btn-primary" data-action="bike:checkin" ${ids}
                         title="It is here — put it on the bench">→ Check in</button>`
              : ""}
            ${open.length || Domain.status(bike).id !== "in_shop" ? "" : `
              <button class="btn btn-sm btn-primary" data-action="bike:status"
                      data-status="completed" ${ids}>Mark work completed</button>`}
          </div>
        </div>

        ${open.length
          ? open.map(job => View.workJob(client, bike, job)).join("")
          : View.empty("✅", "No open work items",
              "Everything scheduled for this bike is done. Add another work item, or mark the bike ready for collection.",
              `<button class="btn btn-primary" data-action="work:schedule" ${ids}>+ Add work item</button>`)}

        ${done.length ? `
          <details>
            <summary class="small muted" style="cursor:pointer;padding:6px 0">
              Completed on this bike (${done.length})
            </summary>
            <div style="margin-top:10px">${done.map(job => View.workJob(client, bike, job)).join("")}</div>
          </details>` : ""}
      </div>`;
  },

  /* --- tab: settings ---------------------------------------------------- */

  settingsTab(db) {
    const items = db.workItems.map(item => {
      const minutes = item.steps.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
      const steps = item.steps.map((s, i) => `
        <li>
          <span class="n">${i + 1}</span>
          <span>${esc(s.title)}${s.optional ? ` <span class="badge">Optional</span>` : ""}
            ${s.note ? `<br><span class="hint">${esc(s.note)}</span>` : ""}</span>
          <span class="spacer"></span>
          <span class="small muted nowrap">${[
            s.minutes ? "~" + Util.duration(s.minutes) : "",
            s.price ? "+" + esc(Util.money(s.price)) : "",
            s.specKey && SPEC_FIELDS.has(s.specKey) ? esc(SPEC_FIELDS.get(s.specKey).label) : ""
          ].filter(Boolean).join(" · ")}</span>
        </li>`).join("");

      return `
        <div class="card">
          <div class="row between">
            <div>
              <h3>${esc(item.name)}</h3>
              <p class="small muted">${esc(item.description || "")}</p>
            </div>
            <div class="row">
              <span class="chip">${esc(Util.money(item.price))}</span>
              <span class="chip">${item.steps.length} step${item.steps.length === 1 ? "" : "s"}</span>
              ${minutes ? `<span class="chip">~${esc(Util.duration(minutes))}</span>` : ""}
            </div>
          </div>
          ${steps ? `<ul class="wi-steps">${steps}</ul>`
                  : `<p class="small muted" style="margin-top:10px">No steps yet — edit it to add some.</p>`}
          <div class="row" style="margin-top:12px">
            <button class="btn btn-sm" data-action="item:edit" data-item="${esc(item.id)}">Edit</button>
            <button class="btn btn-sm" data-action="item:duplicate" data-item="${esc(item.id)}">Duplicate</button>
            <span class="spacer"></span>
            <button class="btn btn-sm btn-danger" data-action="item:delete" data-item="${esc(item.id)}">Delete</button>
          </div>
        </div>`;
    }).join("");

    return `
      <div class="stack">
        <div class="row between">
          <h2>Settings</h2>
          <button class="btn btn-primary" data-action="item:add">+ New work item</button>
        </div>

        <div class="card">
          <h3>Work items</h3>
          <p class="small muted" style="margin-top:6px">
            A work item is a priced job with an ordered list of steps — what gets scheduled when a client
            calls, and what a mechanic works down in the Work tab. Steps can carry guidance, a time
            estimate, extra labour, and the part they usually replace.
          </p>
          <p class="hint" style="margin-top:8px">
            Editing an item changes what is scheduled from now on. Work already scheduled or in progress
            keeps the steps it was created with, so nothing shifts under a mechanic mid-job.
          </p>
        </div>

        ${items || View.empty("🧾", "No work items yet",
          "Create the jobs your shop sells — a tune-up, a service, a wheel true — and they become schedulable.",
          `<button class="btn btn-primary" data-action="item:add">+ New work item</button>
           <button class="btn" data-action="item:restore">Restore the default set</button>`)}

        ${db.workItems.length ? `
          <div class="card">
            <h4>Defaults</h4>
            <p class="small muted" style="margin-top:6px">
              Adds the seven templates this app ships with, alongside whatever you already have.
            </p>
            <div class="row" style="margin-top:10px">
              <button class="btn" data-action="item:restore">+ Add the default work items</button>
            </div>
          </div>` : ""}
      </div>`;
  },

  /* --- tab: activity ---------------------------------------------------- */

  activityTab(db, filter) {
    const stats = Domain.stats(db);
    const entries = Domain.allEvents(db)
      .filter(({ event }) => filter === "all" || event.kind === filter)
      .slice(0, 200)
      .map(({ client, bike, event }) =>
        View.entry(client.id, bike.id, event, client.name + " · " + Domain.bikeTitle(bike)))
      .join("");

    const filterBtn = (id, label) =>
      `<button class="btn btn-sm ${filter === id ? "btn-primary" : ""}"
               data-action="activity:filter" data-filter="${id}">${esc(label)}</button>`;

    // The working board: everything the shop is currently responsible for,
    // with how far down its work list each bike is.
    const board = Domain.byStatus(Domain.allBikes(db).filter(({ bike }) => Domain.isActive(bike)))
      .filter(group => group.items.length)
      .map(({ status, items }) => items
        .sort((a, b) => Domain.bikeTitle(a.bike).localeCompare(Domain.bikeTitle(b.bike)))
        .map(({ client, bike }) => {
          const work = View.workLine(bike);
          return `
          <div class="spec-item" data-action="bike:open"
               data-client="${esc(client.id)}" data-bike="${esc(bike.id)}" style="cursor:pointer">
            <dt><span class="badge ${status.badge}">${esc(status.short)}</span>
                <strong style="color:var(--accent)">${esc(Domain.bikeTitle(bike))}</strong>
                ${work ? `<span class="small muted"> — ${esc(work)}</span>` : ""}</dt>
            <dd class="muted">${esc(client.name)}${
              bike.statusDate ? ` · since ${esc(Util.formatDate(bike.statusDate))}` : ""}</dd>
          </div>`;
        }).join("")).join("");

    return `
      <div class="stack">
        <h2>Activity</h2>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
          <div class="stat"><div class="n">${stats.clients}</div><div class="l">Clients</div></div>
          <div class="stat"><div class="n">${stats.bikes}</div><div class="l">Bikes</div></div>
          <div class="stat"><div class="n">${stats.byStatus.in_shop}</div><div class="l">In shop</div></div>
          <div class="stat"><div class="n">${stats.byStatus.completed}</div><div class="l">Awaiting pickup</div></div>
          <div class="stat"><div class="n">${stats.byStatus.scheduled}</div><div class="l">Scheduled</div></div>
          <div class="stat"><div class="n">${stats.openJobs}</div><div class="l">Open work items</div></div>
          <div class="stat"><div class="n">${stats.openSteps}</div><div class="l">Steps outstanding</div></div>
          <div class="stat"><div class="n money">${esc(Util.money(stats.bookedValue))}</div><div class="l">On the books</div></div>
          <div class="stat"><div class="n">${stats.workEntries}</div><div class="l">Jobs done</div></div>
          <div class="stat"><div class="n money">${esc(Util.money(stats.revenue))}</div><div class="l">Recorded spend</div></div>
        </div>
        ${board ? `
        <div class="card">
          <h3>On the books</h3>
          <p class="small muted" style="margin-top:4px">Bikes that are with us or due in.</p>
          <dl class="spec-grid one-per-line" style="margin-top:10px">${board}</dl>
        </div>` : ""}
        <div class="row">
          ${filterBtn("all", "Everything")} ${filterBtn("work", "Shop work")}
          ${filterBtn("owner", "Owner changes")} ${filterBtn("status", "Status changes")}
          ${filterBtn("edit", "Record edits")}
        </div>
        <div class="card">
          ${entries ? `<ul class="timeline">${entries}</ul>`
                    : View.empty("📋", "Nothing here yet", "Changelog entries from every bike show up in this feed.")}
        </div>
      </div>`;
  },

  /* --- tab: data -------------------------------------------------------- */

  dataTab(db) {
    const stats = Domain.stats(db);
    const bytes = new Blob([JSON.stringify(db)]).size;
    return `
      <div class="stack">
        <h2>Data</h2>
        <div class="card stack">
          <h3>Where your data lives</h3>
          <p class="small muted">
            Everything is stored in this browser only, under <code>${esc(CONFIG.storageKey)}</code>.
            It is not sent anywhere. Clearing browser data, or using a different browser,
            device or private window, means you will not see it. Export regularly.
          </p>
          <div class="row">
            <span class="chip">Clients: <strong>${stats.clients}</strong></span>
            <span class="chip">Bikes: <strong>${stats.bikes}</strong></span>
            <span class="chip">Work items: <strong>${stats.workItems}</strong></span>
            <span class="chip">Open jobs: <strong>${stats.openJobs}</strong></span>
            <span class="chip">Entries: <strong>${stats.entries}</strong></span>
            <span class="chip">Size: <strong>${(bytes / 1024).toFixed(1)} KB</strong></span>
            <span class="chip">Last saved: <strong>${db.updatedAt ? esc(new Date(db.updatedAt).toLocaleString(CONFIG.locale)) : "—"}</strong></span>
          </div>
        </div>

        <div class="card stack">
          <h3>Backup &amp; restore</h3>
          <p class="small muted">Export writes a JSON file containing every client, bike, work item and changelog entry.</p>
          <div class="row">
            <button class="btn btn-primary" data-action="data:export">⬇ Export JSON</button>
            <button class="btn" data-action="data:import">⬆ Import JSON…</button>
            <input type="file" id="import-file" accept="application/json,.json" class="sr-only">
          </div>
          <p class="hint">Importing replaces everything currently stored. Export first if in doubt.</p>
        </div>

        <div class="card stack">
          <h3>Test data</h3>
          <p class="small muted">
            For trying the app out. Generated clients are added alongside whatever is already
            stored; every form also has a 🎲 button that fills it in for you.
          </p>
          <div class="row">
            <button class="btn" data-action="data:generate" data-count="5">+ 5 random clients</button>
            <button class="btn" data-action="data:generate" data-count="25">+ 25 random clients</button>
            <button class="btn" data-action="data:sample">Load curated sample</button>
          </div>
          <p class="hint">
            Each generated client gets 1–3 bikes with a full build spec and up to 6 changelog entries.
            Bikes in the shop get scheduled work items, part-worked, so the Work tab has something in it.
          </p>
        </div>

        <div class="card stack">
          <h3>Danger zone</h3>
          <div class="row">
            <button class="btn btn-danger" data-action="data:reset">Delete everything</button>
          </div>
          <p class="hint">Clients, bikes, history and work items. The default work items come back.</p>
        </div>
      </div>`;
  }
};

/* ==========================================================================
   8. CONTROLLER — route state, render dispatch, delegated events
   ========================================================================== */

const App = {
  db: null,

  /**
   * The route carries two independent selections: where you are browsing
   * (clientId / bikeId) and which bike is open on the work bench
   * (workClientId / workBikeId). They are separate on purpose — looking up a
   * client's phone number must not close the job you are half way through.
   */
  route: { tab: "clients", clientId: null, bikeId: null, workClientId: null, workBikeId: null },
  ui: { searchClients: "", searchBikes: "", searchWork: "", activityFilter: "all" },

  navigate(patch) {
    Object.assign(App.route, patch);
    Store.saveRoute(App.route);
    App.render();
  },

  render() {
    const view = document.getElementById("view");
    document.getElementById("tabs").innerHTML = View.tabs(App.route, App.db);

    // Resolve the route defensively: entities can be deleted underneath it.
    const client = App.route.clientId ? Domain.client(App.db, App.route.clientId) : null;
    const bike = client && App.route.bikeId ? Domain.bike(App.db, client.id, App.route.bikeId) : null;

    let html;
    switch (App.route.tab) {
      case "bikes":    html = View.bikesTab(App.db, App.ui.searchBikes); break;
      case "work":     html = View.workTab(App.db, App.route, App.ui.searchWork); break;
      case "activity": html = View.activityTab(App.db, App.ui.activityFilter); break;
      case "settings": html = View.settingsTab(App.db); break;
      case "data":     html = View.dataTab(App.db); break;
      default:
        if (client && bike)  html = View.bikeDetail(App.db, client, bike);
        else if (client)     html = View.clientDetail(App.db, client);
        else                 html = View.clientList(App.db, App.ui.searchClients);
    }
    view.innerHTML = html;
  },

  /**
   * Re-render without throwing the user out of what they were doing.
   *
   * Views are HTML strings, so every render replaces the DOM wholesale — fine
   * for a page of cards, hostile to someone typing in a search box or ticking
   * their way down a checklist. Controls that can survive a render carry a
   * `data-focus-key`; this finds the same one afterwards and puts the caret
   * and the scroll position back.
   */
  renderKeepingPlace() {
    const active = document.activeElement;
    const key = active && active.getAttribute ? active.getAttribute("data-focus-key") : null;
    const start = active && "selectionStart" in active ? active.selectionStart : null;
    const end = active && "selectionEnd" in active ? active.selectionEnd : null;
    const scroll = window.scrollY;

    App.render();
    window.scrollTo(0, scroll);

    if (!key) return;
    const next = document.querySelector(`[data-focus-key="${key.replace(/"/g, '\\"')}"]`);
    if (!next) return;
    next.focus();
    try { if (start !== null) next.setSelectionRange(start, end); } catch { /* not a text field */ }
  }
};

/**
 * Delegated click handlers, keyed by the `data-action` attribute.
 * Each receives (dataset, element).
 */
const HANDLERS = {

  /* --- navigation --- */
  "tab": (d) => App.navigate({ tab: d.tab }),
  "nav:clients": () => App.navigate({ tab: "clients", clientId: null, bikeId: null }),
  "client:open": (d) => App.navigate({ tab: "clients", clientId: d.client, bikeId: null }),
  "bike:open":   (d) => App.navigate({ tab: "clients", clientId: d.client, bikeId: d.bike }),
  "activity:filter": (d) => { App.ui.activityFilter = d.filter; App.render(); },

  /** Open a bike on the bench. The only way into the work space. */
  "work:open": (d) => App.navigate({ tab: "work", workClientId: d.client, workBikeId: d.bike }),

  /* --- clients --- */
  "client:add": () => Modal.open({
    title: "New client",
    submitLabel: "Create client",
    build: (body) => body.append(Form.section("Client details", CLIENT_FIELDS, {})),
    randomize: Random.fillClientForm,
    onSubmit: (body) => {
      const values = Form.values(body);
      if (!values.name) return false;
      Actions.addClient(values);
    }
  }),

  "client:edit": (d) => {
    const client = Domain.client(App.db, d.client);
    Modal.open({
      title: "Edit client",
      build: (body) => body.append(Form.section("Client details", CLIENT_FIELDS, client)),
      randomize: Random.fillClientForm,
      onSubmit: (body) => {
        const values = Form.values(body);
        if (!values.name) return false;
        Actions.updateClient(client.id, values);
      }
    });
  },

  "client:delete": (d) => {
    const client = Domain.client(App.db, d.client);
    const msg = `Delete ${client.name}, their ${client.bikes.length} bike(s) and all changelog history?\n\nThis cannot be undone.`;
    if (confirm(msg)) Actions.deleteClient(client.id);
  },

  /* --- bikes --- */

  /**
   * The phone-call path: a bike nobody has seen yet.
   *
   * Nothing here is required. The point is to have something to hang work on
   * while the client is still on the line — the build spec can wait until the
   * bike is on the stand. Scheduling follows immediately by default, because
   * that is the reason anyone creates one of these.
   */
  "bike:stub": (d) => Modal.open({
    title: "New bike",
    submitLabel: "Create",
    width: 560,
    build: (body) => {
      body.append(Form.section("What the client told you", [
        { key: "label", label: "Working name", wide: true,
          placeholder: "e.g. Blue Trek commuter",
          hint: "However the shop will recognise it. Everything else can be filled in when it arrives." },
        { key: "brand", label: "Brand / Make", suggest: SPEC_FIELDS.get("brand").suggest },
        { key: "bikeType", label: "Type", suggest: SPEC_FIELDS.get("bikeType").suggest }
      ], {}));
      body.append(Util.el("fieldset", {}, [
        Util.el("div", { class: "field inline" }, [
          Util.el("input", { type: "checkbox", id: "then_schedule", checked: true }),
          Util.el("label", { for: "then_schedule", text: "Schedule work for it next" })
        ])
      ]));
    },
    onSubmit: (body) => {
      const values = Form.values(body);
      const schedule = body.querySelector("#then_schedule").checked;
      Actions.addBike(d.client, {
        label: values.label,
        stub: true,
        specs: { brand: values.brand || "", bikeType: values.bikeType || "" }
      }, {
        // Deferred: this form closes itself once onSubmit returns, which would
        // take the scheduling dialog down with it.
        then: (bike) => {
          if (schedule) setTimeout(() => HANDLERS["work:schedule"]({ client: d.client, bike: bike.id }), 0);
        }
      });
    }
  }),

  "bike:add": (d) => HANDLERS._bikeForm(d.client, null),
  "bike:edit": (d) => HANDLERS._bikeForm(d.client, d.bike),

  /** Shared add/edit bike form — the same fields either way. */
  _bikeForm(clientId, bikeId) {
    const bike = bikeId ? Domain.bike(App.db, clientId, bikeId) : null;
    const specs = bike ? bike.specs : {};

    Modal.open({
      title: bike ? "Edit bike details" : "New bike",
      submitLabel: bike ? "Save changes" : "Add bike",
      build: (body) => {
        body.append(Form.section("Identification", [
          { key: "label", label: "Nickname (optional)", wide: true,
            placeholder: "e.g. Blue gravel bike — how the shop refers to it",
            hint: "Leave blank to name the bike from its year, brand and model." }
        ], { label: bike ? bike.label : "" }));

        // Editing an existing record is itself logged, so offer a reason.
        if (bike) {
          body.append(Form.section("Why this edit", [
            { key: "editNote", label: "Reason / what you noticed", type: "textarea", wide: true,
              placeholder: "e.g. Spotted the bar tape was recorded wrong — it's always been red.",
              hint: "Optional. Any change you make below is recorded in the changelog as a dated “Record edit”." }
          ], {}));
        }

        SPEC_GROUPS.forEach(group =>
          body.append(Form.section(group.label, group.fields, specs, group.hint)));

        // "Other" — free-form rows, appended last.
        const rows = DynRows.container("kv");
        ((bike && bike.other) || []).forEach(entry => rows.append(DynRows.kvRow(entry)));
        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Other" }),
            Util.el("div", { class: "hint", text: "Anything else worth keeping: fit numbers, insurance, quirks, history." })
          ]),
          rows,
          DynRows.addButton("+ Add entry", rows, () => DynRows.kvRow())
        ]));
      },
      randomize: Random.fillBikeForm,
      onSubmit: (body) => {
        const values = Form.values(body);
        // Pull the non-spec fields out before the rest becomes `specs`.
        const label = values.label || "";
        const note = values.editNote || "";
        delete values.label;
        delete values.editNote;

        const data = { label, specs: values, other: DynRows.parseKV(body) };
        if (bike) Actions.updateBike(clientId, bike.id, data, note);
        else Actions.addBike(clientId, data);
      }
    });
  },

  /**
   * The counter's one click: the bike is here.
   *
   * It goes straight onto the work board, and the mechanic's view of it opens,
   * because in practice whoever takes the bike in is often the one who starts
   * looking at it.
   */
  "bike:checkin": (d) => {
    Actions.setBikeStatus(d.client, d.bike, "in_shop");
    App.navigate({ tab: "work", workClientId: d.client, workBikeId: d.bike });
  },

  /**
   * Re-tag a bike's place in the shop workflow.
   *
   * Marking work completed is the move that gets in the way first: if work
   * items are still open, saying the job is finished is nearly always somebody
   * forgetting to close them out. The warning offers the work space rather
   * than just refusing.
   */
  "bike:status": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const open = bike ? Domain.openJobs(bike) : [];

    if (d.status !== "completed" || !open.length) {
      Actions.setBikeStatus(d.client, d.bike, d.status);
      return;
    }

    Modal.ask({
      title: "Work still open",
      message:
        `“${Domain.bikeTitle(bike)}” still has ${open.length} work item${open.length === 1 ? "" : "s"} `
        + `outstanding: ${open.map(j => j.name).join(", ")}.\n\n`
        + `Completing a work item is what writes it to the bike's history and charges for it — `
        + `marking the bike done now leaves that record unwritten.`,
      actions: [
        { label: "Mark completed anyway", run: () => Actions.setBikeStatus(d.client, d.bike, "completed") },
        { label: "Open the work space", class: "btn-primary",
          run: () => App.navigate({ tab: "work", workClientId: d.client, workBikeId: d.bike }) }
      ]
    });
  },

  "bike:delete": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    if (confirm(`Delete “${Domain.bikeTitle(bike)}” and its ${bike.events.length} changelog entr(ies)?\n\nThis cannot be undone.`)) {
      Actions.deleteBike(d.client, d.bike);
    }
  },

  /* --- scheduling work --- */

  /**
   * Put work items on a bike. Used from three places with the same dialog:
   * booking a phone call in, adding to a bike that has just arrived, and the
   * mid-job "while it was up on the stand" case from the work space.
   */
  "work:schedule": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    if (!bike) return;

    if (!App.db.workItems.length) {
      Modal.ask({
        title: "No work items yet",
        message: "Work is scheduled by picking a work item — a priced job with a list of steps.\n\n"
               + "Create some in Settings first; the app ships with a default set you can start from.",
        actions: [{ label: "Open Settings", class: "btn-primary", run: () => App.navigate({ tab: "settings" }) }]
      });
      return;
    }

    const inShop = Domain.status(bike).id === "in_shop";

    Modal.open({
      title: `Schedule work — ${Domain.bikeTitle(bike)}`,
      submitLabel: "Schedule",
      build: (body) => {
        const list = Util.el("div", { class: "pick-list" }, App.db.workItems.map(item => {
          const minutes = item.steps.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
          return Util.el("label", { class: "pick" }, [
            Util.el("input", { type: "checkbox", "data-pick": item.id }),
            Util.el("div", {}, [
              Util.el("div", { class: "row", style: "gap:8px" }, [
                Util.el("strong", { text: item.name }),
                Util.el("span", { class: "chip", text: Util.money(item.price) }),
                Util.el("span", { class: "chip", text: item.steps.length + " steps" }),
                minutes ? Util.el("span", { class: "chip", text: "~" + Util.duration(minutes) }) : null
              ]),
              item.description ? Util.el("div", { class: "hint", text: item.description }) : null
            ])
          ]);
        }));

        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Work items" }),
            Util.el("div", { class: "hint", text: "Each one becomes its own checklist on the bike, and its own changelog entry when it is finished." })
          ]),
          list
        ]));

        body.append(Form.section("The request", [
          { key: "request", label: "What the client asked for", type: "textarea", wide: true,
            placeholder: "In their words — “gears skip under load going uphill, needs it by Friday”.",
            hint: "Shown to whoever picks the bike up in the Work tab." },
          { key: "date", label: inShop ? "Date added" : "Expected in", type: "date" }
        ], { date: Util.today() }));
      },
      onSubmit: (body) => {
        const ids = Array.from(body.querySelectorAll("[data-pick]:checked")).map(i => i.dataset.pick);
        if (!ids.length) return false;
        const values = Form.values(body);
        Actions.scheduleWork(d.client, d.bike, ids, { request: values.request, date: values.date });
      }
    });
  },

  "job:delete": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const job = Domain.job(bike, d.job);
    if (!job) return;
    const msg = job.status === "done"
      ? `Remove “${job.name}” from this bike's board?\n\nThe changelog entry it wrote stays where it is.`
      : `Cancel “${job.name}”?\n\nAny notes, times and part changes recorded against its steps are lost.`;
    if (confirm(msg)) Actions.deleteJob(d.client, d.bike, d.job);
  },

  /* --- working through a job --- */

  /**
   * Tick a step.
   *
   * The browser has already flipped `checked` by the time this runs, and the
   * delegated listener's `preventDefault` then flips it back — so `el.checked`
   * is the state the user asked for, and the re-render draws it from the
   * database. What is on screen is always what is stored.
   */
  "step:toggle": (d, el) => Actions.setStepDone(d.client, d.bike, d.job, d.step, el.checked),

  /** Record what was actually swapped during a step. */
  "step:parts": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const job = Domain.job(bike, d.job);
    const step = Domain.step(job, d.step);
    if (!step) return;

    Modal.open({
      title: `Parts — ${step.title}`,
      submitLabel: "Add to step",
      build: (body) => {
        const rows = DynRows.container("change");
        // A step that names the part it usually replaces points the first row
        // at it: the mechanic confirms rather than hunts.
        rows.append(DynRows.changeRow(bike, step.specKey));
        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Part changes" }),
            Util.el("div", { class: "hint", text: "Applied to the bike's specification when this work item is completed, and recorded as a before → after in the changelog." })
          ]),
          rows,
          DynRows.addButton("+ Add another", rows, () => DynRows.changeRow(bike, ""))
        ]));
      },
      onSubmit: (body) => {
        const changes = DynRows.parseChanges(body, bike);
        if (!changes.length) return false;
        Actions.addStepChanges(d.client, d.bike, d.job, d.step, changes);
      }
    });
  },

  "step:part-remove": (d) => Actions.removeStepChange(d.client, d.bike, d.job, d.step, d.change),

  /**
   * Finish a work item: the moment the job becomes history.
   *
   * Required steps that are still open stop this once — an optional step
   * nobody did is normal, a required one is usually an oversight.
   */
  "job:complete": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const job = Domain.job(bike, d.job);
    if (!job || job.status === "done") return;
    const stats = Domain.jobStats(job);

    const form = () => HANDLERS._completeForm(d, bike, job, stats);

    if (stats.openRequired) {
      Modal.ask({
        title: "Required steps not ticked",
        message: `${stats.openRequired} required step${stats.openRequired === 1 ? " is" : "s are"} still open on `
               + `“${job.name}”:\n\n`
               + job.steps.filter(s => !s.done && !s.optional).map(s => "• " + s.title).join("\n"),
        actions: [
          { label: "Complete anyway", run: form },
          { label: "Back to the steps", class: "btn-primary", run: () => {} }
        ]
      });
      return;
    }
    form();
  },

  /** The completion form: who, when, what it says, and what it costs. */
  _completeForm(d, bike, job, stats) {
    Modal.open({
      title: `Complete — ${job.name}`,
      submitLabel: "Complete and log it",
      build: (body) => {
        body.append(Form.section("Sign-off", [
          { key: "by", label: "Completed by", placeholder: "Mechanic name" },
          { key: "date", label: "Date", type: "date" },
          { key: "cost", label: "Total charged",
            hint: `${Util.money(job.price)} item`
                + (stats.stepCharges ? ` + ${Util.money(stats.stepCharges)} steps` : "")
                + (stats.partsCost ? ` + ${Util.money(stats.partsCost)} parts` : "")
                + ` = ${Util.money(stats.charge)}` }
        ], { by: App.db.settings.lastBy || "", date: Util.today(), cost: String(stats.charge) }));

        body.append(Form.section("What went in the log", [
          { key: "description", label: "Entry", type: "textarea", wide: true, rows: 8,
            hint: "Built from the steps you ticked, their times and their notes. Edit freely — this is what the client's history will say." }
        ], { description: Domain.jobSummary(job) }));

        if (stats.parts) {
          const changes = Domain.jobChanges(bike, job);
          body.append(Util.el("fieldset", {}, [
            Util.el("legend", {}, [
              Util.el("h4", { text: "Parts applied to the bike" }),
              Util.el("div", { class: "hint", text: "Saving updates the bike's live specification to these values." })
            ]),
            Util.el("ul", { class: "diff-list" }, changes.map(ch => Util.el("li", {
              text: `${Domain.changeLabel(ch)}: ${ch.from || "(empty)"} → ${ch.to || "—"}`
                  + (ch.cost ? ` · ${Util.money(ch.cost)}` : "")
            })))
          ]));
        }
      },
      onSubmit: (body) => {
        const values = Form.values(body);
        Actions.completeJob(d.client, d.bike, d.job, values);

        // With nothing left open, the bike itself is done — offer the move
        // rather than making someone remember to go and find it.
        const bikeNow = Domain.bike(App.db, d.client, d.bike);
        if (bikeNow && !Domain.openJobs(bikeNow).length && Domain.status(bikeNow).id === "in_shop") {
          setTimeout(() => Modal.ask({
            title: "All work finished",
            message: `Nothing is outstanding on “${Domain.bikeTitle(bikeNow)}”.\n\n`
                   + `Mark it completed so the front counter knows it is ready for collection?`,
            actions: [{ label: "Mark work completed", class: "btn-primary",
                        run: () => Actions.setBikeStatus(d.client, d.bike, "completed") }]
          }), 0);
        }
      }
    });
  },

  /* --- work items (Settings) --- */

  "item:add": () => HANDLERS._itemForm(null),
  "item:edit": (d) => HANDLERS._itemForm(d.item),
  "item:duplicate": (d) => Actions.duplicateWorkItem(d.item),
  "item:restore": () => Actions.restoreDefaultWorkItems(),

  "item:delete": (d) => {
    const item = Domain.workItem(App.db, d.item);
    if (!item) return;
    if (confirm(`Delete the work item “${item.name}”?\n\nWork already scheduled or completed keeps its own copy of the steps and is not affected.`)) {
      Actions.deleteWorkItem(d.item);
    }
  },

  /** Shared new/edit template form. Steps are dynamic rows in order. */
  _itemForm(itemId) {
    const item = itemId ? Domain.workItem(App.db, itemId) : null;

    Modal.open({
      title: item ? "Edit work item" : "New work item",
      submitLabel: item ? "Save changes" : "Create work item",
      width: 820,
      build: (body) => {
        body.append(Form.section("The job", [
          { key: "name", label: "Name", required: true, wide: true, placeholder: "e.g. Basic tune-up" },
          { key: "price", label: "Price", placeholder: "0.00",
            hint: "The base charge. Step labour and parts are added on top." },
          { key: "description", label: "What it covers", type: "textarea", wide: true,
            placeholder: "One or two lines, shown when scheduling and on the bench." }
        ], item || {}));

        const rows = DynRows.container("step-editor");
        ((item && item.steps) || []).forEach(step => rows.append(DynRows.stepRow(step)));
        if (!item) rows.append(DynRows.stepRow());

        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Steps" }),
            Util.el("div", { class: "hint", text: "In the order they are done. Guidance shows under the step on the bench; “usually replaces” pre-selects the part when a mechanic records a swap." })
          ]),
          rows,
          DynRows.addButton("+ Add step", rows, () => DynRows.stepRow())
        ]));
      },
      randomize: Random.fillWorkItemForm,
      onSubmit: (body) => {
        const values = Form.values(body);
        if (!values.name) return false;
        const data = Object.assign({}, values, { steps: DynRows.parseSteps(body) });
        if (item) Actions.updateWorkItem(item.id, data);
        else Actions.addWorkItem(data);
      }
    });
  },

  /* --- changelog --- */

  /**
   * Add work / add owner change by hand.
   *
   * The step flow covers scheduled work; this is the escape hatch for
   * everything else — a five-minute favour at the counter, a warranty claim,
   * something a mechanic did before the job was ever booked in.
   */
  "event:add": (d, _el, opts = {}) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const kind = (ENTRY_KINDS[d.kind] || {}).manual ? d.kind : "work";
    const meta = ENTRY_KINDS[kind];

    Modal.open({
      title: meta.verb + " — " + Domain.bikeTitle(bike),
      submitLabel: "Save to changelog",
      build: (body) => {
        body.append(Form.section("What happened", [
          { key: "date",  label: "Date", type: "date" },
          { key: "by",    label: meta.byLabel, placeholder: meta.byPlaceholder },
          { key: "title", label: "Summary", required: true, wide: true, placeholder: meta.titlePlaceholder },
          { key: "description", label: "Details", type: "textarea", wide: true,
            placeholder: "Notes for future reference: what was found, what was done, what to watch." }
        ], { date: Util.today(), by: kind === "work" ? (App.db.settings.lastBy || "") : "" }));

        // Part changes — each one updates the bike's current spec on save.
        const rows = DynRows.container("change");
        rows.append(DynRows.changeRow(bike));
        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Part changes" }),
            Util.el("div", { class: "hint", text: "Each row updates the bike's current specification and is recorded as a before → after in the changelog." })
          ]),
          rows,
          DynRows.addButton("+ Add part change", rows, () => DynRows.changeRow(bike))
        ]));

        body.append(Form.section("Cost", [
          { key: "cost", label: kind === "work" ? "Total charged" : "Cost (if known)",
            placeholder: "0.00", hint: "Parts and labour combined." }
        ], {}));
      },
      randomize: (body) => Random.fillEventForm(body, bike, kind),
      onSubmit: (body) => {
        const values = Form.values(body);
        if (!values.title) return false;
        Actions.addEvent(d.client, d.bike, {
          kind,
          date: values.date || Util.today(),
          by: values.by,
          title: values.title,
          description: values.description,
          cost: values.cost,
          changes: DynRows.parseChanges(body, bike)
        });
        if (opts.onSaved) opts.onSaved();
      }
    });
  },

  "event:delete": (d) => {
    if (confirm("Delete this changelog entry?\n\nThe bike's current specification will NOT be reverted.")) {
      Actions.deleteEvent(d.client, d.bike, d.event);
    }
  },

  /* --- data --- */
  "data:export": () => {
    const stamp = new Date().toISOString().slice(0, 10);
    Util.download(`bikeshop-backup-${stamp}.json`, JSON.stringify(App.db, null, 2));
  },

  "data:import": () => document.getElementById("import-file").click(),

  "data:generate": (d) => {
    const count = Math.min(parseInt(d.count, 10) || 5, 200);
    Actions.commit(db => {
      for (let i = 0; i < count; i++) db.clients.push(Random.fullClient(db.workItems));
    });
    Store.flashStatus(`Generated ${count} random client(s)`);
  },

  "data:sample": () => {
    if (App.db.clients.length && !confirm("Loading sample data replaces everything currently stored. Continue?")) return;
    Actions.replaceDatabase(SAMPLE_DATA());
  },

  "data:reset": () => {
    if (!confirm("Delete every client, bike, work item and changelog entry?\n\nThis cannot be undone. Export a backup first if you might want it back.")) return;
    if (!confirm("Really delete everything?")) return;
    Actions.replaceDatabase(Store.empty());
  }
};

/**
 * Live-editing handlers, keyed by `data-input`. These fire on every keystroke,
 * so they save quietly and re-render only when the screen must actually change.
 */
const INPUTS = {
  /** Filter boxes: the list behind them has to change, so this re-renders. */
  "search": (d, el) => {
    App.ui[d.scope] = el.value;
    App.renderKeepingPlace();
  },

  /**
   * Minutes and notes inside a step. Nothing else on screen depends on them,
   * so there is deliberately no re-render here — the mechanic keeps typing and
   * the value is already in the database.
   */
  "step:field": (d, el) => Actions.setStepField(d.client, d.bike, d.job, d.step, d.field, el.value)
};

/* ==========================================================================
   9. BOOTSTRAP
   ========================================================================== */

/** Single click listener for the whole app; finds the nearest data-action. */
document.addEventListener("click", (ev) => {
  const target = ev.target.closest("[data-action]");
  if (!target || target.closest(".modal")) return;   // modals wire their own handlers
  const handler = HANDLERS[target.dataset.action];
  if (!handler) return;
  ev.preventDefault();
  handler(target.dataset, target);
});

/** Single input listener: search boxes and the live fields in the work space. */
document.addEventListener("input", (ev) => {
  const target = ev.target.closest("[data-input]");
  if (!target || target.closest(".modal")) return;
  const handler = INPUTS[target.dataset.input];
  if (handler) handler(target.dataset, target);
});

/**
 * A debounced save is still pending when a tab is closed or hidden. Flush it
 * — losing the last sentence a mechanic typed would undermine the whole point
 * of the work space.
 */
window.addEventListener("pagehide", () => Store.flush(App.db));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") Store.flush(App.db);
});

/** File picker for JSON import. */
document.addEventListener("change", (ev) => {
  if (ev.target.id !== "import-file") return;
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.clients)) throw new Error("Not a registry backup file.");
      const count = data.clients.length;
      if (confirm(`Import ${count} client(s)? This replaces everything currently stored.`)) {
        Actions.replaceDatabase(data);
      }
    } catch (err) {
      alert("Could not import that file: " + err.message);
    }
    ev.target.value = "";
  };
  reader.readAsText(file);
});

/**
 * Demo content so the app can be evaluated without typing everything in.
 * It deliberately covers the whole shape of the workflow: a bike on the bench
 * with a half-finished tune-up, a stub booked in over the phone, and a bike
 * with nothing outstanding.
 */
function SAMPLE_DATA() {
  const db = Store.empty();
  const itemNamed = (name) => db.workItems.find(w => w.name === name);

  /* --- Dana: gravel bike on the bench, mid tune-up --- */
  const client = Domain.newClient({
    name: "Dana Whitfield", phone: "555-0142", email: "dana.w@example.com",
    notes: "Rides most weekends. Prefers a call before any work over $150."
  });

  const bike = Domain.newBike({
    label: "Blue gravel bike",
    status: "in_shop", statusDate: Util.today(),
    specs: {
      brand: "Salsa", model: "Warbird", year: "2022", bikeType: "Gravel",
      frameMaterial: "Carbon", frameSize: "54", serial: "WB22-884120", color: "Deep blue",
      groupset: "Shimano GRX", drivetrain: "2x11", brakeType: "Hydraulic disc",
      wheelset: "DT Swiss G1800", tires: "Panaracer GravelKing SK 700x43",
      crankset: "GRX FC-RX810", cassette: "11-34", chain: "Shimano HG601",
      saddle: "Fizik Argo Tempo", barTape: "Lizard Skins 3.2mm", pedals: "Shimano XT M8100",
      tubeless: "Yes — sealant"
    },
    other: [
      { id: Util.uid("o"), label: "Fit measurements", value: "Saddle height 742mm, setback 65mm" },
      { id: Util.uid("o"), label: "Purchased", value: "March 2022, from us" }
    ]
  });

  bike.events.push(
    Domain.newEvent({
      kind: "work", date: "2026-03-14", by: "Ellis", title: "Spring service",
      description: "Full strip and clean, bled both brakes, trued rear wheel. Chain at 0.6% — replaced.",
      cost: "145", changes: [
        { target: "spec", key: "chain", label: "Chain", from: "Shimano HG601", to: "Shimano HG601 (new)", cost: 32 }
      ]
    }),
    Domain.newEvent({
      kind: "owner", date: "2026-06-02", by: "Owner", title: "Fitted own saddle",
      description: "Swapped to a saddle brought back from a bike fit elsewhere.",
      cost: "0", changes: [
        { target: "spec", key: "saddle", label: "Saddle", from: "Fizik Argo Tempo", to: "Specialized Power Expert", cost: 0 }
      ]
    })
  );

  // A tune-up part-way down the list: four steps ticked, one with a part on it.
  const tuneUp = Domain.newJob(itemNamed("Basic tune-up"), {
    request: "Gears skip under load going uphill, and the rear brake feels soft. Needs it by Friday."
  });
  tuneUp.status = "active";
  tuneUp.startedAt = Date.now();
  ["Intake check and test ride", "Wash and degrease drivetrain", "Measure chain wear", "Index gears, front and rear"]
    .forEach((title, i) => {
      const step = tuneUp.steps.find(s => s.title === title);
      if (!step) return;
      step.done = true;
      step.doneAt = Date.now();
      step.minutes = [10, 20, 5, 25][i];
    });
  const chainStep = tuneUp.steps.find(s => s.title === "Measure chain wear");
  chainStep.notes = "0.9% — well past it. Cassette teeth hooked too, quoted the client.";
  chainStep.changes.push({
    id: Util.uid("ch"), target: "spec", key: "chain", label: "Chain",
    from: "Shimano HG601 (new)", to: "Shimano HG601", cost: 34
  });
  const gearStep = tuneUp.steps.find(s => s.title === "Index gears, front and rear");
  gearStep.notes = "Hanger was 4mm out. Straightened, indexes cleanly now.";
  bike.jobs.push(tuneUp);

  const commuter = Domain.newBike({
    specs: {
      brand: "Trek", model: "FX 3 Disc", year: "2019", bikeType: "Hybrid",
      frameMaterial: "Aluminium", frameSize: "M", color: "Matte black",
      drivetrain: "2x9", brakeType: "Hydraulic disc", tires: "Bontrager H2 700x35"
    }
  });

  client.bikes.push(bike, commuter);

  /* --- Marco: a stub booked in over the phone this morning --- */
  const second = Domain.newClient({ name: "Marco Reyes", phone: "555-0197", company: "Northside Couriers" });

  const stub = Domain.newBike({
    label: "Courier singlespeed",
    stub: true,
    status: "scheduled", statusDate: Util.today(),
    specs: { brand: "Surly", bikeType: "Commuter" }
  });
  stub.jobs.push(Domain.newJob(itemNamed("Full service"), {
    request: "Hasn't been serviced since he bought it. Rides it every day in all weather — do whatever it needs."
  }));
  stub.events.push(Domain.newEvent({
    kind: "status", date: Util.today(), title: "Scheduled for work",
    description: "Full service\nHasn't been serviced since he bought it.",
    changes: [{ target: "note", key: "status", label: "Status", from: "Out of shop", to: "Scheduled for work", cost: 0 }]
  }));
  second.bikes.push(stub);

  db.clients.push(client, second);
  return db;
}

/* Start. */
App.db = Store.load();
Object.assign(App.route, Store.loadRoute() || {});
App.render();
</script>
