<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike Shop — Workshop Registry</title>
<style>
/* ==========================================================================
   STYLES
   Organised as: tokens -> base -> layout -> components -> utilities
   ========================================================================== */

/* --- tokens -------------------------------------------------------------- */
:root {
  --bg:        #f4f5f7;
  --surface:   #ffffff;
  --surface-2: #f0f2f5;
  --border:    #dce0e6;
  --text:      #1c2024;
  --text-dim:  #666e79;
  --accent:    #1f6feb;
  --accent-fg: #ffffff;
  --work:      #0f7b55;
  --work-bg:   #e2f5ec;
  --owner:     #9a5b00;
  --owner-bg:  #fdf0da;
  --edit:      #5b52b8;
  --edit-bg:   #ebe9fa;
  --danger:    #c02626;
  /* workflow status */
  --st-in:     #1f6feb;
  --st-in-bg:  #e6efff;
  --st-done:   #0f7b55;
  --st-done-bg:#e2f5ec;
  --st-sched:  #9a5b00;
  --st-sched-bg:#fdf0da;
  --radius:    8px;
  --shadow:    0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.05);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #16181c;
    --surface:   #1e2126;
    --surface-2: #24282e;
    --border:    #343a42;
    --text:      #e6e8ea;
    --text-dim:  #98a0aa;
    --accent:    #4c8dff;
    --accent-fg: #0b1220;
    --work:      #4ad6a0;
    --work-bg:   #12332a;
    --owner:     #f0b45e;
    --owner-bg:  #382a13;
    --edit:      #a79cf5;
    --edit-bg:   #262341;
    --danger:    #ff6b6b;
    --st-in:     #4c8dff;
    --st-in-bg:  #16233d;
    --st-done:   #4ad6a0;
    --st-done-bg:#12332a;
    --st-sched:  #f0b45e;
    --st-sched-bg:#382a13;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}

/* --- base ---------------------------------------------------------------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
h1 { font-size: 20px; }
h2 { font-size: 18px; }
h3 { font-size: 16px; }
h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
p  { margin: 0; }
a  { color: var(--accent); }

/* --- layout -------------------------------------------------------------- */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.app-header .bar {
  max-width: 1180px; margin: 0 auto; padding: 14px 20px 0;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.logo { font-size: 22px; }
.tabs {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px 0;
  display: flex; gap: 4px; flex-wrap: wrap;
}
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; color: var(--text-dim);
  padding: 8px 14px; border-radius: var(--radius) var(--radius) 0 0;
  border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px;
  background: var(--st-in-bg); color: var(--st-in); font-size: 11px; font-weight: 700;
}
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 80px; }
.stack > * + * { margin-top: 16px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1 1 auto; }

/* --- components ---------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--accent); }
.card-title { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }

/* A bike card wears its workflow status as a coloured edge; "out of shop"
   is the resting state and deliberately gets no stripe. */
.card[data-status] { border-left-width: 3px; }
.card[data-status="in_shop"]   { border-left-color: var(--st-in); }
.card[data-status="completed"] { border-left-color: var(--st-done); }
.card[data-status="scheduled"] { border-left-color: var(--st-sched); }

.btn {
  appearance: none; font: inherit; cursor: pointer;
  padding: 7px 13px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  white-space: nowrap;
}
.btn:hover { border-color: var(--text-dim); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: none; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { color: var(--danger); border-color: transparent; background: none; }
.btn-danger:hover { background: var(--surface-2); }
.btn-sm { padding: 4px 9px; font-size: 13px; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text-dim);
}
.badge-work  { background: var(--work-bg);  color: var(--work); }
.badge-owner { background: var(--owner-bg); color: var(--owner); }
.badge-edit  { background: var(--edit-bg);  color: var(--edit); }
/* workflow status badges — one per BIKE_STATUSES entry, plus the log badge */
.badge-in     { background: var(--st-in-bg);    color: var(--st-in); }
.badge-done   { background: var(--st-done-bg);  color: var(--st-done); }
.badge-sched  { background: var(--st-sched-bg); color: var(--st-sched); }
.badge-out    { background: var(--surface-2);   color: var(--text-dim); }
.badge-status { background: var(--st-in-bg);    color: var(--st-in); }
.chip {
  display: inline-block; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 12px; color: var(--text-dim);
}
.chip strong { color: var(--text); font-weight: 600; }

/* status control (bike page) */
.status-bar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
}
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button {
  appearance: none; font: inherit; font-size: 13px; cursor: pointer;
  background: var(--surface); color: var(--text-dim);
  border: 0; border-left: 1px solid var(--border); padding: 6px 11px; white-space: nowrap;
}
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--surface-2); color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }

.status-group + .status-group { margin-top: 22px; }
.status-group > .grid { margin-top: 10px; }

.breadcrumb { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
.breadcrumb button {
  appearance: none; border: 0; background: none; font: inherit; color: var(--accent);
  cursor: pointer; padding: 0;
}

.empty {
  text-align: center; padding: 46px 20px; color: var(--text-dim);
  border: 1px dashed var(--border); border-radius: var(--radius);
}
.empty .big { font-size: 30px; display: block; margin-bottom: 8px; }

.search {
  flex: 1 1 200px; min-width: 160px;
  padding: 8px 11px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit;
}

/* spec tables */
.spec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 18px; }
/* Same rows, one per line — for lists that read as a worklist, not a spec sheet. */
.spec-grid.one-per-line { grid-template-columns: 1fr; }
.spec-item { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
.spec-item dt { color: var(--text-dim); }
.spec-item dd { margin: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; }

/* changelog timeline */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline > li { position: relative; padding: 0 0 18px 22px; border-left: 2px solid var(--border); }
.timeline > li:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline > li::before {
  content: ""; position: absolute; left: -7px; top: 4px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--text-dim);
}
.timeline > li.type-work::before  { border-color: var(--work); }
.timeline > li.type-owner::before { border-color: var(--owner); }
/* Record edits are hollow-dotted: the log moved, the bike did not. */
.timeline > li.type-edit::before  { border-color: var(--edit); border-style: dotted; }
.timeline > li.type-status::before { border-color: var(--st-in); }
.entry-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.entry-date { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.entry-body { margin-top: 4px; white-space: pre-wrap; }
.diff-list { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
.diff-list li { padding: 3px 0; }
.diff-label { color: var(--text-dim); }
.diff-from { text-decoration: line-through; opacity: .7; }
.diff-to   { font-weight: 600; }
.diff-arrow { color: var(--text-dim); padding: 0 4px; }

/* stats */
.stat { background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; }
.stat .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }

/* --- work tab ------------------------------------------------------------ */
/* Rail on the left is the "who is on the stand" list; the workspace on the
   right is where a mechanic actually spends the afternoon. */
.work-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .work-layout { grid-template-columns: 1fr; } }

.rail { display: flex; flex-direction: column; gap: 8px; }
.rail h4 { margin: 6px 2px 0; }
.rail-item {
  width: 100%; text-align: left; font: inherit; cursor: pointer;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--radius);
  padding: 10px 12px;
}
.rail-item:hover { border-color: var(--accent); }
.rail-item[data-status="in_shop"]   { border-left-color: var(--st-in); }
.rail-item[data-status="completed"] { border-left-color: var(--st-done); }
.rail-item[data-status="scheduled"] { border-left-color: var(--st-sched); }
.rail-item[aria-current="true"] { background: var(--surface-2); border-color: var(--accent); }
.rail-item .t { font-weight: 600; display: block; }
.rail-item .s { font-size: 12px; color: var(--text-dim); display: block; }

.progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 8px 0 6px; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .15s ease; }
.progress.full > span { background: var(--work); }

.job-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 14px; }
.job-card + .job-card { margin-top: 14px; }
.job-card.is-done { background: var(--surface-2); }
.job-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.job-request {
  margin-top: 10px; padding: 9px 11px; border-radius: 6px;
  background: var(--owner-bg); color: var(--owner); font-size: 13px; white-space: pre-wrap;
}

.steps { list-style: none; margin: 12px 0 0; padding: 0; }
.step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.step input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; cursor: pointer; accent-color: var(--accent); }
.step-title { font-weight: 600; }
.step.done .step-title { color: var(--text-dim); text-decoration: line-through; }
.step-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.step-note { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.step-fields { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 8px; margin-top: 8px; align-items: center; }
@media (max-width: 620px) { .step-fields { grid-template-columns: 1fr; } }
.step-fields input {
  font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%;
}
.step-fields input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.step-parts { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
.step-parts li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }

/* --- settings: work item templates --------------------------------------- */
.wi-steps { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.wi-steps li { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px dashed var(--border); }
.wi-steps .n { color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 22px; }
.pick-list { display: flex; flex-direction: column; gap: 8px; }
.pick {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; cursor: pointer;
}
.pick:hover { border-color: var(--accent); }
.pick input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--accent); }

/* --- forms & modal ------------------------------------------------------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px; overflow-y: auto; z-index: 100;
}
.modal {
  background: var(--surface); border-radius: 10px; border: 1px solid var(--border);
  width: min(760px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,.35);
  display: flex; flex-direction: column; max-height: calc(100vh - 48px);
}
.modal header, .modal footer { padding: 14px 18px; }
.modal header { border-bottom: 1px solid var(--border); }
.modal footer { border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); border-radius: 0 0 10px 10px; }
.modal .body { padding: 18px; overflow-y: auto; }
.modal .body > * + * { margin-top: 16px; }

fieldset { border: 0; padding: 0; margin: 0; }
fieldset + fieldset { margin-top: 18px; }
legend { padding: 0 0 8px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--text-dim); font-weight: 600; }
.field input, .field textarea, .field select {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; width: 100%;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.field textarea { min-height: 76px; resize: vertical; }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline input { width: auto; }
.hint { font-size: 12px; color: var(--text-dim); }

.dyn-row { display: grid; gap: 8px; align-items: end; margin-bottom: 8px; }
.dyn-row.kv     { grid-template-columns: 1fr 1.4fr auto; }
.dyn-row.change { grid-template-columns: 1.1fr 1.3fr .6fr auto; }
/* Template steps are a small block rather than a single line — six controls
   in a row is unreadable, and the order of steps matters, so they carry
   their own move buttons. */
.dyn-row.step-editor {
  display: block; border: 1px solid var(--border); border-radius: 6px;
  padding: 10px; background: var(--surface-2);
}
.dyn-row.step-editor .sub { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
.dyn-row.step-editor .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
@media (max-width: 620px) {
  .dyn-row.kv, .dyn-row.change { grid-template-columns: 1fr; }
}
.dyn-note { font-size: 12px; color: var(--text-dim); margin: -4px 0 8px; }

.muted { color: var(--text-dim); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.money { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header class="app-header">
  <div class="bar">
    <span class="logo" aria-hidden="true">🚲</span>
    <h1>Bike Shop Registry</h1>
    <span class="spacer"></span>
    <span id="save-status" class="small muted"></span>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main id="view" role="main"></main>

<div id="modal-root"></div>

<script>
"use strict";
/* ==========================================================================
   Bike Shop Registry — single-file client, bike and workshop tracker
   --------------------------------------------------------------------------
   ARCHITECTURE (top to bottom, each layer only depends on the ones above it):

     1. CONFIG & SCHEMA   Declarative description of bike spec fields, workflow
                          statuses and the default work-item templates.
     2. UTIL              Pure helpers (ids, escaping, formatting, DOM build).
     3. STORE             localStorage persistence + in-memory database.
     4. DOMAIN            Entity factories, lookups and derived values.
     5. ACTIONS           The only functions that mutate the db.
     6. COMPONENTS        Reusable render helpers (modal, forms, dynamic rows).
     7. VIEWS             Pure render functions: state -> HTML string / DOM.
     8. CONTROLLER        Router state + delegated click/input handlers.
     9. BOOTSTRAP         Wire it all up.

   THE WORKFLOW THIS APP IS SHAPED AROUND
     1. A call comes in. The client is created, and a *stub* bike is created
        with whatever the client can tell you — it does not exist in the shop
        yet, so nothing is required.
     2. Work is scheduled against that bike: one or more work items (templates
        defined in Settings) plus a note in the client's own words.
     3. The bike turns up. Whoever is on the counter finds it in Bikes (or in
        the Work tab's "Due in" rail) and checks it in with one click.
     4. A mechanic opens the Work tab, picks the bike, and works down the
        steps of each work item — ticking them off, logging minutes, writing
        notes and recording part changes as they go. Every keystroke is saved,
        so leaving the tab and coming back later loses nothing.
     5. Completing a work item writes one "Shop work" changelog entry on the
        bike, applies its part changes to the live specification, and charges
        the item price + completed step prices + parts.

   CONVENTIONS
     - Views return HTML strings and MUST pass user text through `esc()`.
     - Interactive elements declare `data-action="name"` plus any
       `data-client`, `data-bike`, `data-job`, `data-step` ids; see HANDLERS.
     - Live-editing controls declare `data-input="name"`; see INPUTS. These
       save without re-rendering, so typing is never interrupted.
     - Modals are built with real DOM nodes (they hold dynamic sub-rows).
   ========================================================================== */

/* ==========================================================================
   1. CONFIG & SCHEMA
   ========================================================================== */

const CONFIG = {
  storageKey: "bikeshop.db.v3",
  routeKey:   "bikeshop.route.v3",
  currency:   "USD",   // single place to change money formatting
  locale:     undefined // undefined = browser default
};

/**
 * Bike specification schema.
 *
 * Groups render in order. Every field is stored flat on `bike.specs[key]`,
 * which keeps diffing in the changelog trivial.
 *
 * field: { key, label, type?, suggest?, wide? }
 *   type    "text" (default) | "number" | "textarea"
 *   suggest array of datalist options (still free text)
 *   wide    span the full width of the form grid
 */
const SPEC_GROUPS = [
  {
    id: "core",
    label: "Core",
    hint: "The defining details of the bike — what it fundamentally is.",
    fields: [
      { key: "brand",      label: "Brand / Make", suggest: ["Specialized","Trek","Giant","Cannondale","Canyon","Cervélo","Santa Cruz","Bianchi","Scott","Salsa","Surly","BMC","Pinarello","Orbea"] },
      { key: "model",      label: "Model" },
      { key: "year",       label: "Model year", type: "number" },
      { key: "bikeType",   label: "Type", suggest: ["Road","Gravel","Mountain — XC","Mountain — Trail","Mountain — Enduro","Hybrid","Commuter","Touring","Cyclocross","Triathlon / TT","E-bike","BMX","Kids"] },
      { key: "frameMaterial", label: "Frame material", suggest: ["Carbon","Aluminium","Steel","Titanium","Chromoly","Carbon / Alu mix"] },
      { key: "frameSize",  label: "Frame size", suggest: ["XS","S","M","L","XL","44","47","49","51","52","54","56","58","61"] },
      { key: "serial",     label: "Serial number" },
      { key: "color",      label: "Colour / finish" },
      { key: "groupset",   label: "Groupset", suggest: ["Shimano Claris","Shimano Sora","Shimano Tiagra","Shimano 105 R7100 Di2","Shimano Ultegra R8100 Di2","Shimano Dura-Ace R9200","Shimano GRX","Shimano Deore","Shimano SLX","Shimano XT","SRAM Apex AXS","SRAM Rival AXS","SRAM Force AXS","SRAM Red AXS","SRAM GX Eagle","SRAM XX1 Eagle","Campagnolo Chorus","Campagnolo Record"] },
      { key: "drivetrain", label: "Drivetrain", suggest: ["1x11","1x12","1x13","2x10","2x11","2x12","3x9","Internal hub","Singlespeed"] },
      { key: "brakeType",  label: "Brake type", suggest: ["Hydraulic disc","Mechanical disc","Rim — caliper","Rim — cantilever","Rim — V-brake","Coaster"] },
      { key: "wheelset",   label: "Wheelset" },
      { key: "tires",      label: "Tyres (model / size)" }
    ]
  },
  {
    id: "extras",

/* ==========================================================================
   2. UTIL
   ========================================================================== */

const Util = {
  uid: (prefix) => prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),

  /** Escape for safe interpolation into HTML. Always use on user text. */
  esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  },

  today: () => new Date().toISOString().slice(0, 10),

  /** "2025-04-08" -> "8 Apr 2025" (falls back to raw text). */
  formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(CONFIG.locale, { day: "numeric", month: "short", year: "numeric" });
  },

  money(n) {
    const v = Number(n) || 0;
    return v.toLocaleString(CONFIG.locale, { style: "currency", currency: CONFIG.currency });
  },

  /** Parse a user-typed amount; returns 0 for blank/garbage. */
  parseMoney(text) {
    const n = parseFloat(String(text ?? "").replace(/[^0-9.\-]/g, ""));
    return isNaN(n) ? 0 : n;
  },

  /** Minutes -> "1h 25m" / "45m" / "" for nothing. */
  duration(minutes) {
    const m = Math.max(0, Math.round(Number(minutes) || 0));
    if (!m) return "";
    const h = Math.floor(m / 60);
    return h ? `${h}h${m % 60 ? " " + (m % 60) + "m" : ""}` : `${m}m`;
  },

  /** Sort helper: newest date first, ties broken by creation time. */
  byDateDesc(a, b) {
    return (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0);
  },

  /** Build a DOM element: el("div", {class:"x"}, [childNode, "text"]) */
  el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    }
    (Array.isArray(children) ? children : [children])
      .filter(c => c !== null && c !== undefined && c !== false)
      .forEach(c => node.append(c));
    return node;
  },

  download(filename, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = Util.el("a", { href: url, download: filename });
    document.body.append(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
};
const esc = Util.esc; // used constantly in views

/* ==========================================================================
   3. STORE  — persistence boundary
   ========================================================================== */

const Store = {
  /**
   * Shape of a brand-new database. A shop with no work items cannot schedule
   * anything, so a fresh install starts with the default templates — they are
   * ordinary records from that point on, editable and deletable in Settings.
   */
  empty: () => ({
    schemaVersion: 3,
    clients: [],
    workItems: DEFAULT_WORK_ITEMS.map(item => Domain.newWorkItem(item)),
    settings: { lastBy: "" },
    updatedAt: Date.now()
  }),

  load() {
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      if (!raw) return Store.empty();
      return Store.migrate(JSON.parse(raw));
    } catch (err) {
      console.error("Could not read saved data; starting empty.", err);
      return Store.empty();
    }
  },

  /** Upgrade older payloads. Keep every past version handled here. */
  migrate(data) {
    if (!data || typeof data !== "object" || !Array.isArray(data.clients)) return Store.empty();

    if (!Array.isArray(data.workItems)) data.workItems = [];
    if (!data.settings || typeof data.settings !== "object") data.settings = { lastBy: "" };

    data.workItems.forEach(item => {
      item.steps = Array.isArray(item.steps) ? item.steps : [];
      item.steps.forEach(step => { if (!step.id) step.id = Util.uid("s"); });
    });

    data.clients.forEach(client => (client.bikes || []).forEach(bike => {
      if (!BIKE_STATUS.has(bike.status)) bike.status = DEFAULT_STATUS;
      if (!bike.statusDate) bike.statusDate = "";
      if (!Array.isArray(bike.jobs)) bike.jobs = [];
      bike.stub = !!bike.stub;
      bike.jobs.forEach(job => {
        if (!JOB_STATES[job.status]) job.status = "scheduled";
        job.steps = Array.isArray(job.steps) ? job.steps : [];
        job.steps.forEach(step => { if (!Array.isArray(step.changes)) step.changes = []; });
      });
    }));

    data.schemaVersion = 3;
    return data;
  },

  save(db) {
    db.updatedAt = Date.now();
    clearTimeout(Store._saveTimer);
    Store._saveTimer = null;
    try {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(db));
      Store.flashStatus("Saved " + new Date().toLocaleTimeString(CONFIG.locale));
      return true;
    } catch (err) {
      console.error(err);
      Store.flashStatus("⚠️ Could not save — storage full or blocked", true);
      return false;
    }
  },

  /**
   * Save shortly after the last keystroke. The work space writes on every
   * `input` event; serialising the whole database that often is wasteful, and
   * a mechanic typing a paragraph does not need 200 writes to localStorage.
   * `flush` on unload and on tab change closes the gap.
   */
  saveSoon(db) {
    Store.flashStatus("Saving…");
    clearTimeout(Store._saveTimer);
    Store._saveTimer = setTimeout(() => Store.save(db), 500);
  },

  flush(db) {
    if (Store._saveTimer) Store.save(db);
  },

  flashStatus(text, sticky) {
    const node = document.getElementById("save-status");
    if (!node) return;
    node.textContent = text;
    clearTimeout(Store._t);
    if (!sticky) Store._t = setTimeout(() => { node.textContent = ""; }, 2500);
  },

  loadRoute() {
    try { return JSON.parse(localStorage.getItem(CONFIG.routeKey)) || null; }
    catch { return null; }
  },

  saveRoute(route) {
    try { localStorage.setItem(CONFIG.routeKey, JSON.stringify(route)); } catch { /* non-fatal */ }
  }
};

/* ==========================================================================
   4. DOMAIN — factories, lookups, derived values (no DOM, no mutation)
   ========================================================================== */

const Domain = {
  /* --- factories --- */
  newClient: (data = {}) => ({
    id: Util.uid("c"),
    name: data.name || "Unnamed client",
    phone: data.phone || "",
    email: data.email || "",
    company: data.company || "",
    address: data.address || "",
    notes: data.notes || "",
    createdAt: Date.now(),
    bikes: []
  }),

  /**
   * `stub: true` marks a bike the shop has never seen — created off the back
   * of a phone call so work can be scheduled against it. It stops being a
   * stub the moment someone saves its details.
   */
  newBike: (data = {}) => ({
    id: Util.uid("b"),
    label: data.label || "",           // nickname, e.g. "Blue gravel bike"
    specs: data.specs || {},           // flat map keyed by SPEC_FIELDS key
    other: data.other || [],           // [{ id, label, value }] free-form extras
    events: [],                        // changelog, newest sorted at render time
    jobs: data.jobs || [],             // scheduled / in-progress / completed work
    stub: !!data.stub,
    status: BIKE_STATUS.has(data.status) ? data.status : DEFAULT_STATUS,
    statusDate: data.statusDate || "", // when it entered that status
    createdAt: Date.now()
  }),

  /** A work-item template. Steps are ordered and carry their own ids. */
  newWorkItem: (data = {}) => ({
    id: Util.uid("w"),
    name: data.name || "Untitled work item",
    price: Util.parseMoney(data.price),
    description: data.description || "",
    steps: (data.steps || []).map(Domain.newStep),
    createdAt: Date.now()
  }),

  newStep: (data = {}) => ({
    id: Util.uid("s"),
    title: data.title || "",
    note: data.note || "",
    minutes: Math.max(0, Math.round(Number(data.minutes) || 0)),
    price: Util.parseMoney(data.price),
    optional: !!data.optional,
    specKey: SPEC_FIELDS.has(data.specKey) ? data.specKey : ""
  }),

  /**
   * A job is a *snapshot* of a work item taken when it was scheduled: name,
   * price and the full step list are copied in. Editing the template later
   * changes what gets scheduled next, never what is already on the bench.
   */
  newJob(workItem, data = {}) {
    return {
      id: Util.uid("j"),
      workItemId: workItem.id,
      name: workItem.name,
      price: Number(workItem.price) || 0,
      description: workItem.description || "",
      request: data.request || "",        // the client's own words
      status: "scheduled",
      scheduledDate: data.scheduledDate || Util.today(),
      createdAt: Date.now(),
      startedAt: 0,
      completedAt: 0,
      completedDate: "",
      by: "",
      steps: workItem.steps.map(step => ({
        id: Util.uid("js"),
        title: step.title,
        note: step.note || "",
        estMinutes: Number(step.minutes) || 0,
        price: Number(step.price) || 0,
        optional: !!step.optional,
        specKey: step.specKey || "",
        done: false,
        doneAt: 0,
        minutes: "",                      // what the mechanic actually logged
        notes: "",
        changes: []                       // part changes, applied on completion
      }))
    };
  },

  /**
   * A changelog entry.
   * changes: [{ target: "spec"|"other"|"note", key, label, from, to, cost }]
   */
  newEvent: (data = {}) => ({
    id: Util.uid("e"),
    kind: ENTRY_KINDS[data.kind] ? data.kind : "work",
    date: data.date || Util.today(),
    title: data.title || "",
    description: data.description || "",
    by: data.by || "",
    cost: Util.parseMoney(data.cost),
    changes: data.changes || [],
    createdAt: Date.now()
  }),

  /* --- lookups --- */
  client: (db, id) => db.clients.find(c => c.id === id) || null,

  bike(db, clientId, bikeId) {
    const client = Domain.client(db, clientId);
    return client ? client.bikes.find(b => b.id === bikeId) || null : null;
  },

  job(bike, jobId) {
    return bike ? (bike.jobs || []).find(j => j.id === jobId) || null : null;
  },

  step: (job, stepId) => (job ? job.steps.find(s => s.id === stepId) || null : null),

  workItem: (db, id) => db.workItems.find(w => w.id === id) || null,

  /** Every bike in the shop, each paired with its owner. */
  allBikes: (db) => db.clients.flatMap(c => c.bikes.map(b => ({ client: c, bike: b }))),

  /* --- workflow status --- */

  /** The status record for a bike; never null, unknown ids fall back. */
  status: (bike) => BIKE_STATUS.get(bike && bike.status) || BIKE_STATUS.get(DEFAULT_STATUS),

  /** The next step in the workflow — what the big button on the bike page does. */
  nextStatus: (bike) => BIKE_STATUS.get(Domain.status(bike).next),

  /** True while the bike is anywhere other than back with its owner. */
  isActive: (bike) => Domain.status(bike).id !== DEFAULT_STATUS,

  /** Bikes grouped by status in list order, empty groups included. */
  byStatus(entries) {
    return BIKE_STATUSES_RANKED.map(status => ({
      status,
      items: entries.filter(entry => Domain.status(entry.bike).id === status.id)
    }));
  },

  /** Count of a client's bikes per status id, e.g. { in_shop: 2, out: 1 }. */
  clientStatusCounts(client) {
    const counts = {};
    client.bikes.forEach(b => {
      const id = Domain.status(b).id;
      counts[id] = (counts[id] || 0) + 1;
    });
    return counts;
  },

  /** Every changelog entry with full context, newest first. */
  allEvents: (db) =>
    Domain.allBikes(db)
      .flatMap(({ client, bike }) => bike.events.map(e => ({ client, bike, event: e })))
      .sort((a, b) => Util.byDateDesc(a.event, b.event)),

  /* --- jobs --- */

  /** Work still to do on this bike, in the order it was scheduled. */
  openJobs: (bike) => (bike.jobs || []).filter(j => j.status !== "done"),

  doneJobs: (bike) => (bike.jobs || []).filter(j => j.status === "done"),

  /** Every bike with work outstanding, whether or not it has arrived yet. */
  bikesWithOpenWork: (db) =>
    Domain.allBikes(db).filter(({ bike }) => Domain.openJobs(bike).length),

  /**
   * Everything a job card needs to describe itself: how far down the list the
   * mechanic is, how long it has taken, and what it will cost.
   *
   * The charge is the item price, plus the price of each *completed* priced
   * step (an optional step nobody did is not billed), plus every part cost
   * recorded against the steps.
   */
  jobStats(job) {
    const steps = job.steps || [];
    const done = steps.filter(s => s.done);
    const parts = steps.flatMap(s => s.changes || []);

    const partsCost = parts.reduce((sum, c) => sum + (Number(c.cost) || 0), 0);
    const stepCharges = done.reduce((sum, s) => sum + (Number(s.price) || 0), 0);

    return {
      total: steps.length,
      done: done.length,
      openRequired: steps.filter(s => !s.done && !s.optional).length,
      percent: steps.length ? Math.round((done.length / steps.length) * 100) : 0,
      estMinutes: steps.reduce((sum, s) => sum + (Number(s.estMinutes) || 0), 0),
      loggedMinutes: steps.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0),
      parts: parts.length,
      partsCost,
      stepCharges,
      charge: (Number(job.price) || 0) + stepCharges + partsCost
    };
  },

  /** The same numbers rolled up across every open job on a bike. */
  bikeWorkStats(bike) {
    const jobs = Domain.openJobs(bike);
    return jobs.reduce((acc, job) => {
      const s = Domain.jobStats(job);
      acc.jobs += 1;
      acc.total += s.total;
      acc.done += s.done;
      acc.loggedMinutes += s.loggedMinutes;
      acc.estMinutes += s.estMinutes;
      acc.percent = acc.total ? Math.round((acc.done / acc.total) * 100) : 0;
      return acc;
    }, { jobs: 0, total: 0, done: 0, loggedMinutes: 0, estMinutes: 0, percent: 0 });
  },

  /**
   * The description written into the changelog when a work item is completed:
   * what was actually done, with each mechanic's note and time against it.
   * Pre-filled into the completion form, where it can be edited before saving.
   */
  jobSummary(job) {
    const stats = Domain.jobStats(job);
    const lines = [`${stats.done}/${stats.total} steps`
      + (stats.loggedMinutes ? ` · ${Util.duration(stats.loggedMinutes)} logged` : "")];

    job.steps.filter(s => s.done).forEach(s => {
      const time = Number(s.minutes) ? ` (${Util.duration(s.minutes)})` : "";
      lines.push(`• ${s.title}${time}${s.notes ? " — " + s.notes : ""}`);
    });

    const skipped = job.steps.filter(s => !s.done);
    if (skipped.length) {
      lines.push("Not done: " + skipped.map(s => s.title + (s.optional ? " (optional)" : "")).join(", "));
    }
    return lines.join("\n");
  },

  /**
   * Part changes from every step, ready to be written to the changelog.
   * `from` is re-anchored to what the bike says *now* rather than what it said
   * when the row was typed — the mechanic may have swapped the same part twice
   * during the job, and only the live value makes an honest before → after.
   */
  jobChanges(bike, job) {
    return job.steps.flatMap(step => (step.changes || []).map(change => {
      const next = Object.assign({}, change);
      if (next.target === "spec") {
        next.from = (bike.specs || {})[next.key] || "";
      } else if (next.target === "other") {
        const row = (bike.other || []).find(o => o.id === next.key);
        next.from = row ? row.value : "";
      }
      return next;
    }));
  },

  /* --- derived values --- */
  bikeTitle(bike) {
    const s = bike.specs || {};
    const built = [s.year, s.brand, s.model].filter(Boolean).join(" ");
    return bike.label || built || (bike.stub ? "Bike — details to follow" : "Untitled bike");
  },

  bikeSubtitle(bike) {
    const s = bike.specs || {};
    // If the label is doing the naming, show the make/model underneath.
    const built = [s.year, s.brand, s.model].filter(Boolean).join(" ");
    return bike.label && built ? built : (s.bikeType || "");
  },

  bikeSpend: (bike) => bike.events.reduce((sum, e) => sum + (Number(e.cost) || 0), 0),

  clientSpend: (client) => client.bikes.reduce((sum, b) => sum + Domain.bikeSpend(b), 0),

  lastEvent(bike) {
    return bike.events.slice().sort(Util.byDateDesc)[0] || null;
  },

  /**
   * Compare a bike against the values coming back from the edit form and
   * describe the difference in the same change-record shape the changelog
   * already uses: { target, key, label, from, to, cost }.
   */
  diffBike(bike, next) {
    const changes = [];
    const norm = (v) => String(v ?? "").trim();

    if (norm(bike.label) !== norm(next.label)) {
      changes.push({ target: "meta", key: "label", label: "Nickname",
                     from: norm(bike.label), to: norm(next.label), cost: 0 });
    }

    SPEC_FIELDS.forEach(field => {
      const from = norm((bike.specs || {})[field.key]);
      const to = norm((next.specs || {})[field.key]);
      if (from !== to) {
        changes.push({ target: "spec", key: field.key, label: field.label, from, to, cost: 0 });
      }
    });

    // "Other" rows are matched by id, so renames and removals are visible
    // rather than showing up as one row vanishing and another appearing.
    const before = bike.other || [];
    const after = next.other || [];
    const afterById = new Map(after.map(o => [o.id, o]));

    before.forEach(prev => {
      const now = afterById.get(prev.id);
      if (!now) {
        changes.push({ target: "other", key: prev.id, label: norm(prev.label) || "Other entry",
                       from: norm(prev.value), to: "", cost: 0 });
        return;
      }
      if (norm(prev.label) !== norm(now.label)) {
        changes.push({ target: "other", key: now.id, label: "Other entry renamed",
                       from: norm(prev.label), to: norm(now.label), cost: 0 });
      }
      if (norm(prev.value) !== norm(now.value)) {
        changes.push({ target: "other", key: now.id, label: norm(now.label) || "Other entry",
                       from: norm(prev.value), to: norm(now.value), cost: 0 });
      }
    });

    const beforeIds = new Set(before.map(o => o.id));
    after.forEach(entry => {
      if (beforeIds.has(entry.id)) return;
      changes.push({ target: "other", key: entry.id, label: norm(entry.label) || "Other entry",
                     from: "", to: norm(entry.value), cost: 0 });
    });

    return changes;
  },

  /** Auto-title for an edit entry: "Record edited — Bar tape, Saddle +2 more". */
  editSummary(changes) {
    if (!changes.length) return "Record reviewed";
    const labels = changes.map(c => c.label);
    const shown = labels.slice(0, 3).join(", ");
    return "Record edited — " + shown + (labels.length > 3 ? ` +${labels.length - 3} more` : "");
  },

  /** Human label for a change target, whatever its source. */
  changeLabel(change) {
    if (change.label) return change.label;
    const field = SPEC_FIELDS.get(change.key);
    return field ? field.label : change.key;
  },

  /** Free-text blob used by the search boxes. */
  bikeSearchText(bike) {
    return [Domain.bikeTitle(bike), bike.label, Domain.status(bike).label,
            ...Object.values(bike.specs || {}),
            ...(bike.jobs || []).map(j => j.name + " " + j.request),
            ...(bike.other || []).map(o => o.label + " " + o.value)
           ].join(" ").toLowerCase();
  },

  clientSearchText(client) {
    return [client.name, client.phone, client.email, client.company, client.notes,
            ...client.bikes.map(Domain.bikeSearchText)].join(" ").toLowerCase();
  },

  /** Shop-wide summary numbers for the Activity tab. */
  stats(db) {
    const bikes = Domain.allBikes(db);
    const events = bikes.flatMap(({ bike }) => bike.events);
    const jobs = bikes.flatMap(({ bike }) => bike.jobs || []);
    const byStatus = {};
    BIKE_STATUSES.forEach(s => { byStatus[s.id] = 0; });
    bikes.forEach(({ bike }) => { byStatus[Domain.status(bike).id]++; });

    const openJobs = jobs.filter(j => j.status !== "done");
    return {
      clients: db.clients.length,
      bikes: bikes.length,
      entries: events.length,
      workEntries: events.filter(e => e.kind === "work").length,
      workItems: db.workItems.length,
      openJobs: openJobs.length,
      openSteps: openJobs.reduce((sum, j) => sum + Domain.jobStats(j).total - Domain.jobStats(j).done, 0),
      bookedValue: openJobs.reduce((sum, j) => sum + Domain.jobStats(j).charge, 0),
      revenue: events.reduce((sum, e) => sum + (Number(e.cost) || 0), 0),
      byStatus
    };
  }
};

/* ==========================================================================
   5. ACTIONS — the only place the database is mutated
   ========================================================================== */

const Actions = {
  /** Mutate through this so saving + re-rendering can never be forgotten. */
  commit(mutator) {
    mutator(App.db);
    Store.save(App.db);
    App.render();
  },

  /**
   * A mutation with no visible consequence beyond the control the user is
   * already looking at — a minutes box, a notes field. Saving is debounced and
   * nothing re-renders, so typing is never interrupted mid-word.
   */
  commitQuiet(mutator) {
    mutator(App.db);
    Store.saveSoon(App.db);
  },

  /**
   * A mutation the user is looking straight at — ticking a step. The screen
   * has to change, but throwing the caret out of the checklist someone is
   * tabbing down would be its own small insult, so the render puts the focus
   * and the scroll position back where they were.
   */
  commitLocal(mutator) {
    mutator(App.db);
    Store.save(App.db);
    App.renderKeepingPlace();
  },

  addClient(data) {
    const client = Domain.newClient(data);
    Actions.commit(db => db.clients.push(client));
    App.navigate({ tab: "clients", clientId: client.id, bikeId: null });
  },

  updateClient(clientId, data) {
    Actions.commit(db => Object.assign(Domain.client(db, clientId), data));
  },

  deleteClient(clientId) {
    Actions.commit(db => { db.clients = db.clients.filter(c => c.id !== clientId); });
    App.navigate({ tab: "clients", clientId: null, bikeId: null });
  },

  addBike(clientId, data, opts = {}) {
    const bike = Domain.newBike(data);
    Actions.commit(db => Domain.client(db, clientId).bikes.push(bike));
    App.navigate({ tab: "clients", clientId, bikeId: bike.id });
    if (opts.then) opts.then(bike);
  },

  /**
   * Direct edit of the bike record. No work was performed — but the stored
   * facts changed, and when that happened is worth knowing, so any real
   * difference is written to the changelog as an `edit` entry.
   *
   * Saving details is also what turns a stub into a real bike record.
   */
  updateBike(clientId, bikeId, data, note) {
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      const changes = Domain.diffBike(bike, data);

      Object.assign(bike, { label: data.label, specs: data.specs, other: data.other, stub: false });

      if (changes.length || note) {
        bike.events.push(Domain.newEvent({
          kind: "edit",
          date: Util.today(),
          title: Domain.editSummary(changes),
          description: note || "",
          cost: 0,
          changes
        }));
      }
    });
  },

  /**
   * Move a bike through the workflow.
   *
   * The status is current state, so it lives on the bike; but *when* it moved
   * is history, so every transition also writes a changelog entry.
   */
  setBikeStatus(clientId, bikeId, statusId, note) {
    if (!BIKE_STATUS.has(statusId)) return;
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      if (!bike) return;

      const from = Domain.status(bike);
      if (from.id === statusId) return;
      const to = BIKE_STATUS.get(statusId);

      bike.status = to.id;
      bike.statusDate = Util.today();

      bike.events.push(Domain.newEvent({
        kind: "status",
        date: bike.statusDate,
        title: to.label,
        description: note || "",
        cost: 0,
        // Recorded as a "note" change: the log shows the move, but nothing on
        // the bike's specification is touched by it.
        changes: [{ target: "note", key: "status", label: "Status",
                    from: from.label, to: to.label, cost: 0 }]
      }));
    });
  },

  deleteBike(clientId, bikeId) {
    Actions.commit(db => {
      const client = Domain.client(db, clientId);
      client.bikes = client.bikes.filter(b => b.id !== bikeId);
    });
    App.navigate({ tab: "clients", clientId, bikeId: null });
  },

  /* --- work items (templates) --- */

  addWorkItem(data) {
    Actions.commit(db => db.workItems.push(Domain.newWorkItem(data)));
  },

  /**
   * Edit a template in place. Jobs already on bikes hold their own copy of the
   * steps, so nothing in progress shifts under a mechanic's hands.
   */
  updateWorkItem(itemId, data) {
    Actions.commit(db => {
      const item = Domain.workItem(db, itemId);
      if (!item) return;
      Object.assign(item, {
        name: data.name,
        price: Util.parseMoney(data.price),
        description: data.description,
        steps: (data.steps || []).map(Domain.newStep)
      });
    });
  },

  duplicateWorkItem(itemId) {
    Actions.commit(db => {
      const item = Domain.workItem(db, itemId);
      if (!item) return;
      const copy = Domain.newWorkItem(Object.assign({}, item, { name: item.name + " (copy)" }));
      db.workItems.splice(db.workItems.indexOf(item) + 1, 0, copy);
    });
  },

  deleteWorkItem(itemId) {
    Actions.commit(db => { db.workItems = db.workItems.filter(w => w.id !== itemId); });
  },

  restoreDefaultWorkItems() {
    Actions.commit(db => {
      DEFAULT_WORK_ITEMS.forEach(item => db.workItems.push(Domain.newWorkItem(item)));
    });
  },

  /* --- jobs (scheduled work) --- */

  /**
   * Put one or more work items on a bike.
   *
   * A bike nobody has seen yet moves to "scheduled" as a side effect — that is
   * what scheduling work *means*, and it is the state the front counter looks
   * for when someone walks in. A bike already in the shop stays in the shop:
   * this is the mid-job "while it was up on the stand…" path.
   */
  scheduleWork(clientId, bikeId, itemIds, opts = {}) {
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      if (!bike) return;

      itemIds.forEach(id => {
        const item = Domain.workItem(db, id);
        if (item) bike.jobs.push(Domain.newJob(item, {
          request: opts.request || "",
          scheduledDate: opts.date || Util.today()
        }));
      });

      const names = itemIds.map(id => (Domain.workItem(db, id) || {}).name).filter(Boolean);
      const status = Domain.status(bike);

      if (status.id === "out" || status.id === "completed") {
        const to = BIKE_STATUS.get("scheduled");
        bike.status = to.id;
        bike.statusDate = Util.today();
        bike.events.push(Domain.newEvent({
          kind: "status", date: bike.statusDate, title: to.label,
          description: [names.join(", "), opts.request].filter(Boolean).join("\n"),
          changes: [{ target: "note", key: "status", label: "Status",
                      from: status.label, to: to.label, cost: 0 }]
        }));
      }
    });
  },

  deleteJob(clientId, bikeId, jobId) {
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      if (bike) bike.jobs = bike.jobs.filter(j => j.id !== jobId);
    });
  },

  /**
   * Tick a step off, or un-tick it.
   *
   * The first tick is also what starts the clock on a job — nobody wants to
   * press "begin" before they are allowed to pick up a spanner.
   */
  setStepDone(clientId, bikeId, jobId, stepId, done) {
    Actions.commitLocal(db => {
      const job = Domain.job(Domain.bike(db, clientId, bikeId), jobId);
      const step = Domain.step(job, stepId);
      if (!step || job.status === "done") return;

      step.done = done;
      step.doneAt = done ? Date.now() : 0;

      if (done && job.status === "scheduled") {
        job.status = "active";
        job.startedAt = Date.now();
      }
    });
  },

  /** Live field edits inside the work space: minutes and per-step notes. */
  setStepField(clientId, bikeId, jobId, stepId, field, value) {
    Actions.commitQuiet(db => {
      const job = Domain.job(Domain.bike(db, clientId, bikeId), jobId);
      const step = Domain.step(job, stepId);
      if (!step || job.status === "done") return;
      step[field] = field === "minutes"
        ? (value === "" ? "" : Math.max(0, Number(value) || 0))
        : value;
      if (job.status === "scheduled" && value !== "") {
        job.status = "active";
        job.startedAt = job.startedAt || Date.now();
      }
    });
  },

  addStepChanges(clientId, bikeId, jobId, stepId, changes) {
    Actions.commit(db => {
      const job = Domain.job(Domain.bike(db, clientId, bikeId), jobId);
      const step = Domain.step(job, stepId);
      if (!step) return;
      changes.forEach(change => step.changes.push(Object.assign({ id: Util.uid("ch") }, change)));
    });
  },

  removeStepChange(clientId, bikeId, jobId, stepId, changeId) {
    Actions.commit(db => {
      const step = Domain.step(Domain.job(Domain.bike(db, clientId, bikeId), jobId), stepId);
      if (step) step.changes = step.changes.filter(c => c.id !== changeId);
    });
  },

  /**
   * Finish a work item.
   *
   * This is the one path where history and current state move together: the
   * job's part changes are applied to the bike's live specification and the
   * whole item lands in the changelog as a single dated "Shop work" entry.
   * The job itself stays on the bike as the record of how it was done.
   */
  completeJob(clientId, bikeId, jobId, values) {
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      const job = Domain.job(bike, jobId);
      if (!job || job.status === "done") return;

      const changes = Domain.jobChanges(bike, job);
      changes.forEach(change => Actions._applyChange(bike, change));

      bike.events.push(Domain.newEvent({
        kind: "work",
        date: values.date || Util.today(),
        by: values.by || "",
        title: job.name,
        description: values.description || "",
        cost: values.cost,
        changes
      }));

      job.status = "done";
      job.completedAt = Date.now();
      job.completedDate = values.date || Util.today();
      job.by = values.by || "";
      job.charged = Util.parseMoney(values.cost);
      db.settings.lastBy = values.by || db.settings.lastBy;
    });
  },

  /** Apply one recorded change to the bike's current specification. */
  _applyChange(bike, change) {
    if (change.target === "spec") {
      bike.specs[change.key] = change.to;
    } else if (change.target === "other") {
      const entry = (bike.other || []).find(o => o.id === change.key);
      if (entry) entry.value = change.to;
      else (bike.other = bike.other || []).push({ id: Util.uid("o"), label: change.label, value: change.to });
    }
    // target === "note": recorded in history only, by design.
  },

  /**
   * Record a changelog entry directly and apply its part changes. Used by the
   * manual "Add work" / "Add owner change" forms for anything that happened
   * outside the step flow.
   */
  addEvent(clientId, bikeId, data) {
    const event = Domain.newEvent(data);
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      event.changes.forEach(change => Actions._applyChange(bike, change));
      bike.events.push(event);
    });
  },

  /**
   * Remove a changelog entry. The bike's current spec is left as-is: history
   * is a record of what happened, and un-applying it would be a guess.
   */
  deleteEvent(clientId, bikeId, eventId) {
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      bike.events = bike.events.filter(e => e.id !== eventId);
    });
  },

  replaceDatabase(data) {
    App.db = Store.migrate(data);
    Store.save(App.db);
    App.navigate({ tab: "clients", clientId: null, bikeId: null, workBikeId: null, workClientId: null });
  }
};

/* ==========================================================================
   6. COMPONENTS — reusable DOM builders (modal + form primitives)
   ========================================================================== */

const Modal = {
  /**
   * Open a form modal.
   *   title       heading text
   *   build(body) fills the scrollable body; return value ignored
   *   submitLabel primary button text
   *   onSubmit(body)  -> return false to keep the modal open
   *   randomize(body) -> optional; adds the 🎲 test-data button to the footer
   */
  open({ title, build, submitLabel = "Save", onSubmit, randomize, width }) {
    Modal.close();

    const body = Util.el("div", { class: "body" });
    build(body);

    const form = Util.el("form", {
      class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title,
      style: width ? `width:min(${width}px,100%)` : null,
      onsubmit: (ev) => {
        ev.preventDefault();
        if (onSubmit(body) !== false) Modal.close();
      }
    }, [
      Util.el("header", {}, [Util.el("h2", { text: title })]),
      body,
      Util.el("footer", {}, [
        randomize ? Util.el("button", {
          type: "button", class: "btn", text: "🎲 Random",
          title: "Fill this form with plausible test data",
          onclick: () => randomize(body)
        }) : null,
        randomize ? Util.el("span", { class: "spacer" }) : null,
        Util.el("button", { type: "button", class: "btn", text: "Cancel", onclick: Modal.close }),
        Util.el("button", { type: "submit", class: "btn btn-primary", text: submitLabel })
      ])
    ]);

    Modal._mount(form);
    const first = body.querySelector("input, textarea, select");
    if (first) first.focus();
  },

  /**
   * A question with several ways out — no form, no saving.
   *
   * `message` is plain text; blank lines split it into paragraphs. `actions`
   * are rendered after Cancel in the order given, each `{ label, class, run }`.
   * The dialog closes before `run()` is called, so an action is free to open a
   * modal of its own.
   */
  ask({ title, message, actions = [] }) {
    Modal.close();

    const dialog = Util.el("div", {
      class: "modal", role: "alertdialog", "aria-modal": "true", "aria-label": title
    }, [
      Util.el("header", {}, [Util.el("h2", { text: title })]),
      Util.el("div", { class: "body" },
        String(message).split("\n\n").map(text => Util.el("p", { text }))),
      Util.el("footer", {}, [
        Util.el("button", { type: "button", class: "btn", text: "Cancel", onclick: Modal.close })
      ].concat(actions.map(action => Util.el("button", {
        type: "button",
        class: "btn " + (action.class || ""),
        text: action.label,
        onclick: () => { Modal.close(); action.run(); }
      }))))
    ]);

    Modal._mount(dialog);
    const buttons = dialog.querySelectorAll("footer button");
    if (buttons.length) buttons[buttons.length - 1].focus();
  },

  /** Put a built dialog on screen behind a click-to-dismiss backdrop. */
  _mount(dialog) {
    const backdrop = Util.el("div", {
      class: "modal-backdrop",
      onmousedown: (ev) => { if (ev.target === backdrop) Modal.close(); }
    }, [dialog]);

    document.getElementById("modal-root").append(backdrop);
    document.addEventListener("keydown", Modal._onKey);
  },

  close() {
    document.getElementById("modal-root").innerHTML = "";
    document.removeEventListener("keydown", Modal._onKey);
  },

  _onKey(ev) { if (ev.key === "Escape") Modal.close(); }
};

const Form = {
  /** One labelled control. `field` uses the schema shape from section 1. */
  field(field, value = "") {
    const id = "f_" + field.key;
    let input;

    if (field.type === "textarea") {
      input = Util.el("textarea", { id, name: field.key, text: value, rows: field.rows || 3,
                                    placeholder: field.placeholder });
    } else {
      input = Util.el("input", {
        id, name: field.key, value: value ?? "",
        type: field.type === "number" ? "number" : (field.type || "text"),
        step: field.step, placeholder: field.placeholder,
        required: !!field.required,
        list: field.suggest ? id + "_list" : null,
        autocomplete: "off"
      });
    }

    const children = [Util.el("label", { for: id, text: field.label + (field.required ? " *" : "") }), input];
    if (field.suggest) {
      children.push(Util.el("datalist", { id: id + "_list" },
        field.suggest.map(opt => Util.el("option", { value: opt }))));
    }
    if (field.hint) children.push(Util.el("div", { class: "hint", text: field.hint }));

    return Util.el("div", { class: "field" + (field.wide || field.type === "textarea" ? " wide" : "") }, children);
  },

  /** A <fieldset> of fields laid out in the responsive grid. */
  section(legend, fields, values = {}, hint) {
    return Util.el("fieldset", {}, [
      Util.el("legend", {}, [
        Util.el("h4", { text: legend }),
        hint ? Util.el("div", { class: "hint", text: hint }) : null
      ].filter(Boolean)),
      Util.el("div", { class: "fields" }, fields.map(f => Form.field(f, values[f.key])))
    ]);
  },

  /** Read every named control inside a container into a plain object. */
  values(container) {
    const out = {};
    container.querySelectorAll("[name]").forEach(input => {
      if (input.closest(".dyn-row")) return;   // dynamic rows are parsed separately
      out[input.name] = input.value.trim();
    });
    return out;
  },

  /** A <select> over every spec field, grouped exactly as the forms are. */
  specSelect(attrs, selected) {
    return Util.el("select", attrs, [
      Util.el("option", { value: "", text: "— none —" }),
      ...SPEC_GROUPS.map(group => Util.el("optgroup", { label: group.label },
        group.fields.map(f => Util.el("option", {
          value: f.key, text: f.label, selected: f.key === selected
        }))))
    ]);
  }
};

/**
 * Repeatable rows: free-form "other" entries, part-change entries, and the
 * step editor behind a work-item template. Each row is a .dyn-row; `parse`
 * reads them back out of the DOM.
 */
const DynRows = {
  container(className) {
    return Util.el("div", { class: "dyn-rows", "data-rows": className });
  },

  addButton(label, container, factory) {
    return Util.el("button", {
      type: "button", class: "btn btn-sm", text: label,
      onclick: () => {
        container.append(factory());
        const inputs = container.lastElementChild.querySelectorAll("input, select, textarea");
        if (inputs.length) inputs[0].focus();
      }
    });
  },

  removeButton(label = "Remove") {
    return Util.el("button", {
      type: "button", class: "btn btn-sm btn-danger", text: label,
      title: "Remove this row",
      onclick: (ev) => ev.target.closest(".dyn-row").remove()
    });
  },

  /* --- free-form label/value rows --- */
  kvRow(entry = {}) {
    return Util.el("div", { class: "dyn-row kv", "data-id": entry.id || "" }, [
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Label" }),
        Util.el("input", { "data-kv": "label", value: entry.label || "", placeholder: "e.g. Fit measurements" })
      ]),
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Detail" }),
        Util.el("input", { "data-kv": "value", value: entry.value || "", placeholder: "e.g. Saddle height 742mm" })
      ]),
      DynRows.removeButton()
    ]);
  },

  parseKV(container) {
    return Array.from(container.querySelectorAll(".dyn-row.kv")).map(row => ({
      id: row.dataset.id || Util.uid("o"),
      label: row.querySelector('[data-kv="label"]').value.trim(),
      value: row.querySelector('[data-kv="value"]').value.trim()
    })).filter(entry => entry.label || entry.value);
  },

  /* --- part-change rows --- */

  /**
   * Everything a change can point at, as one flat alphabetical list: spec
   * fields first-class alongside the bike's own "Other" rows.
   *
   * No "Core —" / "Extras —" prefixes. Which group a field lives in is a fact
   * about this app's forms, not about the bike, and prefixing every option
   * with it breaks the only search anyone actually performs: type "cass", get
   * Cassette. Where an "Other" row happens to share a spec field's name it is
   * numbered rather than silently shadowing it.
   */
  changeTargets(bike) {
    const options = [];
    SPEC_GROUPS.forEach(group => group.fields.forEach(f => options.push({
      value: "spec:" + f.key,
      label: f.label,
      current: (bike.specs || {})[f.key] || ""
    })));
    (bike.other || []).forEach(o => options.push({
      value: "other:" + o.id,
      label: o.label || "Untitled entry",
      current: o.value || ""
    }));

    const taken = new Set();
    options.forEach(opt => {
      let label = opt.label;
      for (let n = 2; taken.has(label.toLowerCase()); n++) label = `${opt.label} (${n})`;
      opt.label = label;
      taken.add(label.toLowerCase());
    });

    return options.sort((a, b) => a.label.localeCompare(b.label));
  },

  /** The target a typed part name refers to, or null for free text. */
  findTarget(targets, text) {
    const needle = String(text || "").trim().toLowerCase();
    return needle ? targets.find(t => t.label.toLowerCase() === needle) || null : null;
  },

  /**
   * One part-change row.
   *
   * The part is a text box over a datalist rather than a <select>: typing
   * filters the list as you go, and anything that is not a known part is kept
   * anyway as a log-only note under whatever the mechanic called it — which is
   * what the old "Something else" option existed to do, without the option.
   *
   * `preselect` is a spec key, used to point a step's row at its own part.
   */
  changeRow(bike, preselect) {
    const targets = DynRows.changeTargets(bike);
    const listId = Util.uid("parts");

    const input = Util.el("input", {
      "data-change": "target", list: listId, autocomplete: "off",
      placeholder: "Type to search…"
    });
    const options = Util.el("datalist", { id: listId },
      targets.map(t => Util.el("option", { value: t.label })));

    const toInput = Util.el("input", { "data-change": "to", placeholder: "New value" });
    const costInput = Util.el("input", { "data-change": "cost", placeholder: "0.00", inputmode: "decimal" });
    const currentHint = Util.el("div", { class: "hint", text: " " });

    const sync = () => {
      const match = DynRows.findTarget(targets, input.value);
      currentHint.textContent = !input.value.trim() ? " "
        : match ? (match.current ? "Currently: " + match.current : "Currently: (empty)")
                : "Not on the record — will be logged as a note.";
    };
    input.addEventListener("input", sync);

    if (preselect && SPEC_FIELDS.has(preselect)) {
      const match = targets.find(t => t.value === "spec:" + preselect);
      if (match) { input.value = match.label; sync(); }
    }

    return Util.el("div", { class: "dyn-row change" }, [
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Part" }), input, options, currentHint
      ]),
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "New value" }), toInput
      ]),
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Part cost" }), costInput
      ]),
      DynRows.removeButton()
    ]);
  },

  /** Turn change rows into stored change records (captures the old value). */
  parseChanges(container, bike) {
    const targets = DynRows.changeTargets(bike);
    return Array.from(container.querySelectorAll(".dyn-row.change")).map(row => {
      const text = row.querySelector('[data-change="target"]').value.trim();
      if (!text) return null;

      const to = row.querySelector('[data-change="to"]').value.trim();
      const cost = Util.parseMoney(row.querySelector('[data-change="cost"]').value);
      const match = DynRows.findTarget(targets, text);

      // Unrecognised text is still worth keeping — recorded against the log
      // only, so a typo can never quietly write itself into the specification.
      // With nothing to say about it, though, it was half-typed and abandoned.
      if (!match) return (to || cost) ? { target: "note", key: "", label: text, from: "", to, cost } : null;

      const cut = match.value.indexOf(":");
      return {
        target: match.value.slice(0, cut),
        key: match.value.slice(cut + 1),
        label: match.label,
        from: match.current,
        to, cost
      };
    }).filter(Boolean);
  },

  /* --- work-item step editor --- */

  /**
   * One step of a template. Six controls in a single line is unreadable, so a
   * step is a small block: title on top, then the numbers and flags. Order is
   * part of the meaning of a checklist, hence the move buttons.
   */
  stepRow(step = {}) {
    const optionalId = "opt_" + (step.id || Util.uid("s"));
    const move = (dir) => (ev) => {
      const row = ev.target.closest(".dyn-row");
      const sibling = dir < 0 ? row.previousElementSibling : row.nextElementSibling;
      if (sibling) dir < 0 ? sibling.before(row) : sibling.after(row);
    };

    return Util.el("div", { class: "dyn-row step-editor" }, [
      Util.el("div", { class: "top" }, [
        Util.el("div", { class: "field" }, [
          Util.el("label", { text: "Step" }),
          Util.el("input", { "data-step": "title", value: step.title || "",
                             placeholder: "e.g. Index gears, front and rear" })
        ]),
        Util.el("div", { class: "row" }, [
          Util.el("button", { type: "button", class: "btn btn-sm", text: "↑", title: "Move up", onclick: move(-1) }),
          Util.el("button", { type: "button", class: "btn btn-sm", text: "↓", title: "Move down", onclick: move(1) }),
          DynRows.removeButton("✕")
        ])
      ]),
      Util.el("div", { class: "field", style: "margin-top:8px" }, [
        Util.el("label", { text: "Guidance for the mechanic (optional)" }),
        Util.el("input", { "data-step": "note", value: step.note || "",
                           placeholder: "e.g. Check hanger alignment first" })
      ]),
      Util.el("div", { class: "sub" }, [
        Util.el("div", { class: "field" }, [
          Util.el("label", { text: "Est. minutes" }),
          Util.el("input", { "data-step": "minutes", type: "number", min: "0", step: "5",
                             value: step.minutes || "" })
        ]),
        Util.el("div", { class: "field" }, [
          Util.el("label", { text: "Extra labour" }),
          Util.el("input", { "data-step": "price", inputmode: "decimal", placeholder: "0.00",
                             value: step.price || "" })
        ]),
        Util.el("div", { class: "field" }, [
          Util.el("label", { text: "Usually replaces" }),
          Form.specSelect({ "data-step": "specKey" }, step.specKey || "")
        ]),
        Util.el("div", { class: "field inline", style: "align-self:end;padding-bottom:8px" }, [
          Util.el("input", { "data-step": "optional", type: "checkbox", checked: !!step.optional,
                             id: optionalId }),
          Util.el("label", { for: optionalId, text: "Optional", style: "font-size:13px",
                             title: "Optional steps are not counted when a work item is completed" })
        ])
      ])
    ]);
  },

  parseSteps(container) {
    return Array.from(container.querySelectorAll(".dyn-row.step-editor")).map(row => ({
      title: row.querySelector('[data-step="title"]').value.trim(),
      note: row.querySelector('[data-step="note"]').value.trim(),
      minutes: row.querySelector('[data-step="minutes"]').value,
      price: row.querySelector('[data-step="price"]').value,
      specKey: row.querySelector('[data-step="specKey"]').value,
      optional: row.querySelector('[data-step="optional"]').checked
    })).filter(step => step.title);
  }
};

   A development aid: powers the 🎲 button on every form and the bulk
   generator in the Data tab. Nothing else in the app depends on it, so this

   generator buttons in View.dataTab) can be deleted for a production build.

const Random = {

  int:    (min, max) => min + Math.floor(Math.random() * (max - min + 1)),
  pick:   (arr) => arr[Math.floor(Math.random() * arr.length)],

  /** n distinct members of arr (fewer if arr is short). */
  sample(arr, n) {
    const copy = arr.slice();

    { title: "Suspension service", desc: "Lowers service and air can rebuild, fresh seals and oil.", wear: ["suspension"] },
    { title: "Pre-season tune", desc: "Safety check, torque check, lubed and adjusted throughout. No parts needed.", wear: [] }
  ],

  OWNER_JOBS: [
    { title: "Owner fitted new saddle", desc: "Swapped to a saddle brought back from a bike fit elsewhere.", wear: ["saddle"] },
    { title: "Owner changed pedals", desc: "Moved to a different pedal system; old pedals kept.", wear: ["pedals"] },
    { title: "Tyres swapped by owner", desc: "Fitted winter tyres at home before a wet spell.", wear: ["tires"] },
    { title: "Work done at another shop", desc: "Serviced while away on a trip. No paperwork supplied.", wear: ["chain","cassette"] },
    { title: "Owner added accessories", desc: "Fitted their own lights, mudguards and a rack.", wear: ["accessories"] },
    { title: "Owner replaced bar tape", desc: "Re-wrapped at home after a wet winter.", wear: ["barTape"] },
    { title: "Wheels upgraded privately", desc: "Bought a secondhand wheelset from a club mate.", wear: ["wheelset"] },
    { title: "Owner reports a noise", desc: "Intermittent click under power. Nothing changed — logged for next visit.", wear: [] }
  ],

  /* --- entity generators --- */

  clientData() {
    const first = Random.pick(Random.NAMES.first);
    const last = Random.pick(Random.NAMES.last);
    return {
      name: `${first} ${last}`,
      phone: `555-0${Random.int(100, 199)}`,
      email: `${first}.${last}@example.com`.toLowerCase(),
      company: Random.chance(0.25) ? Random.pick(Random.COMPANIES) : "",
      address: Random.chance(0.5) ? `${Random.int(1, 240)} ${Random.pick(Random.STREETS)} ${Random.pick(["Street","Road","Lane","Avenue"])}` : "",
      notes: Random.chance(0.6) ? Random.pick(Random.CLIENT_NOTES) : ""
    };
  },

  /** A coherent bike: nickname, core + extras specs, and a few Other rows. */
  bikeData() {
    const arch = Random.pick(Random.ARCHETYPES);
    const type = Random.pick(arch.types);
    const brand = Random.pick(Object.keys(arch.models));
    const isDrop = ["Road","Gravel","Touring"].includes(type);
    const isMTB = type.startsWith("Mountain") || type === "E-bike";

    const specs = {
      brand,
      model: Random.pick(arch.models[brand]),
      year: String(Random.int(2015, 2025)),
      bikeType: type,
      frameMaterial: Random.pick(arch.materials),
      frameSize: Random.pick(arch.sizes),
      serial: Random.chance(0.7) ? `${brand.slice(0, 2).toUpperCase()}${Random.int(10, 25)}-${Random.int(100000, 999999)}` : "",
      color: Random.pick(["Deep blue","Matte black","Gloss red","Sage green","Raw / polished","Pearl white","Burnt orange","Slate grey"]),
      groupset: Random.pick(arch.groupsets),
      drivetrain: Random.pick(arch.drivetrains),
      brakeType: Random.pick(arch.brakes),
      wheelset: Random.pick(arch.wheelsets),
      tires: Random.pick(arch.tires)
    };

    // Extras: fill roughly half, skipping anything that makes no sense here.
    SPEC_GROUPS.find(g => g.id === "extras").fields.forEach(f => {
      if (f.key === "suspension" && !isMTB) return;
      if (f.key === "barTape" && !isDrop && !Random.chance(0.4)) return;
      if (f.key === "powerMeter" && !Random.chance(0.2)) return;
      if (Random.POOLS[f.key] && Random.chance(0.55)) specs[f.key] = Random.pick(Random.POOLS[f.key]);
    });

    // Most bikes are with their owners; a minority are somewhere in the
    // workflow, so generated data exercises every group in the lists.
    const status = Random.chance(0.7) ? "out" : Random.pick(["scheduled", "in_shop", "in_shop", "completed"]);

    return {
      label: Random.chance(0.45)
        ? `${Random.pick(["Blue","Black","Red","Green","Silver","Winter","Summer","Old","Best"])} ${Random.pick(["gravel bike","road bike","commuter","trail bike","hack","race bike"])}`
        : "",
      specs,
      status,
      statusDate: status === "out" ? "" : Random.dateWithin(14),
      other: Random.sample(Random.OTHER, Random.int(0, 3)).map(make => Object.assign({ id: Util.uid("o") }, make()))
    };
  },

  /**
   * A changelog entry for a specific bike. Part changes are drawn from the
   * job's wear items so the story and the swapped parts agree.
   */
  eventData(bike, kind) {
    const job = Random.pick(kind === "owner" ? Random.OWNER_JOBS : Random.WORK_JOBS);
    const changes = job.wear
      .filter(key => Random.chance(0.85) && SPEC_FIELDS.has(key))
      .map(key => ({
        target: "spec",
        key,
        label: SPEC_FIELDS.get(key).label,
        from: (bike.specs || {})[key] || "",
        to: Random.pick(Random.POOLS[key] || [`New ${SPEC_FIELDS.get(key).label.toLowerCase()}`]),
        cost: kind === "owner" ? 0 : Random.int(2, 24) * 5
      }));

    const partsTotal = changes.reduce((sum, c) => sum + c.cost, 0);
    return {
      kind,
      date: Random.dateWithin(730),
      by: kind === "owner"
        ? Random.pick(["Owner","Owner","Another shop","Club mechanic"])
        : Random.pick(Random.MECHANICS),
      title: job.title,
      description: job.desc,
      cost: kind === "owner"
        ? (Random.chance(0.4) ? String(partsTotal || Random.int(4, 30) * 5) : "0")
        : String(partsTotal + Random.int(6, 30) * 5),
      changes
    };
  },

  /**
   * Scheduled work for a bike that is with us or due in, part-worked if the
   * bike is already in the shop — so the Work tab has something to show.
   */
  addJobs(bike, workItems) {
    if (!workItems.length) return;
    const inShop = bike.status === "in_shop";

    Random.sample(workItems, Random.int(1, 2)).forEach(item => {
      const job = Domain.newJob(item, {
        request: Random.chance(0.75) ? Random.pick(Random.REQUESTS) : "",
        scheduledDate: bike.statusDate || Util.today()
      });

      if (inShop && Random.chance(0.8)) {
        // Work down the list in order — a mechanic does not skip ahead.
        const upTo = Random.int(1, job.steps.length - 1);
        job.steps.slice(0, upTo).forEach(step => {
          step.done = true;
          step.doneAt = Date.now();
          step.minutes = Math.max(5, Math.round((step.estMinutes || 10) * (0.6 + Math.random())/ 5) * 5);
          if (Random.chance(0.35)) step.notes = Random.pick(Random.STEP_NOTES);
          if (step.specKey && Random.chance(0.3)) {
            step.changes.push({
              id: Util.uid("ch"), target: "spec", key: step.specKey,
              label: SPEC_FIELDS.get(step.specKey).label,
              from: (bike.specs || {})[step.specKey] || "",
              to: Random.pick(Random.POOLS[step.specKey] || ["Replaced"]),
              cost: Random.int(2, 20) * 5
            });
          }
        });
        job.status = "active";
        job.startedAt = Date.now();
      }

      bike.jobs.push(job);
    });
  },

  /** A whole client with bikes and applied history — used by bulk generation. */
  fullClient(workItems = []) {
    const client = Domain.newClient(Random.clientData());

    for (let i = Random.int(1, 3); i > 0; i--) {
      const bike = Domain.newBike(Random.bikeData());

      // Generate oldest-first and apply as we go, so the current spec is the
      // result of its own history — exactly as if it had been entered by hand.
      const events = Array.from({ length: Random.int(0, 6) }, () =>
        Domain.newEvent(Random.eventData(bike, Random.chance(0.25) ? "owner" : "work")))
        .sort((a, b) => (a.date || "").localeCompare(b.date || ""));

      events.forEach(event => {
        event.changes.forEach(change => {
          change.from = bike.specs[change.key] || "";   // re-anchor to the live value
          Actions._applyChange(bike, change);
        });
        bike.events.push(event);
      });

      if (bike.status === "scheduled" || bike.status === "in_shop") Random.addJobs(bike, workItems);
      client.bikes.push(bike);
    }
    return client;
  },

  /* --- form fillers (called by the 🎲 buttons) --- */

  /** Set a named control inside a modal body. */
  _set(body, name, value) {
    const input = body.querySelector(`[name="${name}"]`);
    if (input) input.value = value ?? "";
  },

  fillClientForm(body) {
    const data = Random.clientData();
