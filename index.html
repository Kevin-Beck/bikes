      </div>`;
  }
};

/* ==========================================================================
   8. CONTROLLER — route state, render dispatch, delegated events
   ========================================================================== */

const App = {
  db: null,

  /**
   * The route carries two independent selections: where you are browsing
   * (clientId / bikeId) and which bike is open on the work bench
   * (workClientId / workBikeId). They are separate on purpose — looking up a
   * client's phone number must not close the job you are half way through.
   */
  route: { tab: "clients", clientId: null, bikeId: null, workClientId: null, workBikeId: null },
  ui: { searchClients: "", searchBikes: "", searchWork: "", searchLog: "", logFilter: "all", openVisits: new Set(),
        editJobs: new Set(),    // completed work items unlocked for correction
        openDone: new Set() },  // bikes whose "Completed on this bike" list is expanded

  navigate(patch) {
    Object.assign(App.route, patch);
    Store.saveRoute(App.route);
    App.render();
  },

  render() {
    const view = document.getElementById("view");
    document.getElementById("tabs").innerHTML = View.tabs(App.route, App.db);

    // Resolve the route defensively: entities can be deleted underneath it.
    const client = App.route.clientId ? Domain.client(App.db, App.route.clientId) : null;
    const bike = client && App.route.bikeId ? Domain.bike(App.db, client.id, App.route.bikeId) : null;

    let html;
    switch (App.route.tab) {
      case "bikes":    html = View.bikesTab(App.db, App.ui.searchBikes); break;
      case "work":     html = View.workTab(App.db, App.route, App.ui.searchWork); break;
      case "activity": html = View.activityTab(App.db); break;
      case "settings": html = View.settingsTab(App.db); break;
      case "data":     html = View.dataTab(App.db, App.ui.logFilter, App.ui.searchLog); break;
      default:
        if (client && bike)  html = View.bikeDetail(App.db, client, bike);
        else if (client)     html = View.clientDetail(App.db, client);
        else                 html = View.clientList(App.db, App.ui.searchClients);
    }
    view.innerHTML = html;
  },

  /**
   * Re-render without throwing the user out of what they were doing.
   *
   * Views are HTML strings, so every render replaces the DOM wholesale — fine
   * for a page of cards, hostile to someone typing in a search box or ticking
   * their way down a checklist. Controls that can survive a render carry a
   * `data-focus-key`; this finds the same one afterwards and puts the caret
   * and the scroll position back.
   */
  renderKeepingPlace() {
    const active = document.activeElement;
    const key = active && active.getAttribute ? active.getAttribute("data-focus-key") : null;
    const start = active && "selectionStart" in active ? active.selectionStart : null;
    const end = active && "selectionEnd" in active ? active.selectionEnd : null;
    const scroll = window.scrollY;

    App.render();
    window.scrollTo(0, scroll);

    if (!key) return;
    const next = document.querySelector(`[data-focus-key="${key.replace(/"/g, '\\"')}"]`);
    if (!next) return;
    next.focus();
    try { if (start !== null) next.setSelectionRange(start, end); } catch { /* not a text field */ }
  },

  /**
   * Redraw just the price of a completed work item. Hours, rate, discount
   * and part costs are typed into fields; a full render would take the caret
   * (and a half-typed "1.") away from the person typing them.
   */
  refreshTotals(clientId, bikeId, jobId) {
    const job = Domain.job(Domain.bike(App.db, clientId, bikeId), jobId);
    if (!job || job.status !== "done") return;
    document.querySelectorAll(`[data-job-totals="${CSS.escape(jobId)}"]`)
      .forEach(node => { node.innerHTML = View.jobTotals(job); });
  }
};

/**
 * Delegated click handlers, keyed by the `data-action` attribute.
 * Each receives (dataset, element).
 */
const HANDLERS = {

  /* --- navigation --- */
  "tab": (d) => App.navigate({ tab: d.tab }),
  "nav:clients": () => App.navigate({ tab: "clients", clientId: null, bikeId: null }),
  "client:open": (d) => App.navigate({ tab: "clients", clientId: d.client, bikeId: null }),
  "bike:open":   (d) => App.navigate({ tab: "clients", clientId: d.client, bikeId: d.bike }),

  /** Open a bike on the bench. The only way into the work space. */
  "work:open": (d) => App.navigate({ tab: "work", workClientId: d.client, workBikeId: d.bike }),

  /* --- clients --- */
  "client:add": () => Modal.open({
    title: "New client",
    submitLabel: "Create client",
    build: (body) => body.append(Form.section("Client details", CLIENT_FIELDS, {})),
    onSubmit: (body) => {
      const values = Form.values(body);
      if (!values.name) return false;
      Actions.addClient(values);
    }
  }),

  "client:edit": (d) => {
    const client = Domain.client(App.db, d.client);
    Modal.open({
      title: "Edit client",
      build: (body) => body.append(Form.section("Client details", CLIENT_FIELDS, client)),
      onSubmit: (body) => {
        const values = Form.values(body);
        if (!values.name) return false;
        Actions.updateClient(client.id, values);
      }
    });
  },

  "client:delete": (d) => {
    const client = Domain.client(App.db, d.client);
    const msg = `Delete ${client.name}, their ${client.bikes.length} bike(s) and all service history?\n\nThis cannot be undone.`;
    if (confirm(msg)) Actions.deleteClient(client.id);
  },

  /* --- bikes --- */

  /**
   * The phone-call path: a bike nobody has seen yet.
   *
   * Nothing here is required. The point is to have something to hang work on
   * while the client is still on the line — the build spec can wait until the
   * bike is on the stand. Scheduling follows immediately by default, because
   * that is the reason anyone creates one of these.
   */
  "bike:stub": (d) => Modal.open({
    title: "New bike",
    submitLabel: "Create",
    width: 560,
    build: (body) => {
      body.append(Form.section("What the client told you", [
        { key: "label", label: "Working name", wide: true,
          placeholder: "e.g. Blue Trek commuter",
          hint: "However the shop will recognise it. Everything else can be filled in when it arrives." },
        { key: "brand", label: "Brand / Make", suggest: SPEC_FIELDS.get("brand").suggest },
        { key: "bikeType", label: "Type", suggest: SPEC_FIELDS.get("bikeType").suggest }
      ], {}));
      body.append(Util.el("fieldset", {}, [
        Util.el("div", { class: "field inline" }, [
          Util.el("input", { type: "checkbox", id: "then_schedule", checked: true }),
          Util.el("label", { for: "then_schedule", text: "Schedule work for it next" })
        ])
      ]));
    },
    onSubmit: (body) => {
      const values = Form.values(body);
      const schedule = body.querySelector("#then_schedule").checked;
      Actions.addBike(d.client, {
        label: values.label,
        stub: true,
        specs: { brand: values.brand || "", bikeType: values.bikeType || "" }
      }, {
        // Deferred: this form closes itself once onSubmit returns, which would
        // take the scheduling dialog down with it.
        then: (bike) => {
          if (schedule) setTimeout(() => HANDLERS["work:schedule"]({ client: d.client, bike: bike.id }), 0);
        }
      });
    }
  }),

  "bike:add": (d) => HANDLERS._bikeForm(d.client, null),
  "bike:edit": (d) => HANDLERS._bikeForm(d.client, d.bike),

  /** Shared add/edit bike form — the same fields either way. */
  _bikeForm(clientId, bikeId) {
    const bike = bikeId ? Domain.bike(App.db, clientId, bikeId) : null;
    const specs = bike ? bike.specs : {};

    Modal.open({
      title: bike ? "Edit bike details" : "New bike",
      submitLabel: bike ? "Save changes" : "Add bike",
      build: (body) => {
        body.append(Form.section("Identification", [
          { key: "label", label: "Nickname (optional)", wide: true,
            placeholder: "e.g. Blue gravel bike — how the shop refers to it",
            hint: "Leave blank to name the bike from its year, brand and model." }
        ], { label: bike ? bike.label : "" }));

        SPEC_GROUPS.forEach(group =>
          body.append(Form.section(group.label, group.fields, specs, group.hint)));

        // "Other" — free-form rows, appended last.
        const rows = DynRows.container("kv");
        ((bike && bike.other) || []).forEach(entry => rows.append(DynRows.kvRow(entry)));
        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Other" }),
            Util.el("div", { class: "hint", text: "Anything else worth keeping: fit numbers, insurance, quirks, history." })
          ]),
          rows,
          DynRows.addButton("+ Add entry", rows, () => DynRows.kvRow())
        ]));
      },
      onSubmit: (body) => {
        const values = Form.values(body);
        // Pull the non-spec fields out before the rest becomes `specs`.
        const label = values.label || "";
        delete values.label;

        const data = { label, specs: values, other: DynRows.parseKV(body) };
        if (bike) Actions.updateBike(clientId, bike.id, data);
        else Actions.addBike(clientId, data);
      }
    });
  },

  /**
   * The counter's one click: the bike is here.
   *
   * It goes straight onto the work board, and the mechanic's view of it opens,
   * because in practice whoever takes the bike in is often the one who starts
   * looking at it.
   */
  "bike:checkin": (d) => {
    Actions.setBikeStatus(d.client, d.bike, "in_shop");
    App.navigate({ tab: "work", workClientId: d.client, workBikeId: d.bike });
  },

  /**
   * Re-tag a bike's place in the shop workflow.
   *
   * Marking work completed is the move that gets in the way first: if work
   * items are still open, saying the job is finished is nearly always somebody
   * forgetting to close them out. The warning offers the work space rather
   * than just refusing.
   */
  "bike:status": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const open = bike ? Domain.openJobs(bike) : [];

    if (d.status !== "completed" || !open.length) {
      Actions.setBikeStatus(d.client, d.bike, d.status);
      return;
    }

    Modal.ask({
      title: "Work still open",
      message:
        `“${Domain.bikeTitle(bike)}” still has ${open.length} work item${open.length === 1 ? "" : "s"} `
        + `outstanding: ${open.map(j => j.name).join(", ")}.\n\n`
        + `Completing a work item is what writes it to the bike's history and charges for it — `
        + `marking the bike done now leaves that record unwritten.`,
      actions: [
        { label: "Mark completed anyway", run: () => Actions.setBikeStatus(d.client, d.bike, "completed") },
        { label: "Open the work space", class: "btn-primary",
          run: () => App.navigate({ tab: "work", workClientId: d.client, workBikeId: d.bike }) }
      ]
    });
  },

  /** From the ⋯ menu: undo a stage that was moved on by mistake. */
  "bike:back": (d) => Actions.setBikeStatus(d.client, d.bike, d.status),

  "bike:delete": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    if (confirm(`Delete “${Domain.bikeTitle(bike)}” and all of its service history?\n\nThis cannot be undone.`)) {
      Actions.deleteBike(d.client, d.bike);
    }
  },

  /* --- scheduling work --- */

  /**
   * Put work items on a bike. Used from three places with the same dialog:
   * booking a phone call in, adding to a bike that has just arrived, and the
   * mid-job "while it was up on the stand" case from the work space.
   */
  "work:schedule": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    if (!bike) return;

    if (!App.db.workItems.length) {
      Modal.ask({
        title: "No work items yet",
        message: "Work is scheduled by picking a work item — a job with a list of steps.\n\n"
               + "Create some in Settings first; the app ships with a default set you can start from.",
        actions: [{ label: "Open Settings", class: "btn-primary", run: () => App.navigate({ tab: "settings" }) }]
      });
      return;
    }

    const inShop = Domain.status(bike).id === "in_shop";

    Modal.open({
      title: `Schedule work — ${Domain.bikeTitle(bike)}`,
      submitLabel: "Schedule",
      build: (body) => {
        const list = Util.el("div", { class: "pick-list" }, App.db.workItems.map(item => {
          return Util.el("label", { class: "pick" }, [
            Util.el("input", { type: "checkbox", "data-pick": item.id }),
            Util.el("div", {}, [
              Util.el("div", { class: "row", style: "gap:8px" }, [
                Util.el("strong", { text: item.name }),
                Util.el("span", { class: "chip", text: `Est. ${Util.hours(item.hours)} h` }),
                Util.el("span", { class: "chip", text: item.steps.length + " steps" })
              ]),
              item.description ? Util.el("div", { class: "hint", text: item.description }) : null
            ])
          ]);
        }));

        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Work items" }),
            Util.el("div", { class: "hint", text: "Each one becomes its own checklist on the bike, and part of its service history when it is finished." })
          ]),
          list
        ]));

        body.append(Form.section("The request", [
          { key: "request", label: "What the client asked for", type: "textarea", wide: true,
            placeholder: "In their words — “gears skip under load going uphill, needs it by Friday”.",
            hint: "Shown to whoever picks the bike up in the Work tab." },
          { key: "date", label: inShop ? "Date added" : "Expected in", type: "date" }
        ], { date: Util.today() }));
      },
      onSubmit: (body) => {
        const ids = Array.from(body.querySelectorAll("[data-pick]:checked")).map(i => i.dataset.pick);
        if (!ids.length) return false;
        const values = Form.values(body);
        Actions.scheduleWork(d.client, d.bike, ids, { request: values.request, date: values.date });
      }
    });
  },

  "job:delete": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const job = Domain.job(bike, d.job);
    if (!job) return;
    const msg = job.status === "done"
      ? `Delete the record of “${job.name}”?\n\nIts steps and notes will no longer appear in this bike's service history. This cannot be undone.`
      : `Cancel “${job.name}”?\n\nAny notes and part changes recorded against its steps are lost.`;
    if (confirm(msg)) Actions.deleteJob(d.client, d.bike, d.job);
  },

  /* --- working through a job --- */

  /**
   * Tick a step.
   *
   * The browser has already flipped `checked` by the time this runs, and the
   * delegated listener's `preventDefault` then flips it back — so `el.checked`
   * is the state the user asked for, and the re-render draws it from the
   * database. What is on screen is always what is stored.
   */
  "step:toggle": (d, el) => Actions.setStepDone(d.client, d.bike, d.job, d.step, el.checked),

  /** Record what was actually swapped during a step. */
  "step:parts": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const job = Domain.job(bike, d.job);
    const step = Domain.step(job, d.step);
    if (!step) return;

    Modal.open({
      title: `Parts — ${step.title}`,
      submitLabel: "Add to step",
      build: (body) => {
        const rows = DynRows.container("change");
        // A step that names the part it usually replaces points the first row
        // at it: the mechanic confirms rather than hunts.
        rows.append(DynRows.changeRow(bike, step.specKey));
        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Part changes" }),
            Util.el("div", { class: "hint", text: "Applied to the bike's specification when this work item is completed, and kept as a before → after in its service history." })
          ]),
          rows,
          DynRows.addButton("+ Add another", rows, () => DynRows.changeRow(bike, ""))
        ]));
      },
      onSubmit: (body) => {
        const changes = DynRows.parseChanges(body, bike);
        if (!changes.length) return false;
        Actions.addStepChanges(d.client, d.bike, d.job, d.step, changes);
      }
    });
  },

  "step:part-remove": (d) => Actions.removeStepChange(d.client, d.bike, d.job, d.step, d.change),

  /**
   * Unlock a completed work item to correct it in place, or lock it again.
   * Nothing is reopened: it stays completed, and every change is saved and
   * written through to the bike and its changelog entry as it is made.
   */
  "job:edit": (d) => {
    if (!App.ui.editJobs.delete(d.job)) App.ui.editJobs.add(d.job);
    App.renderKeepingPlace();
  },

  /**
   * Finish a work item: the moment the job becomes history.
   *
   * Required steps that are still open stop this once — an optional step
   * nobody did is normal, a required one is usually an oversight.
   */
  "job:complete": (d) => {
    const bike = Domain.bike(App.db, d.client, d.bike);
    const job = Domain.job(bike, d.job);
    if (!job || job.status === "done") return;
    const stats = Domain.jobStats(job);

    const form = () => HANDLERS._completeForm(d, bike, job, stats);

    if (stats.openRequired) {
      Modal.ask({
        title: "Required steps not ticked",
        message: `${stats.openRequired} required step${stats.openRequired === 1 ? " is" : "s are"} still open on `
               + `“${job.name}”:\n\n`
               + Domain.flatSteps(job).filter(({ step }) => !step.done && !step.optional)
                   .map(entry => "• " + Domain.stepLabel(entry)).join("\n"),
        actions: [
          { label: "Complete anyway", run: form },
          { label: "Back to the steps", class: "btn-primary", run: () => {} }
        ]
      });
      return;
    }
    form();
  },

  /**
   * The completion form: who, when, any closing notes, and the price — the
   * item's estimated hours at the shop rate, both editable, plus parts, less
   * an optional discount. The total underneath follows every keystroke.
   */
  _completeForm(d, bike, job, stats) {
    Modal.open({
      title: `Complete — ${job.name}`,
      submitLabel: "Complete work item",
      build: (body) => {
        body.append(Form.section("Sign-off", [
          { key: "by", label: "Completed by", placeholder: "Mechanic name" },
          { key: "date", label: "Date", type: "date" }
        ], { by: App.db.settings.lastBy || "", date: Util.today() }));

        body.append(Form.section("Labor", [
          { key: "hours", label: "Hours", type: "number", min: "0", step: "any",
            hint: "The work item's estimate. Decimals are fine, e.g. 1.75." },
          { key: "rate", label: "Hourly rate", type: "number", min: "0", step: "any",
            hint: "The shop rate from Settings." }
        ], { hours: Util.hours(job.hours), rate: App.db.settings.hourlyRate }));

        body.append(Form.section("Notes", [
          { key: "summary", label: "Closing notes (optional)", type: "textarea", wide: true, rows: 3,
            placeholder: "Anything worth knowing next time — advice given, parts to watch, follow-up needed.",
            hint: "Kept in the bike's service history and shown on the printed summary. Step notes are kept as well." }
        ], {}));

        if (stats.parts) {
          const changes = Domain.jobChanges(bike, job);
          body.append(Util.el("fieldset", {}, [
            Util.el("legend", {}, [
              Util.el("h4", { text: "Parts applied to the bike" }),
              Util.el("div", { class: "hint", text: "Saving updates the bike's live specification to these values." })
            ]),
            Util.el("ul", { class: "diff-list" }, changes.map(ch => Util.el("li", {
              text: `${Domain.changeLabel(ch)}: ${ch.from || "(empty)"} → ${ch.to || "—"}`
                  + (ch.cost ? ` · ${Util.money(ch.cost)}` : "")
            })))
          ]));
        }

        body.append(Form.section("Discount", [
          { key: "discount", label: "Discount %", type: "number", min: "0", step: "any", placeholder: "0",
            hint: "Optional. 10 takes 10% off the total." }
        ], {}));

        const total = Util.el("div", { class: "money", style: "font-size:18px" });
        const breakdown = Util.el("div", { class: "hint" });
        const update = () => {
          const price = Domain.jobPrice(job, Form.values(body));
          total.innerHTML = `<strong>${esc(Util.money(price.total))}</strong>`;
          breakdown.textContent = `${Domain.priceBreakdown(price)} · ${Domain.laborLine(price)}`;
        };
        body.append(Util.el("div", { style: "margin-top:4px" }, [total, breakdown]));
        body.addEventListener("input", update);
        update();
      },
      onSubmit: (body) => {
        const values = Form.values(body);
        Actions.completeJob(d.client, d.bike, d.job, values);

        // With nothing left open, the bike itself is done — offer the move
        // rather than making someone remember to go and find it.
        const bikeNow = Domain.bike(App.db, d.client, d.bike);
        if (bikeNow && !Domain.openJobs(bikeNow).length && Domain.status(bikeNow).id === "in_shop") {
          setTimeout(() => Modal.ask({
            title: "All work finished",
            message: `Nothing is outstanding on “${Domain.bikeTitle(bikeNow)}”.\n\n`
                   + `Mark it completed so the front counter knows it is ready for collection?`,
            actions: [
              { label: "Print summary", run: () => HANDLERS["print:visit"](d) },
              { label: "Mark work completed", class: "btn-primary",
                run: () => Actions.setBikeStatus(d.client, d.bike, "completed") }
            ]
          }), 0);
        }
      }
    });
  },

  /* --- work items (Settings) --- */

  "item:add": () => HANDLERS._itemForm(null),
  "item:edit": (d) => HANDLERS._itemForm(d.item),
  "item:duplicate": (d) => Actions.duplicateWorkItem(d.item),
  "item:restore": () => Actions.restoreDefaultWorkItems(),

  "item:delete": (d) => {
    const item = Domain.workItem(App.db, d.item);
    if (!item) return;
    if (confirm(`Delete the work item “${item.name}”?\n\nWork already scheduled or completed keeps its own copy of the steps and is not affected.`)) {
      Actions.deleteWorkItem(d.item);
    }
  },

  /** Shared new/edit template form. Steps are dynamic rows in order. */
  _itemForm(itemId) {
    const item = itemId ? Domain.workItem(App.db, itemId) : null;

    Modal.open({
      title: item ? "Edit work item" : "New work item",
      submitLabel: item ? "Save changes" : "Create work item",
      width: 820,
      build: (body) => {
        body.append(Form.section("The job", [
          { key: "name", label: "Name", required: true, wide: true, placeholder: "e.g. Tune up" },
          { key: "hours", label: "Estimated hours", placeholder: String(CONFIG.defaultHours),
            hint: "Pre-fills labor (hours × the hourly rate) when the work is completed. Decimals are fine, e.g. 1.75." },
          { key: "description", label: "What it covers", type: "textarea", wide: true,
            placeholder: "One or two lines, shown when scheduling and on the bench." }
        ], item || {}));

        const rows = DynRows.container("step-editor");
        ((item && item.steps) || []).forEach(step => rows.append(DynRows.stepRow(step)));
        if (!item) rows.append(DynRows.stepRow());

        body.append(Util.el("fieldset", {}, [
          Util.el("legend", {}, [
            Util.el("h4", { text: "Steps" }),
            Util.el("div", { class: "hint", text: "In the order they are done. Guidance shows under the step on the bench; “usually replaces” pre-selects the part when a mechanic records a swap." })
          ]),
          rows,
          DynRows.addButton("+ Add step", rows, () => DynRows.stepRow())
        ]));
      },
      onSubmit: (body) => {
        const values = Form.values(body);
        if (!values.name) return false;
        const data = Object.assign({}, values, { steps: DynRows.parseSteps(body) });
        if (item) Actions.updateWorkItem(item.id, data);
        else Actions.addWorkItem(data);
      }
    });
  },

  /** Expand or collapse one visit in a bike's service history. */
  "history:toggle": (d) => {
    const key = d.bike + ":" + d.visit;
    if (!App.ui.openVisits.delete(key)) App.ui.openVisits.add(key);
    App.renderKeepingPlace();
  },

  /* --- printing --- */

  /** Everything finished this visit, as one sheet for the client. */
  "print:visit": (d) => {
    const client = Domain.client(App.db, d.client);
    const bike = Domain.bike(App.db, d.client, d.bike);
    if (!client || !bike) return;
    const jobs = Domain.visitJobs(bike);
    if (jobs.length) Print.open(client, bike, jobs);
  },

  /** A past visit from the service history, reprinted as it was on the day. */
  "print:history": (d) => {
    const client = Domain.client(App.db, d.client);
    const bike = Domain.bike(App.db, d.client, d.bike);
    const visit = bike ? Domain.visits(bike).find(v => v.key === d.visit) : null;
    if (client && visit) Print.open(client, bike, visit.jobs, { date: visit.to || Util.today() });
  },

  /* --- data --- */
  /* --- changelog (Data tab) --- */
  "log:filter": (d) => { App.ui.logFilter = d.filter; App.renderKeepingPlace(); },

  "event:delete": (d) => {
    if (confirm("Delete this changelog entry?\n\nThe bike's current details and service history are not changed.")) {
      Actions.deleteEvent(d.client, d.bike, d.event);
    }
  },

  "data:export": () => {
    const stamp = new Date().toISOString().slice(0, 10);
    Util.download(`bikeshop-backup-${stamp}.json`, JSON.stringify(App.db, null, 2));
  },

  "data:import": () => document.getElementById("import-file").click(),

  "data:sample": () => {
    if (App.db.clients.length && !confirm("Loading sample data replaces everything currently stored. Continue?")) return;
    Actions.replaceDatabase(SAMPLE_DATA());
  },

  "data:reset": () => {
    if (!confirm("Delete every client, bike, work item and all service history?\n\nThis cannot be undone. Export a backup first if you might want it back.")) return;
    if (!confirm("Really delete everything?")) return;
    Actions.replaceDatabase(Store.empty());
  }
};

/**
 * Live-editing handlers, keyed by `data-input`. These fire on every keystroke,
 * so they save quietly and re-render only when the screen must actually change.
 */
const INPUTS = {
  /** Filter boxes: the list behind them has to change, so this re-renders. */
  "search": (d, el) => {
    App.ui[d.scope] = el.value;
    App.renderKeepingPlace();
  },

  /**
   * Notes inside a step. Nothing else on screen depends on them, so there is
   * deliberately no re-render here — the mechanic keeps typing and the value
   * is already in the database.
   */
  "step:field": (d, el) => Actions.setStepField(d.client, d.bike, d.job, d.step, d.field, el.value),

  /** A part change on an unlocked completed item: the part fitted, or its cost. */
  "change:field": (d, el) => {
    Actions.setChangeField(d.client, d.bike, d.job, d.step, d.change, d.field, el.value);
    App.refreshTotals(d.client, d.bike, d.job);
  },

  /** The sign-off and pricing of an unlocked completed item. */
  "job:field": (d, el) => {
    Actions.setJobField(d.client, d.bike, d.job, d.field, el.value);
    App.refreshTotals(d.client, d.bike, d.job);
  },

  "settings:rate": (d, el) => Actions.setHourlyRate(el.value)
};

/* ==========================================================================
   9. BOOTSTRAP
   ========================================================================== */

/** Single click listener for the whole app; finds the nearest data-action. */
document.addEventListener("click", (ev) => {
  const target = ev.target.closest("[data-action]");
  if (!target || target.closest(".modal")) return;   // modals wire their own handlers
  const handler = HANDLERS[target.dataset.action];
  if (!handler) return;
  ev.preventDefault();
  handler(target.dataset, target);
});

/** Remember which "Completed on this bike" lists are open across renders. */
document.addEventListener("toggle", (ev) => {
  const bikeId = ev.target.dataset && ev.target.dataset.doneFor;
  if (!bikeId) return;
  if (ev.target.open) App.ui.openDone.add(bikeId);
  else App.ui.openDone.delete(bikeId);
}, true);

/** An open ⋯ menu closes when you click anywhere outside it. */
document.addEventListener("click", (ev) => {
  document.querySelectorAll("details.menu[open]").forEach(menu => {
    if (!menu.contains(ev.target)) menu.open = false;
  });
});

/** Single input listener: search boxes and the live fields in the work space. */
document.addEventListener("input", (ev) => {
  const target = ev.target.closest("[data-input]");
  if (!target || target.closest(".modal")) return;
  const handler = INPUTS[target.dataset.input];
  if (handler) handler(target.dataset, target);
});

/**
 * A debounced save is still pending when a tab is closed or hidden. Flush it
 * — losing the last sentence a mechanic typed would undermine the whole point
 * of the work space.
 */
window.addEventListener("pagehide", () => Store.flush(App.db));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") Store.flush(App.db);
});

/** File picker for JSON import. */
document.addEventListener("change", (ev) => {
  if (ev.target.id !== "import-file") return;
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.clients)) throw new Error("Not a registry backup file.");
      const count = data.clients.length;
      if (confirm(`Import ${count} client(s)? This replaces everything currently stored.`)) {
        Actions.replaceDatabase(data);
      }
    } catch (err) {
      alert("Could not import that file: " + err.message);
    }
    ev.target.value = "";
  };
  reader.readAsText(file);
});

/**
 * Demo content so the app can be evaluated without typing everything in.
 * It deliberately covers the whole shape of the workflow: a bike on the bench
 * with a half-finished tune-up, a stub booked in over the phone, and a bike
 * with nothing outstanding.
 */
function SAMPLE_DATA() {
  const db = Store.empty();
  const itemNamed = (name) => db.workItems.find(w => w.name === name);

  /* --- Dana: gravel bike on the bench, mid tune-up --- */
  const client = Domain.newClient({
    name: "Dana Whitfield", phone: "555-0142", email: "dana.w@example.com",
    notes: "Rides most weekends. Prefers a call before any work over $150."
  });

  const bike = Domain.newBike({
    label: "Blue gravel bike",
    status: "in_shop", statusDate: Util.today(),
    specs: {
      brand: "Salsa", model: "Warbird", year: "2022", bikeType: "Gravel",
      frameMaterial: "Carbon", frameSize: "54", serial: "WB22-884120", color: "Deep blue",
      groupset: "Shimano GRX", drivetrain: "2x11", brakeType: "Hydraulic disc",
      wheelset: "DT Swiss G1800", tires: "Panaracer GravelKing SK 700x43",
      crankset: "GRX FC-RX810", cassette: "11-34", chain: "Shimano HG601",
      saddle: "Fizik Argo Tempo", barTape: "Lizard Skins 3.2mm", pedals: "Shimano XT M8100",
      tubeless: "Yes — sealant"
    },
    other: [
      { id: Util.uid("o"), label: "Fit measurements", value: "Saddle height 742mm, setback 65mm" },
      { id: Util.uid("o"), label: "Purchased", value: "March 2022, from us" }
    ]
  });

  bike.events.push(
    Domain.newEvent({
      kind: "work", date: "2026-03-14", by: "Ellis", title: "Spring service",
      description: "Full strip and clean, bled both brakes, trued rear wheel. Chain at 0.6% — replaced.",
      cost: "145", changes: [
        { target: "spec", key: "chain", label: "Chain", from: "Shimano HG601", to: "Shimano HG601 (new)", cost: 32 }
      ]
    }),
    Domain.newEvent({
      kind: "owner", date: "2026-06-02", by: "Owner", title: "Fitted own saddle",
      description: "Swapped to a saddle brought back from a bike fit elsewhere.",
      cost: "0", changes: [
        { target: "spec", key: "saddle", label: "Saddle", from: "Fizik Argo Tempo", to: "Specialized Power Expert", cost: 0 }
      ]
    })
  );

  // A tune-up part-way down the list: the first few sections ticked, the
  // chain half done with a part on its wear check.
  const tuneUp = Domain.newJob(itemNamed("Tune up"), {
    request: "Gears skip under load going uphill, and the rear brake feels soft. Needs it by Friday."
  });
  tuneUp.status = "active";
  tuneUp.startedAt = Date.now();
  const find = (title, sub) => {
    const step = tuneUp.steps.find(s => s.title === title);
    return sub ? step.substeps.find(s => s.title === sub) : step;
  };
  const tick = (step) => { step.done = true; step.doneAt = Date.now(); };
  ["Frame / Fork", "Bottom Bracket and Crankset", "Pedals", "Cassette/Freehub"].forEach(title => {
    const step = find(title);
    step.substeps.forEach(tick);
    tick(step);
  });
  tick(find("Chain", "Condition"));
  const wear = find("Chain", "Wear");
  tick(wear);
  wear.notes = "0.9% — well past it. Cassette teeth hooked too, quoted the client.";
  wear.changes.push({
    id: Util.uid("ch"), target: "spec", key: "chain", label: "Chain",
    from: "Shimano HG601 (new)", to: "Shimano HG601", cost: 34
  });
  const hanger = find("Rear Derailleur", "Derailleur hanger check");
  tick(hanger);
  hanger.notes = "Hanger was 4mm out. Straightened, indexes cleanly now.";
  bike.jobs.push(tuneUp);

  const commuter = Domain.newBike({
    specs: {
      brand: "Trek", model: "FX 3 Disc", year: "2019", bikeType: "Hybrid",
      frameMaterial: "Aluminium", frameSize: "M", color: "Matte black",
      drivetrain: "2x9", brakeType: "Hydraulic disc", tires: "Bontrager H2 700x35"
    }
  });

  client.bikes.push(bike, commuter);

  /* --- Marco: a stub booked in over the phone this morning --- */
  const second = Domain.newClient({ name: "Marco Reyes", phone: "555-0197", company: "Northside Couriers" });

  const stub = Domain.newBike({
    label: "Courier singlespeed",
    stub: true,
    status: "scheduled", statusDate: Util.today(),
    specs: { brand: "Surly", bikeType: "Commuter" }
  });
  stub.jobs.push(Domain.newJob(itemNamed("Tune up"), {
    request: "Hasn't been serviced since he bought it. Rides it every day in all weather — do whatever it needs."
  }));
  stub.events.push(Domain.newEvent({
    kind: "status", date: Util.today(), title: "Scheduled for work",
    description: "Tune up\nHasn't been serviced since he bought it.",
    changes: [{ target: "note", key: "status", label: "Status", from: "Out of shop", to: "Scheduled for work", cost: 0 }]
  }));
  second.bikes.push(stub);

  db.clients.push(client, second);
  return db;
}

/* Start. */
App.db = Store.load();
Object.assign(App.route, Store.loadRoute() || {});
App.render();
</script>
