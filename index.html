   * Correct a part change in place: the part fitted (`to`) or its `cost`.
   * On a completed job the new name follows through to the bike, unless the
   * bike has moved on to something else since.
   */
  setChangeField(clientId, bikeId, jobId, stepId, changeId, field, value) {
    Actions._withJob(Actions.commitQuiet, clientId, bikeId, jobId, (bike, job) => {
      const step = Domain.step(job, stepId);
      const change = step && step.changes.find(c => c.id === changeId);
      if (!change) return false;
      if (field === "cost") {
        change.cost = Util.parseMoney(value);
      } else if (field === "to") {
        const fitted = job.status === "done" && Domain.currentValue(bike, change) === change.to;
        change.to = value;
        if (fitted) Actions._setCurrentValue(bike, change, value);
      }
    });
  },

  /**
   * Edit a completed job's sign-off: who, when, closing notes, and the
   * pricing — hours, rate and discount.
   */
  setJobField(clientId, bikeId, jobId, field, value) {
    Actions._withJob(Actions.commitQuiet, clientId, bikeId, jobId, (bike, job) => {
      if (field === "hours" || field === "rate") job[field] = Domain.parseHours(value);
      else if (field === "discount") job.discount = Math.min(100, Domain.parseHours(value));
      else if (field === "by" || field === "completedDate" || field === "summary") job[field] = value;
      else return false;
    });
  },

  /** The shop rate that pre-fills labor when work is completed. */
  setHourlyRate(value) {
    Actions.commitQuiet(db => { db.settings.hourlyRate = Domain.parseHours(value); });
  },

  /**
   * Finish a work item.
   *
   * This is the one path where history and current state move together: the
   * job's part changes are applied to the bike's live specification and a
   * single dated "Shop work" entry goes into the internal changelog. The job
   * itself stays on the bike as the record of how it was done — that is the
   * service history the bike page shows and the printout is built from.
   *
   * Pricing is fixed on the job here: `values.hours`, `values.rate` and
   * `values.discount` (percent), so it never moves with the shop rate later.
   */
  completeJob(clientId, bikeId, jobId, values) {
    Actions.commit(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      const job = Domain.job(bike, jobId);
      if (!job || job.status === "done") return;

      // Applied in order, each anchored to what the bike says at that moment:
      // the same part swapped twice in one job still reads as an honest diff,
      // and the stored `from` is what a later correction puts back.
      Domain.allSteps(job).forEach(step => (step.changes || []).forEach(change => {
        const now = Domain.currentValue(bike, change);
        if (now !== null) change.from = now;
        Actions._applyChange(bike, change);
      }));

      job.status = "done";
      job.completedAt = Date.now();
      job.completedDate = values.date || Util.today();
      job.by = values.by || "";
      // Priced exactly as the form's preview showed it.
      const price = Domain.jobPrice(job, values);
      job.hours = price.hours;
      job.rate = price.rate;
      job.discount = price.discount;
      job.summary = values.summary || "";
      job.visitStart = bike.leftShopAt || 0;  // which visit this belongs to

      const event = Domain.newEvent({ kind: "work" });
      bike.events.push(event);
      job.eventId = event.id;
      Actions._syncJobEvent(bike, job);
      db.settings.lastBy = values.by || db.settings.lastBy;
    });
  },

  /** Rewrite a completed job's "Shop work" changelog entry from the job as it is now. */
  _syncJobEvent(bike, job) {
    const event = job.eventId && bike.events.find(e => e.id === job.eventId);
    if (!event) return;   // deleted from the log on purpose; leave it gone
    Object.assign(event, {
      date: job.completedDate,
      by: job.by,
      title: job.name,
      description: Domain.jobSummary(job),
      cost: Domain.jobPrice(job).total,
      changes: Domain.allSteps(job).flatMap(step => step.changes || []).map(c => Object.assign({}, c))
    });
  },

  /** Apply one recorded change to the bike's current specification. */
  _applyChange(bike, change) {
    if (change.target === "other" && !(bike.other || []).some(o => o.id === change.key)) {
      const entry = { id: Util.uid("o"), label: change.label, value: change.to };
      (bike.other = bike.other || []).push(entry);
      change.key = entry.id;   // so a later correction can find it again
      return;
    }
    Actions._setCurrentValue(bike, change, change.to);
    // target === "note": recorded in history only, by design.
  },

  /**
   * Undo an applied change — but only if the bike still shows the part it
   * fitted. Anything else means the bike has moved on, and is left alone.
   */
  _revertChange(bike, change) {
    if (Domain.currentValue(bike, change) === change.to) Actions._setCurrentValue(bike, change, change.from || "");
  },

  _setCurrentValue(bike, change, value) {
    if (change.target === "spec") {
      bike.specs[change.key] = value;
    } else if (change.target === "other") {
      const entry = (bike.other || []).find(o => o.id === change.key);
      if (entry) entry.value = value;
    }
  },

  /**
   * Remove a changelog entry. The bike's current spec is left as-is: history
   * is a record of what happened, and un-applying it would be a guess.
   */
  deleteEvent(clientId, bikeId, eventId) {
    Actions.commitLocal(db => {
      const bike = Domain.bike(db, clientId, bikeId);
      if (bike) bike.events = bike.events.filter(e => e.id !== eventId);
    });
  },

  replaceDatabase(data) {
    App.db = Store.migrate(data);
    Store.save(App.db);
    App.navigate({ tab: "clients", clientId: null, bikeId: null, workBikeId: null, workClientId: null });
  }
};

/* ==========================================================================
   6. COMPONENTS — reusable DOM builders (modal + form primitives)
   ========================================================================== */

const Modal = {
  /**
   * Open a form modal.
   *   title       heading text
   *   build(body) fills the scrollable body; return value ignored
   *   submitLabel primary button text
   *   onSubmit(body)  -> return false to keep the modal open
   */
  open({ title, build, submitLabel = "Save", onSubmit, width }) {
    Modal.close();

    const body = Util.el("div", { class: "body" });
    build(body);

    const form = Util.el("form", {
      class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title,
      style: width ? `width:min(${width}px,100%)` : null,
      onsubmit: (ev) => {
        ev.preventDefault();
        if (onSubmit(body) !== false) Modal.close();
      }
    }, [
      Util.el("header", {}, [Util.el("h2", { text: title })]),
      body,
      Util.el("footer", {}, [
        Util.el("button", { type: "button", class: "btn", text: "Cancel", onclick: Modal.close }),
        Util.el("button", { type: "submit", class: "btn btn-primary", text: submitLabel })
      ])
    ]);

    Modal._mount(form);
    const first = body.querySelector("input, textarea, select");
    if (first) first.focus();
  },

  /**
   * A question with several ways out — no form, no saving.
   *
   * `message` is plain text; blank lines split it into paragraphs. `actions`
   * are rendered after Cancel in the order given, each `{ label, class, run }`.
   * The dialog closes before `run()` is called, so an action is free to open a
   * modal of its own.
   */
  ask({ title, message, actions = [] }) {
    Modal.close();

    const dialog = Util.el("div", {
      class: "modal", role: "alertdialog", "aria-modal": "true", "aria-label": title
    }, [
      Util.el("header", {}, [Util.el("h2", { text: title })]),
      Util.el("div", { class: "body" },
        String(message).split("\n\n").map(text => Util.el("p", { text }))),
      Util.el("footer", {}, [
        Util.el("button", { type: "button", class: "btn", text: "Cancel", onclick: Modal.close })
      ].concat(actions.map(action => Util.el("button", {
        type: "button",
        class: "btn " + (action.class || ""),
        text: action.label,
        onclick: () => { Modal.close(); action.run(); }
      }))))
    ]);

    Modal._mount(dialog);
    const buttons = dialog.querySelectorAll("footer button");
    if (buttons.length) buttons[buttons.length - 1].focus();
  },

  /** Put a built dialog on screen behind a click-to-dismiss backdrop. */
  _mount(dialog) {
    const backdrop = Util.el("div", {
      class: "modal-backdrop",
      onmousedown: (ev) => { if (ev.target === backdrop) Modal.close(); }
    }, [dialog]);

    document.getElementById("modal-root").append(backdrop);
    document.addEventListener("keydown", Modal._onKey);
  },

  close() {
    document.getElementById("modal-root").innerHTML = "";
    document.removeEventListener("keydown", Modal._onKey);
  },

  _onKey(ev) { if (ev.key === "Escape") Modal.close(); }
};

const Form = {
  /** One labelled control. `field` uses the schema shape from section 1. */
  field(field, value = "") {
    const id = "f_" + field.key;
    let input;

    if (field.type === "textarea") {
      input = Util.el("textarea", { id, name: field.key, text: value, rows: field.rows || 3,
                                    placeholder: field.placeholder });
    } else {
      input = Util.el("input", {
        id, name: field.key, value: value ?? "",
        type: field.type === "number" ? "number" : (field.type || "text"),
        step: field.step, min: field.min, placeholder: field.placeholder,
        required: !!field.required,
        list: field.suggest ? id + "_list" : null,
        autocomplete: "off"
      });
    }

    const children = [Util.el("label", { for: id, text: field.label + (field.required ? " *" : "") }), input];
    if (field.suggest) {
      children.push(Util.el("datalist", { id: id + "_list" },
        field.suggest.map(opt => Util.el("option", { value: opt }))));
    }
    if (field.hint) children.push(Util.el("div", { class: "hint", text: field.hint }));

    return Util.el("div", { class: "field" + (field.wide || field.type === "textarea" ? " wide" : "") }, children);
  },

  /** A <fieldset> of fields laid out in the responsive grid. */
  section(legend, fields, values = {}, hint) {
    return Util.el("fieldset", {}, [
      Util.el("legend", {}, [
        Util.el("h4", { text: legend }),
        hint ? Util.el("div", { class: "hint", text: hint }) : null
      ].filter(Boolean)),
      Util.el("div", { class: "fields" }, fields.map(f => Form.field(f, values[f.key])))
    ]);
  },

  /** Read every named control inside a container into a plain object. */
  values(container) {
    const out = {};
    container.querySelectorAll("[name]").forEach(input => {
      if (input.closest(".dyn-row")) return;   // dynamic rows are parsed separately
      out[input.name] = input.value.trim();
    });
    return out;
  },

  /** A <select> over every spec field, grouped exactly as the forms are. */
  specSelect(attrs, selected) {
    return Util.el("select", attrs, [
      Util.el("option", { value: "", text: "— none —" }),
      ...SPEC_GROUPS.map(group => Util.el("optgroup", { label: group.label },
        group.fields.map(f => Util.el("option", {
          value: f.key, text: f.label, selected: f.key === selected
        }))))
    ]);
  }
};

/**
 * Repeatable rows: free-form "other" entries, part-change entries, and the
 * step editor behind a work-item template. Each row is a .dyn-row; `parse`
 * reads them back out of the DOM.
 */
const DynRows = {
  container(className) {
    return Util.el("div", { class: "dyn-rows", "data-rows": className });
  },

  addButton(label, container, factory) {
    return Util.el("button", {
      type: "button", class: "btn btn-sm", text: label,
      onclick: () => {
        container.append(factory());
        const inputs = container.lastElementChild.querySelectorAll("input, select, textarea");
        if (inputs.length) inputs[0].focus();
      }
    });
  },

  removeButton(label = "Remove") {
    return Util.el("button", {
      type: "button", class: "btn btn-sm btn-danger", text: label,
      title: "Remove this row",
      onclick: (ev) => ev.target.closest(".dyn-row").remove()
    });
  },

  /* --- free-form label/value rows --- */
  kvRow(entry = {}) {
    return Util.el("div", { class: "dyn-row kv", "data-id": entry.id || "" }, [
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Label" }),
        Util.el("input", { "data-kv": "label", value: entry.label || "", placeholder: "e.g. Fit measurements" })
      ]),
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Detail" }),
        Util.el("input", { "data-kv": "value", value: entry.value || "", placeholder: "e.g. Saddle height 742mm" })
      ]),
      DynRows.removeButton()
    ]);
  },

  parseKV(container) {
    return Array.from(container.querySelectorAll(".dyn-row.kv")).map(row => ({
      id: row.dataset.id || Util.uid("o"),
      label: row.querySelector('[data-kv="label"]').value.trim(),
      value: row.querySelector('[data-kv="value"]').value.trim()
    })).filter(entry => entry.label || entry.value);
  },

  /* --- part-change rows --- */

  /**
   * Everything a change can point at, as one flat alphabetical list: spec
   * fields first-class alongside the bike's own "Other" rows.
   *
   * No "Core —" / "Extras —" prefixes. Which group a field lives in is a fact
   * about this app's forms, not about the bike, and prefixing every option
   * with it breaks the only search anyone actually performs: type "cass", get
   * Cassette. Where an "Other" row happens to share a spec field's name it is
   * numbered rather than silently shadowing it.
   */
  changeTargets(bike) {
    const options = [];
    SPEC_GROUPS.forEach(group => group.fields.forEach(f => options.push({
      value: "spec:" + f.key,
      label: f.label,
      current: (bike.specs || {})[f.key] || ""
    })));
    (bike.other || []).forEach(o => options.push({
      value: "other:" + o.id,
      label: o.label || "Untitled entry",
      current: o.value || ""
    }));

    const taken = new Set();
    options.forEach(opt => {
      let label = opt.label;
      for (let n = 2; taken.has(label.toLowerCase()); n++) label = `${opt.label} (${n})`;
      opt.label = label;
      taken.add(label.toLowerCase());
    });

    return options.sort((a, b) => a.label.localeCompare(b.label));
  },

  /** The target a typed part name refers to, or null for free text. */
  findTarget(targets, text) {
    const needle = String(text || "").trim().toLowerCase();
    return needle ? targets.find(t => t.label.toLowerCase() === needle) || null : null;
  },

  /**
   * One part-change row.
   *
   * The part is a text box over a datalist rather than a <select>: typing
   * filters the list as you go, and anything that is not a known part is kept
   * anyway as a log-only note under whatever the mechanic called it — which is
   * what the old "Something else" option existed to do, without the option.
   *
   * `preselect` is a spec key, used to point a step's row at its own part.
   */
  changeRow(bike, preselect) {
    const targets = DynRows.changeTargets(bike);
    const listId = Util.uid("parts");

    const input = Util.el("input", {
      "data-change": "target", list: listId, autocomplete: "off",
      placeholder: "Type to search…"
    });
    const options = Util.el("datalist", { id: listId },
      targets.map(t => Util.el("option", { value: t.label })));

    const toInput = Util.el("input", { "data-change": "to", placeholder: "New value" });
    const costInput = Util.el("input", { "data-change": "cost", placeholder: "0.00", inputmode: "decimal" });
    const currentHint = Util.el("div", { class: "hint", text: " " });

    const sync = () => {
      const match = DynRows.findTarget(targets, input.value);
      currentHint.textContent = !input.value.trim() ? " "
        : match ? (match.current ? "Currently: " + match.current : "Currently: (empty)")
                : "Not on the record — will be logged as a note.";
    };
    input.addEventListener("input", sync);

    if (preselect && SPEC_FIELDS.has(preselect)) {
      const match = targets.find(t => t.value === "spec:" + preselect);
      if (match) { input.value = match.label; sync(); }
    }

    return Util.el("div", { class: "dyn-row change" }, [
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Part" }), input, options, currentHint
      ]),
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "New value" }), toInput
      ]),
      Util.el("div", { class: "field" }, [
        Util.el("label", { text: "Part cost" }), costInput
      ]),
      DynRows.removeButton()
    ]);
  },

  /** Turn change rows into stored change records (captures the old value). */
  parseChanges(container, bike) {
    const targets = DynRows.changeTargets(bike);
    return Array.from(container.querySelectorAll(".dyn-row.change")).map(row => {
      const text = row.querySelector('[data-change="target"]').value.trim();
      if (!text) return null;

      const to = row.querySelector('[data-change="to"]').value.trim();
      const cost = Util.parseMoney(row.querySelector('[data-change="cost"]').value);
      const match = DynRows.findTarget(targets, text);

      // Unrecognised text is still worth keeping — recorded against the log
      // only, so a typo can never quietly write itself into the specification.
      // With nothing to say about it, though, it was half-typed and abandoned.
      if (!match) return (to || cost) ? { target: "note", key: "", label: text, from: "", to, cost } : null;

      const cut = match.value.indexOf(":");
      return {
        target: match.value.slice(0, cut),
        key: match.value.slice(cut + 1),
        label: match.label,
        from: match.current,
        to, cost
      };
    }).filter(Boolean);
  },

  /* --- work-item step editor --- */

  /**
   * One step of a template. Six controls in a single line is unreadable, so a
   * step is a small block: title on top, then the numbers and flags. Order is
   * part of the meaning of a checklist, hence the move buttons.
   *
   * A substep is the same block one level in (`isSub`), without substeps of
   * its own. A step keeps its substeps in a box underneath its own fields.
   */
  stepRow(step = {}, isSub = false) {
    const optionalId = "opt_" + Util.uid("s");
    const move = (dir) => (ev) => {
      const row = ev.target.closest(".dyn-row");
      const sibling = dir < 0 ? row.previousElementSibling : row.nextElementSibling;
      if (sibling) dir < 0 ? sibling.before(row) : sibling.after(row);
    };

    let substeps = null;
    if (!isSub) {
      const rows = Util.el("div", { class: "substeps" });
      (step.substeps || []).forEach(sub => rows.append(DynRows.stepRow(sub, true)));
      substeps = Util.el("div", { class: "substeps-box" }, [
        Util.el("div", { class: "hint", text: "Substeps — each has its own checkbox and parts. Ticking the last one ticks this step." }),
        rows,
        Util.el("div", { style: "margin-top:8px" }, [
          DynRows.addButton("+ Add substep", rows, () => DynRows.stepRow({}, true))
        ])
      ]);
    }

    return Util.el("div", { class: "dyn-row step-editor" + (isSub ? " substep" : "") }, [
      Util.el("div", { class: "top" }, [
        Util.el("div", { class: "field" }, [
          Util.el("label", { text: isSub ? "Substep" : "Step" }),
          Util.el("input", { "data-step": "title", value: step.title || "",
                             placeholder: isSub ? "e.g. Derailleur hanger check" : "e.g. Rear Derailleur" })
        ]),
        Util.el("div", { class: "row" }, [
          Util.el("button", { type: "button", class: "btn btn-sm", text: "↑", title: "Move up", onclick: move(-1) }),
          Util.el("button", { type: "button", class: "btn btn-sm", text: "↓", title: "Move down", onclick: move(1) }),
          DynRows.removeButton("✕")
        ])
      ]),
      Util.el("div", { class: "field", style: "margin-top:8px" }, [
        Util.el("label", { text: "Guidance for the mechanic (optional)" }),
        Util.el("input", { "data-step": "note", value: step.note || "",
                           placeholder: "e.g. Check hanger alignment first" })
      ]),
      Util.el("div", { class: "sub" }, [
        Util.el("div", { class: "field" }, [
          Util.el("label", { text: "Usually replaces" }),
          Form.specSelect({ "data-step": "specKey" }, step.specKey || "")
        ]),
        Util.el("div", { class: "field inline", style: "align-self:end;padding-bottom:8px" }, [
          Util.el("input", { "data-step": "optional", type: "checkbox", checked: !!step.optional,
                             id: optionalId }),
          Util.el("label", { for: optionalId, text: "Optional", style: "font-size:13px",
                             title: "Optional steps are not counted when a work item is completed" })
        ])
      ]),
      substeps
    ]);
  },

  /** Steps in order, each with its substeps; blank titles are dropped. */
  parseSteps(container) {
    // A step row contains its substep rows, so only read controls that belong
    // to the row itself rather than to one nested inside it.
    const own = (row, selector) => Array.from(row.querySelectorAll(selector))
      .find(node => node.closest(".dyn-row") === row);
    const read = (row) => ({
      title: own(row, '[data-step="title"]').value.trim(),
      note: own(row, '[data-step="note"]').value.trim(),
      specKey: own(row, '[data-step="specKey"]').value,
      optional: own(row, '[data-step="optional"]').checked
    });

    return Array.from(container.querySelectorAll(".dyn-row.step-editor:not(.substep)")).map(row =>
      Object.assign(read(row), {
        substeps: Array.from(row.querySelectorAll(".dyn-row.substep")).map(read).filter(sub => sub.title)
      })
    ).filter(step => step.title);
  }
};

/**
 * The printable work summary: one sheet the client takes away. It is shown
 * full-screen before printing and every word of it is editable, so the
 * mechanic can tidy a note or add a line for the client. Nothing typed here
 * is saved — it is a document, not a record.
 *
 * Two versions are rendered side by side and toggled: "short" (the default)
 * squeezes each work item to a couple of lines; "long" lists every step with
 * its notes and part changes. Edits made in one are kept if you switch away
 * and back. Both close each item with its price (total, then labor + parts)
 * and end the sheet with the visit's total.
 */
const Print = {
  open(client, bike, jobs, { title = "Work summary", date = Util.today() } = {}) {
    Print.close();
    const root = document.getElementById("print-root");

    const sheet = Util.el("div", {
      class: "ps-sheet", "data-mode": "short", contenteditable: "true", spellcheck: "true",
      html: Print.sheet(client, bike, jobs, title, date)
    });

    const modeButton = (mode, label) => Util.el("button", {
      type: "button", text: label, "aria-pressed": String(mode === "short"),
      onclick: (ev) => {
        sheet.dataset.mode = mode;
        ev.target.parentNode.querySelectorAll("button")
          .forEach(b => b.setAttribute("aria-pressed", String(b === ev.target)));
      }
    });

    root.append(Util.el("div", { class: "print-view", role: "dialog", "aria-label": title }, [
      Util.el("div", { class: "print-toolbar" }, [
        Util.el("strong", { text: title }),
        Util.el("span", { class: "small muted", text: "Click anywhere on the page to edit it." }),
        Util.el("span", { class: "spacer" }),
        Util.el("div", { class: "seg", role: "group", "aria-label": "Detail" },
          [modeButton("short", "Short"), modeButton("long", "Long")]),
        Util.el("button", { type: "button", class: "btn", text: "Close", onclick: Print.close }),
        Util.el("button", { type: "button", class: "btn btn-primary", text: "Print",
                            onclick: () => Print.print(sheet) })
      ]),
      sheet
    ]));
    document.body.classList.add("printing");
    window.scrollTo(0, 0);
  },

  /** Blank optional blocks are left out of the paper copy. */
  print(sheet) {
    sheet.querySelectorAll("[data-optional]").forEach(node => {
      const body = node.querySelector("[data-body]") || node;
      node.classList.toggle("is-blank", !body.textContent.trim());
    });
    window.print();
  },

  close() {
    const root = document.getElementById("print-root");
    if (root) root.innerHTML = "";
    document.body.classList.remove("printing");
  },

  sheet(client, bike, jobs, title, date) {
    const s = bike.specs || {};
    const line = (label, value) => value
      ? `<div><span class="ps-label">${esc(label)}</span> ${esc(value)}</div>` : "";

    return `
      <header class="ps-head">
        <h1>${esc(title)}</h1>
        <div class="ps-date">${esc(Util.formatDate(date))}</div>
      </header>
      <section class="ps-meta">
        <div>
          <h2>Client</h2>
          <div class="ps-strong">${esc(client.name)}</div>
          ${line("Phone", client.phone)}${line("Email", client.email)}${line("Company", client.company)}
        </div>
        <div>
          <h2>Bike</h2>
          <div class="ps-strong">${esc(Domain.bikeTitle(bike))}</div>
          ${line("Model", Domain.bikeSubtitle(bike))}${line("Colour", s.color)}
          ${line("Size", s.frameSize)}${line("Serial", s.serial)}
        </div>
      </section>
      <section class="ps-short">
        <h2>Work carried out</h2>
        ${jobs.map(Print.shortJob).join("")}
      </section>
      <section class="ps-long">
        <h2>Work carried out</h2>
        ${jobs.map(Print.longJob).join("")}
      </section>
      <section class="ps-notes" data-optional>
        <h2>Notes</h2>
        <div class="ps-notes-body" data-body data-placeholder="Add a note for the client — optional, left off the page if blank."></div>
      </section>
      <section class="ps-total">
        <h2>Total</h2>
        <strong>${esc(Util.money(jobs.reduce((sum, job) => sum + Domain.jobPrice(job).total, 0)))}</strong>
      </section>`;
  },

  /** The closing price line of one work item, laid out as on the work card. */
  price(job) {
    const price = Domain.jobPrice(job);
    return `
      <div class="ps-price">
        <strong>${esc(Util.money(price.total))}</strong>
        <span class="ps-dim">${esc(Domain.priceBreakdown(price))}</span>
      </div>`;
  },

  /** Part changes as "Chain: Shimano HG601". `withFrom` adds the old value. */
  parts(job, withFrom) {
    return Domain.allSteps(job).flatMap(step => step.changes || []).map(ch =>
      `${Domain.changeLabel(ch)}: ${withFrom && ch.from ? ch.from + " → " : ""}${ch.to || "removed"}`);
  },

  shortJob(job) {
    const done = job.steps.filter(st => st.done).map(st => st.title);
    const parts = Print.parts(job, false);
    return `
      <article class="ps-job">
        <div class="ps-job-head"><strong>${esc(job.name)}</strong>
          <span>${esc(Util.formatDate(job.completedDate))}</span></div>
        ${done.length ? `<p>${esc(done.join(" · "))}</p>` : ""}
        ${parts.length ? `<p><span class="ps-label">Parts fitted</span> ${esc(parts.join("; "))}</p>` : ""}
        ${job.summary ? `<p class="ps-pre">${esc(job.summary)}</p>` : ""}
        ${Print.price(job)}
      </article>`;
  },

  longJob(job) {
    const meta = [
      Util.formatDate(job.completedDate),
      job.by ? "by " + job.by : ""
    ].filter(Boolean).join(" · ");

    const line = (st) => {
      const parts = (st.changes || []).map(ch =>
        `${Domain.changeLabel(ch)}: ${ch.from ? ch.from + " → " : ""}${ch.to || "removed"}`
        + (ch.cost ? ` (${Util.money(ch.cost)})` : ""));
      return `${esc(st.title)}${st.notes ? ` — <em>${esc(st.notes)}</em>` : ""}${
        parts.length ? `<div class="ps-parts">${esc(parts.join("; "))}</div>` : ""}`;
    };
    // A step shows if it or any of its substeps was done; done substeps nest under it.
    const steps = job.steps.map(st => {
      const subs = (st.substeps || []).filter(sub => sub.done);
      if (!st.done && !subs.length) return "";
      return `<li>${line(st)}${subs.length
        ? `<ul>${subs.map(sub => `<li>${line(sub)}</li>`).join("")}</ul>` : ""}</li>`;
    }).join("");

    return `
      <article class="ps-job">
        <div class="ps-job-head"><strong>${esc(job.name)}</strong><span>${esc(meta)}</span></div>
        ${job.request ? `<p><span class="ps-label">You asked</span> ${esc(job.request)}</p>` : ""}
        ${steps ? `<ul>${steps}</ul>` : ""}
        ${job.summary ? `<p class="ps-pre">${esc(job.summary)}</p>` : ""}
        ${Print.price(job)}
      </article>`;
  }
};

/* ==========================================================================
   7. VIEWS — pure functions returning HTML strings
   ========================================================================== */

const TABS = [
  { id: "clients",  label: "Clients" },
  { id: "bikes",    label: "Bikes" },
  { id: "work",     label: "Work" },
  { id: "activity", label: "Activity" },
  { id: "settings", label: "Settings" },
  { id: "data",     label: "Data" }
];

const View = {

  /** The Work tab carries a count: how many bikes are on the bench right now. */
  tabs(route, db) {
    const inShop = Domain.allBikes(db).filter(({ bike }) => Domain.status(bike).id === "in_shop").length;
    return TABS.map(t => `
      <button class="tab" role="tab" aria-selected="${t.id === route.tab}"
              data-action="tab" data-tab="${t.id}">${esc(t.label)}${
        t.id === "work" && inShop ? `<span class="count">${inShop}</span>` : ""}</button>`).join("");
  },

  /* --- shared fragments ------------------------------------------------- */

  empty(icon, title, body, action) {
    return `<div class="empty">
      <span class="big">${icon}</span>
      <h3>${esc(title)}</h3>
      <p class="small">${esc(body)}</p>
      ${action ? `<p style="margin-top:14px">${action}</p>` : ""}
    </div>`;
  },

  /** The bike's current status as a badge. `short` fits inside card titles. */
  statusBadge(bike, short) {
    const s = Domain.status(bike);
    return `<span class="badge ${s.badge}">${esc(short ? s.short : s.label)}</span>`;
  },

  /**
   * The single button that matters for a bike right now, wherever it appears
   * in a list. A bike due in wants checking in; a bike on the bench wants
   * opening in the work space. One click, no menu, no detail page first.
   */
  quickAction(client, bike) {
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;
    switch (Domain.status(bike).id) {
      case "scheduled":
        return `<button class="btn btn-sm btn-primary" data-action="bike:checkin" ${ids}
                        title="Mark this bike as arrived and put it on the work board">→ Check in</button>`;
      case "in_shop":
        return `<button class="btn btn-sm btn-primary" data-action="work:open" ${ids}>Open work</button>`;
      case "completed":
        return `<button class="btn btn-sm" data-action="bike:status" data-status="out" ${ids}>Mark picked up</button>`;
      default:
        return `<button class="btn btn-sm" data-action="work:schedule" ${ids}>Schedule work</button>`;
    }
  },

  /** "2 items · 7/18 steps" — the one-line state of a bike's open work. */
  workLine(bike) {
    const s = Domain.bikeWorkStats(bike);
    if (!s.jobs) return "";
    return `${s.jobs} work item${s.jobs === 1 ? "" : "s"} · ${s.done}/${s.total} steps`;
  },

  progressBar(percent) {
    return `<div class="progress${percent >= 100 ? " full" : ""}"><span style="width:${percent}%"></span></div>`;
  },

  /**
   * The bike page's status row: where the bike is now, and the one button
   * that moves it to the next stage, coloured for the stage it moves it to.
   * From "out" the next step is booking work in, so that button opens the
   * scheduling dialog rather than setting a bare status.
   */
  statusBar(client, bike) {
    const current = Domain.status(bike);
    const next = Domain.nextStatus(bike);
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;
    const action = current.id === "out"
      ? `data-action="work:schedule"` : `data-action="bike:status" data-status="${esc(next.id)}"`;

    return `
      <div class="status-bar">
        ${View.statusBadge(bike)}
        ${bike.statusDate ? `<span class="small muted">since ${esc(Util.formatDate(bike.statusDate))}</span>` : ""}
        <span class="spacer"></span>
        <button class="btn btn-stage" data-to="${esc(next.id)}" ${action} ${ids}>${
          esc(current.id === "out" ? "Schedule work…" : next.action)}</button>
      </div>`;
  },

  /**
   * The bike page's ⋯ menu: editing the record, undoing a stage moved by
   * mistake, and deleting. Everything that is not the day-to-day flow.
   */
  bikeMenu(client, bike) {
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;
    const current = Domain.status(bike);
    // Backing out of "scheduled" would be cancelling a booking, not fixing a slip.
    const back = current.id === "scheduled" ? null
      : BIKE_STATUSES.find(s => s.next === current.id);
    return `
      <details class="menu">
        <summary aria-label="More actions" title="More actions">⋯</summary>
        <div class="pop">
          <button data-action="bike:edit" ${ids}>Edit details</button>
          ${back ? `<button data-action="bike:back" data-status="${esc(back.id)}" ${ids}>↩ Move back to ${esc(back.short)}</button>` : ""}
          <hr>
          <button class="danger" data-action="bike:delete" ${ids}>Delete bike</button>
        </div>
      </details>`;
  },

  specChips(bike) {
    const s = bike.specs || {};
    return ["bikeType", "groupset", "frameMaterial", "frameSize", "drivetrain"]
      .filter(k => s[k])
      .map(k => `<span class="chip">${esc(SPEC_FIELDS.get(k).label)}: <strong>${esc(s[k])}</strong></span>`)
      .join(" ");
  },

  /** One changelog entry, with the client/bike it belongs to. */
  entry(client, bike, event) {
    const kind = ENTRY_KINDS[event.kind] || ENTRY_KINDS.work;
    const changes = (event.changes || []).map(ch => `
      <li>
        <span class="diff-label">${esc(Domain.changeLabel(ch))}:</span>
        ${ch.from ? `<span class="diff-from">${esc(ch.from)}</span><span class="diff-arrow">→</span>` : ""}
        <span class="diff-to">${esc(ch.to || "—")}</span>
        ${ch.cost ? `<span class="muted money"> · ${esc(Util.money(ch.cost))}</span>` : ""}
      </li>`).join("");

    return `<li class="type-${esc(event.kind)}">
      <div class="entry-head">
        <span class="badge ${kind.badge}">${esc(kind.label)}</span>
        <strong>${esc(event.title || "(untitled)")}</strong>
        <span class="entry-date">${esc(Util.formatDate(event.date))}</span>
        ${event.by ? `<span class="entry-date">· ${esc(event.by)}</span>` : ""}
        <span class="spacer"></span>
        ${event.cost ? `<strong class="money">${esc(Util.money(event.cost))}</strong>` : ""}
        <button class="btn btn-sm btn-danger" data-action="event:delete"
                data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"
                data-event="${esc(event.id)}" title="Delete this entry">✕</button>
      </div>
      <div class="small muted">${esc(client.name + " · " + Domain.bikeTitle(bike))}</div>
      ${event.description ? `<div class="entry-body small">${esc(event.description)}</div>` : ""}
      ${changes ? `<ul class="diff-list">${changes}</ul>` : ""}
    </li>`;
  },

  breadcrumb(items) {
    return `<nav class="breadcrumb">` + items.map((item, i) => {
      const sep = i ? `<span aria-hidden="true">›</span>` : "";
      const node = item.action
        ? `<button data-action="${esc(item.action)}"${item.client ? ` data-client="${esc(item.client)}"` : ""}>${esc(item.label)}</button>`
        : `<span>${esc(item.label)}</span>`;
      return sep + node;
    }).join("") + `</nav>`;
  },

  /* --- tab: clients ----------------------------------------------------- */

  clientList(db, filter) {
    const needle = (filter || "").toLowerCase();
    const clients = db.clients
      .filter(c => !needle || Domain.clientSearchText(c).includes(needle))
      .sort((a, b) => a.name.localeCompare(b.name));

    const cards = clients.map(c => {
      // Only the statuses that need attention are worth the space here;
      // "out of shop" is the norm and says nothing.
      const counts = Domain.clientStatusCounts(c);
      const active = BIKE_STATUSES_RANKED
        .filter(s => s.id !== DEFAULT_STATUS && counts[s.id])
        .map(s => `<span class="badge ${s.badge}">${counts[s.id]} ${esc(s.short.toLowerCase())}</span>`)
        .join(" ");

      return `
      <article class="card clickable" data-action="client:open" data-client="${esc(c.id)}">
        <div class="card-title">
          <h3>${esc(c.name)}</h3>
          <span class="badge">${c.bikes.length} bike${c.bikes.length === 1 ? "" : "s"}</span>
        </div>
        <p class="small muted">${esc([c.phone, c.email].filter(Boolean).join(" · ") || "No contact details")}</p>
        ${active ? `<p style="margin-top:8px">${active}</p>` : ""}
        ${c.bikes.length ? `<p class="small" style="margin-top:8px">${
          c.bikes.slice(0, 3).map(b => esc(Domain.bikeTitle(b))).join("<br>")
        }${c.bikes.length > 3 ? `<br><span class="muted">+${c.bikes.length - 3} more</span>` : ""}</p>` : ""}
      </article>`;
    }).join("");

    return `
      <div class="stack">
        <div class="row between">
          <h2>Clients</h2>
          <div class="row">
            <input class="search" type="search" placeholder="Search clients, bikes, parts…"
                   value="${esc(filter || "")}" data-input="search" data-scope="searchClients"
                   data-focus-key="search-clients">
            <button class="btn btn-primary" data-action="client:add">+ Add client</button>
          </div>
        </div>
        ${clients.length
          ? `<div class="grid">${cards}</div>`
          : View.empty("👤", db.clients.length ? "No matches" : "No clients yet",
              db.clients.length ? "Try a different search term."
                                : "Add your first client to start tracking their bikes.",
              db.clients.length ? "" : `<button class="btn btn-primary" data-action="client:add">+ Add client</button>`)}
      </div>`;
  },

  clientDetail(db, client) {
    const statusCounts = Domain.clientStatusCounts(client);
    const details = CLIENT_FIELDS
      .filter(f => f.key !== "name" && f.key !== "notes" && client[f.key])
      .map(f => `<div class="spec-item"><dt>${esc(f.label)}</dt><dd>${esc(client[f.key])}</dd></div>`)
      .join("");

    // Same ordering as the Bikes tab: whatever the shop is holding first.
    const bikes = client.bikes.slice()
      .sort((a, b) => Domain.status(a).rank - Domain.status(b).rank ||
                      Domain.bikeTitle(a).localeCompare(Domain.bikeTitle(b)))
      .map(b => {
      const work = View.workLine(b);
      const last = Domain.lastDoneJob(b);
      return `
      <article class="card clickable" data-status="${esc(Domain.status(b).id)}"
               data-action="bike:open" data-client="${esc(client.id)}" data-bike="${esc(b.id)}">
        <div class="card-title">
          <h3>${esc(Domain.bikeTitle(b))}</h3>
          ${View.statusBadge(b, true)}
        </div>
        <p class="small muted">${esc(Domain.bikeSubtitle(b) || "—")}${
          b.stub ? ` · <span class="badge">details pending</span>` : ""}</p>
        <p style="margin-top:10px">${View.specChips(b)}</p>
        <p class="small muted" style="margin-top:10px">
          ${work || (last ? `last ${esc(Util.formatDate(last.completedDate))} — ${esc(last.name)}`
                          : "no work recorded yet")}
        </p>
        <div class="row" style="margin-top:10px">${View.quickAction(client, b)}</div>
      </article>`;
    }).join("");

    return `
      <div class="stack">
        ${View.breadcrumb([{ label: "Clients", action: "nav:clients" }, { label: client.name }])}

        <div class="card">
          <div class="row between">
            <div>
              <h2>${esc(client.name)}</h2>
              <p class="small muted">${esc([client.phone, client.email, client.company].filter(Boolean).join(" · ") || "No contact details")}</p>
            </div>
            <div class="row">
              <button class="btn" data-action="client:edit" data-client="${esc(client.id)}">Edit client</button>
              <button class="btn btn-danger" data-action="client:delete" data-client="${esc(client.id)}">Delete</button>
            </div>
          </div>
          ${details ? `<dl class="spec-grid" style="margin-top:14px">${details}</dl>` : ""}
          ${client.notes ? `<p class="small" style="margin-top:14px;white-space:pre-wrap">${esc(client.notes)}</p>` : ""}
          <div class="row" style="margin-top:14px">
            <span class="chip">Bikes: <strong>${client.bikes.length}</strong></span>
            <span class="chip">Recorded spend: <strong>${esc(Util.money(Domain.clientSpend(client)))}</strong></span>
            ${BIKE_STATUSES_RANKED
              .filter(s => s.id !== DEFAULT_STATUS && statusCounts[s.id])
              .map(s => `<span class="badge ${s.badge}">${statusCounts[s.id]} ${esc(s.short.toLowerCase())}</span>`)
              .join(" ")}
          </div>
        </div>

        <div class="row between">
          <h3>Bikes</h3>
          <div class="row">
            <button class="btn btn-primary" data-action="bike:stub" data-client="${esc(client.id)}"
                    title="For a bike we have not seen yet — schedule work against it now, fill in the details when it arrives">+ New bike</button>
            <button class="btn" data-action="bike:add" data-client="${esc(client.id)}">+ Add with full details</button>
          </div>
        </div>
        ${client.bikes.length
          ? `<div class="grid">${bikes}</div>`
          : View.empty("🚲", "No bikes yet",
              "“New bike” takes a name and nothing else — enough to book work in over the phone.",
              `<button class="btn btn-primary" data-action="bike:stub" data-client="${esc(client.id)}">+ New bike</button>`)}
      </div>`;
  },

  /** One open work item on the bike page: read-only, progress at a glance. */
  jobSummaryRow(job) {
    const stats = Domain.jobStats(job);
    return `
      <div class="work-row">
        <div><strong>${esc(job.name)}</strong> <span class="small muted">${stats.done}/${stats.total} steps</span></div>
        ${View.progressBar(stats.percent)}
      </div>`;
  },

  bikeDetail(db, client, bike) {
    const specSection = (group) => {
      const rows = group.fields
        .filter(f => bike.specs[f.key])
        .map(f => `<div class="spec-item"><dt>${esc(f.label)}</dt><dd>${esc(bike.specs[f.key])}</dd></div>`)
        .join("");
      return `
        <section class="card">
          <h4>${esc(group.label)}</h4>
          ${rows ? `<dl class="spec-grid" style="margin-top:10px">${rows}</dl>`
                 : `<p class="small muted" style="margin-top:8px">Nothing recorded. Use “Edit details”.</p>`}
        </section>`;
    };

    const otherRows = (bike.other || []).filter(o => o.label || o.value)
      .map(o => `<div class="spec-item"><dt>${esc(o.label)}</dt><dd>${esc(o.value)}</dd></div>`).join("");

    const open = Domain.openJobs(bike);
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;

    return `
      <div class="stack">
        ${View.breadcrumb([
          { label: "Clients", action: "nav:clients" },
          { label: client.name, action: "client:open", client: client.id },
          { label: Domain.bikeTitle(bike) }
        ])}

        <div class="card" data-status="${esc(Domain.status(bike).id)}">
          <div class="row between">
            <div>
              <h2>${esc(Domain.bikeTitle(bike))}</h2>
              <p class="small muted">${esc(Domain.bikeSubtitle(bike) || "")} · owned by ${esc(client.name)}</p>
            </div>
            ${View.bikeMenu(client, bike)}
          </div>
          ${bike.stub ? `<p class="small" style="margin-top:10px">
            <span class="badge badge-sched">Details pending</span>
            <span class="muted"> — created from a phone call. “Edit details” (in the ⋯ menu) once the bike is in front of you.</span></p>` : ""}
          <p style="margin-top:12px">${View.specChips(bike)}</p>
          <div class="row" style="margin-top:12px">
            <span class="chip">Jobs on record: <strong>${Domain.doneJobs(bike).length}</strong></span>
            <span class="chip">Recorded spend: <strong>${esc(Util.money(Domain.bikeSpend(bike)))}</strong></span>
            ${open.length ? `<span class="chip">Open work: <strong>${open.length}</strong></span>` : ""}
          </div>
          ${View.statusBar(client, bike)}
        </div>

        <div class="card">
          <div class="row between">
            <h3>Work</h3>
            <div class="row">
              ${Domain.readyToPrint(bike)
                ? `<button class="btn btn-ghost" data-action="print:visit" ${ids}
                           title="A one-page summary of this visit's work for the client">🖨 Print summary</button>` : ""}
              ${open.length || Domain.isActive(bike)
                ? `<button class="btn btn-nav" data-action="work:open" ${ids}>Open in Work →</button>` : ""}
            </div>
          </div>
          <div style="margin-top:8px">
            ${open.map(View.jobSummaryRow).join("")
              || `<p class="small muted">${Domain.readyToPrint(bike)
                    ? "All work for this visit is done." : "No work outstanding."}</p>`}
          </div>
        </div>

        ${View.history(client, bike)}

        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
          ${SPEC_GROUPS.map(specSection).join("")}
          <section class="card">
            <h4>Other</h4>
            ${otherRows ? `<dl class="spec-grid" style="margin-top:10px">${otherRows}</dl>`
                        : `<p class="small muted" style="margin-top:8px">No extra notes recorded.</p>`}
          </section>
        </div>

      </div>`;
  },

  /**
   * Service history: every past visit as one compact line — dates and the
   * work done — so the right one can be spotted at a glance. Clicking a line
   * expands it in place to show exactly how the work went (steps, notes,
   * parts, who and how long) and to reprint that visit's summary. For when
   * the bike comes back and someone asks "what did we do last time?".
   */
  history(client, bike) {
    const visits = Domain.visits(bike);
    if (!visits.length) {
      return `
        <div class="card">
          <h3>Service history</h3>
          <p class="small muted" style="margin-top:8px">Nothing completed on this bike yet. Finished work items appear here with their steps and notes.</p>
        </div>`;
    }

    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;
    const rows = visits.map(v => {
      const open = App.ui.openVisits.has(bike.id + ":" + v.key);
      // How many notes a visit holds, so the one worth opening stands out.
      const notes = v.jobs.reduce((n, j) =>
        n + (j.summary ? 1 : 0) + Domain.allSteps(j).filter(st => st.notes).length, 0);
      return `
        <li>
          <button class="visit-row" aria-expanded="${open}" data-action="history:toggle"
                  ${ids} data-visit="${esc(v.key)}" data-focus-key="visit-${esc(v.key)}">
            <span class="caret" aria-hidden="true">▸</span>
            <span class="date">${esc(Domain.visitDates(v))}</span>
            <span class="work">${esc(v.jobs.map(j => j.name).join(", "))}</span>
            ${notes ? `<span class="chip">${notes} note${notes === 1 ? "" : "s"}</span>` : ""}
          </button>
          ${open ? `
            <div class="visit-body">
              <div class="row" style="margin-bottom:10px">
                <span class="spacer"></span>
                <button class="btn btn-sm" data-action="print:history" ${ids} data-visit="${esc(v.key)}"
                        title="Reprint the summary for this visit">Print visit</button>
              </div>
              ${v.jobs.map(j => View.workJob(client, bike, j)).join("")}
            </div>` : ""}
        </li>`;
    }).join("");

    return `
      <div class="card">
        <h3>Service history <span class="badge">${visits.length} visit${visits.length === 1 ? "" : "s"}</span></h3>
        <p class="small muted" style="margin-top:4px">Click a visit to see its steps, notes and parts.</p>
        <ul class="visits">${rows}</ul>
      </div>`;
  },

  /* --- tab: bikes ------------------------------------------------------- */

  bikesTab(db, filter) {
    const needle = (filter || "").toLowerCase();
    const matches = Domain.allBikes(db)
      .filter(({ client, bike }) =>
        !needle || (Domain.bikeSearchText(bike) + " " + client.name.toLowerCase()).includes(needle));

    const card = ({ client, bike }) => {
      const work = View.workLine(bike);
      return `
      <article class="card clickable" data-status="${esc(Domain.status(bike).id)}"
               data-action="bike:open" data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">
        <div class="card-title">
          <h3>${esc(Domain.bikeTitle(bike))}</h3>
          ${View.statusBadge(bike, true)}
        </div>
        <p class="small muted">${esc(client.name)}${Domain.bikeSubtitle(bike) ? " · " + esc(Domain.bikeSubtitle(bike)) : ""}${
          bike.stub ? " · details pending" : ""}</p>
        <p style="margin-top:10px">${View.specChips(bike)}</p>
        <p class="small muted" style="margin-top:10px">
          ${work || `${Domain.doneJobs(bike).length} job${Domain.doneJobs(bike).length === 1 ? "" : "s"} on record`}${
            bike.statusDate ? ` · ${esc(Domain.status(bike).short.toLowerCase())} since ${esc(Util.formatDate(bike.statusDate))}` : ""}
        </p>
        <div class="row" style="margin-top:10px">${View.quickAction(client, bike)}</div>
      </article>`;
    };

    // Grouped by status in workflow-urgency order — in shop, completed,
    // scheduled, then everything resting with its owner.
    const groups = Domain.byStatus(matches)
      .filter(group => group.items.length)
      .map(({ status, items }) => `
        <section class="status-group">
          <div class="row">
            <h3>${esc(status.label)}</h3>
            <span class="badge ${status.badge}">${items.length}</span>
            <span class="small muted">${esc(status.groupHint)}</span>
          </div>
          <div class="grid">${
            items.sort((a, b) => Domain.bikeTitle(a.bike).localeCompare(Domain.bikeTitle(b.bike)))
                 .map(card).join("")
          }</div>
        </section>`).join("");

    const summary = BIKE_STATUSES_RANKED.map(s => {
      const n = matches.filter(m => Domain.status(m.bike).id === s.id).length;
      return `<span class="chip">${esc(s.label)}: <strong>${n}</strong></span>`;
    }).join(" ");

    return `
      <div class="stack">
        <div class="row between">
          <h2>Bikes</h2>
          <input class="search" type="search" placeholder="Search by bike, part, owner or status…"
                 value="${esc(filter || "")}" data-input="search" data-scope="searchBikes"
                 data-focus-key="search-bikes">
        </div>
        ${matches.length ? `<div class="row">${summary}</div>` : ""}
        ${groups || View.empty("🔍", "No bikes to show", "Bikes appear here once they are added to a client.")}
      </div>`;
  },

  /* --- tab: work -------------------------------------------------------- */

  /**
   * The Work tab is two panes: a rail of everything the shop is holding, and
   * the work space for whichever bike is selected. Selection lives in the
   * route, so switching to Clients and back returns the mechanic to the bike
   * they were on — and every keystroke was already saved, so nothing is lost.
   */
  workTab(db, route, filter) {
    const needle = (filter || "").toLowerCase();
    const match = ({ client, bike }) =>
      !needle || (Domain.bikeSearchText(bike) + " " + client.name.toLowerCase()).includes(needle);

    const all = Domain.allBikes(db).filter(match);
    const inShop = all.filter(({ bike }) => Domain.status(bike).id === "in_shop");
    const dueIn = all.filter(({ bike }) => Domain.status(bike).id === "scheduled");
    const ready = all.filter(({ bike }) => Domain.status(bike).id === "completed");

    const selected = route.workBikeId
      ? Domain.bike(db, route.workClientId, route.workBikeId) : null;
    const selectedClient = selected ? Domain.client(db, route.workClientId) : null;

    const railItem = ({ client, bike }) => {
      const stats = Domain.bikeWorkStats(bike);
      const current = bike.id === route.workBikeId;
      return `
        <button class="rail-item" data-status="${esc(Domain.status(bike).id)}"
                aria-current="${current}" data-action="work:open"
                data-client="${esc(client.id)}" data-bike="${esc(bike.id)}">
          <span class="t">${esc(Domain.bikeTitle(bike))}</span>
          <span class="s">${esc(client.name)}</span>
          ${stats.jobs ? View.progressBar(stats.percent) : ""}
          <span class="s">${stats.jobs
            ? `${stats.done}/${stats.total} steps · ${stats.jobs} item${stats.jobs === 1 ? "" : "s"}`
            : "No work scheduled"}</span>
        </button>`;
    };

    const railGroup = (label, items, hint) => items.length ? `
      <h4>${esc(label)} <span class="badge">${items.length}</span></h4>
      ${hint ? `<p class="hint" style="margin:0 2px">${esc(hint)}</p>` : ""}
      ${items.sort((a, b) => Domain.bikeTitle(a.bike).localeCompare(Domain.bikeTitle(b.bike)))
             .map(railItem).join("")}` : "";

    const rail = railGroup("On the bench", inShop)
      + railGroup("Due in", dueIn, "Check in from the bike's card when it arrives.")
      + railGroup("Ready for collection", ready);

    return `
      <div class="stack">
        <div class="row between">
          <h2>Work</h2>
          <input class="search" type="search" placeholder="Filter by bike, owner or requested work…"
                 value="${esc(filter || "")}" data-input="search" data-scope="searchWork"
                 data-focus-key="search-work">
        </div>
        <div class="work-layout">
          <aside class="rail">
            ${rail || `<p class="small muted">Nothing in the shop.</p>`}
          </aside>
          <section>
            ${selected && selectedClient
              ? View.workspace(db, selectedClient, selected)
              : View.empty("🔧", inShop.length ? "Pick a bike" : "Nothing on the bench",
                  inShop.length
                    ? "Choose a bike from the list to open its work items. Everything you tick or type is saved as you go."
                    : "Bikes appear here once they are checked in. Schedule work from a client or bike page first.")}
          </section>
        </div>
      </div>`;
  },

  /**
   * One step of a work item: the row a mechanic actually works in. Notes are
   * open whether or not the step is ticked, so "not done — client declined"
   * can be written down. A completed item is read-only until it is unlocked
   * with Edit; unlocked, it works like an open one, and its part changes can
   * be corrected in place.
   */
  workStep(client, bike, job, step) {
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`
      + ` data-job="${esc(job.id)}" data-step="${esc(step.id)}"`;
    const done = job.status === "done";
    const locked = done && !App.ui.editJobs.has(job.id);

    const parts = (step.changes || []).map(ch => {
      const changeIds = `${ids} data-change="${esc(ch.id)}"`;
      const remove = locked ? "" : `<button class="btn btn-sm btn-danger" data-action="step:part-remove"
                                            ${changeIds} title="Remove this part change">✕</button>`;
      // Unlocked history: the part and its cost become fields, for typos.
      if (done && !locked) return `
        <li>
          <span class="diff-label">${esc(Domain.changeLabel(ch))}:</span>
          ${ch.from ? `<span class="diff-from">${esc(ch.from)}</span><span class="diff-arrow">→</span>` : ""}
          <input type="text" value="${esc(ch.to)}" data-input="change:field" data-field="to" ${changeIds}
                 aria-label="Part fitted">
          <input type="text" inputmode="decimal" value="${esc(ch.cost || "")}" placeholder="0.00"
                 data-input="change:field" data-field="cost" ${changeIds} aria-label="Part cost">
          ${remove}
        </li>`;
      return `
        <li>
          <span class="diff-label">${esc(Domain.changeLabel(ch))}:</span>
          ${ch.from ? `<span class="diff-from">${esc(ch.from)}</span><span class="diff-arrow">→</span>` : ""}
          <span class="diff-to">${esc(ch.to || "—")}</span>
          ${ch.cost ? `<span class="muted money">· ${esc(Util.money(ch.cost))}</span>` : ""}
          ${remove}
        </li>`;
    }).join("");

    const subs = step.substeps || [];
    const subsDone = subs.filter(sub => sub.done).length;

    return `
      <li class="step${step.done ? " done" : ""}">
        <div>
          <input type="checkbox" ${step.done ? "checked" : ""} ${locked ? "disabled" : ""}
                 data-action="step:toggle" ${ids} data-focus-key="step-${esc(step.id)}-chk"
                 aria-label="Mark “${esc(step.title)}” done">
        </div>
        <div>
          <div class="step-head">
            <span class="step-title">${esc(step.title)}</span>
            ${step.optional ? `<span class="badge">Optional</span>` : ""}
            ${subs.length ? `<span class="small muted">${subsDone}/${subs.length}</span>` : ""}
          </div>
          ${step.note ? `<p class="step-note">${esc(step.note)}</p>` : ""}
          ${locked
          ? (step.notes ? `<p class="small" style="margin-top:6px">${esc(step.notes)}</p>` : "")
          : `
            <div class="step-fields">
              <input type="text" placeholder="Notes — what you found, what you did, or why it was not done"
                     value="${esc(step.notes)}" data-input="step:field" data-field="notes" ${ids}
                     data-focus-key="step-${esc(step.id)}-notes" aria-label="Step notes">
              <button class="btn btn-sm" data-action="step:parts" ${ids}>+ Parts</button>
            </div>`}
          ${parts ? `<ul class="step-parts">${parts}</ul>` : ""}
          ${subs.length ? `<ul class="steps substeps">${
            subs.map(sub => View.workStep(client, bike, job, sub)).join("")}</ul>` : ""}
        </div>
      </li>`;
  },

  /**
   * A completed item's price: the total, with labor + parts underneath. Kept
   * as its own piece so live edits to hours, rate, discount or a part cost
   * can redraw just this (see App.refreshTotals) without a full render.
   */
  jobTotals(job) {
    const price = Domain.jobPrice(job);
    return `
      <div class="money"><strong>${esc(Util.money(price.total))}</strong></div>
      <div class="hint">${esc(Domain.priceBreakdown(price))}</div>
      <div class="hint">${esc(Domain.laborLine(price))}</div>`;
  },

  /** The sign-off of a completed item, as fields, while it is unlocked. */
  jobEditFields(client, bike, job) {
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}" data-job="${esc(job.id)}"`;
    const field = (key, label, value, extra = "") => `
      <div class="field">
        <label for="je-${esc(job.id)}-${key}">${label}</label>
        <input id="je-${esc(job.id)}-${key}" ${extra} value="${esc(value)}"
               data-input="job:field" data-field="${key}" ${ids}>
      </div>`;
    const number = `type="text" inputmode="decimal" autocomplete="off"`;
    return `
      <div class="job-edit">
        <div class="fields">
          ${field("by", "Completed by", job.by, `type="text" autocomplete="off"`)}
          ${field("completedDate", "Date", job.completedDate, `type="date"`)}
          ${field("hours", "Hours", Util.hours(job.hours), number)}
          ${field("rate", "Hourly rate", job.rate, number)}
          ${field("discount", "Discount %", job.discount || "", `${number} placeholder="0"`)}
          <div class="field wide">
            <label for="je-${esc(job.id)}-summary">Closing notes</label>
            <textarea id="je-${esc(job.id)}-summary" rows="3" data-input="job:field" data-field="summary"
                      ${ids}>${esc(job.summary)}</textarea>
          </div>
        </div>
      </div>`;
  },

  /** One work item on the bench, with its whole checklist. */
  workJob(client, bike, job) {
    const stats = Domain.jobStats(job);
    const state = JOB_STATES[job.status];
    const done = job.status === "done";
    const editing = done && App.ui.editJobs.has(job.id);
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}" data-job="${esc(job.id)}"`;

    return `
      <div class="job-card${done ? " is-done" : ""}${editing ? " is-editing" : ""}" data-job="${esc(job.id)}">
        <div class="job-head">
          <span class="badge ${state.badge}">${esc(state.label)}</span>
          <h3>${esc(job.name)}</h3>
          <span class="spacer"></span>
          <span class="small muted">${stats.done}/${stats.total} steps</span>
        </div>
        ${View.progressBar(stats.percent)}
        ${job.description ? `<p class="small muted">${esc(job.description)}</p>` : ""}
        ${job.request ? `<div class="job-request"><strong>Client asked:</strong> ${esc(job.request)}</div>` : ""}

        <ul class="steps">
          ${job.steps.map(step => View.workStep(client, bike, job, step)).join("")}
        </ul>
        ${editing ? View.jobEditFields(client, bike, job)
          : done && job.summary ? `<div class="job-summary"><strong>Notes:</strong> ${esc(job.summary)}</div>` : ""}

        <div class="row between" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <div data-job-totals="${esc(job.id)}">${done ? View.jobTotals(job) : ""}</div>
          <div class="row">
            ${editing
              ? `<span class="small muted">Changes save as you type.</span>
                 <button class="btn btn-primary" data-action="job:edit" ${ids}>Done editing</button>`
              : done
              ? `<span class="small muted">Completed ${esc(Util.formatDate(job.completedDate))}${
                   job.by ? " by " + esc(job.by) : ""}</span>
                 <button class="btn btn-sm btn-danger" data-action="job:delete" ${ids}>Delete record</button>
                 <button class="btn btn-sm" data-action="job:edit" ${ids}
                         title="Unlock this record to correct it in place">Edit</button>`
              : `${stats.openRequired
                    ? `<span class="small muted">${stats.openRequired} required step${
                        stats.openRequired === 1 ? "" : "s"} left</span>` : ""}

                 <button class="btn btn-primary" data-action="job:complete" ${ids}>Complete work item</button>`}

  /** The right-hand pane: one bike, everything outstanding on it. */
  workspace(db, client, bike) {

    const stats = Domain.bikeWorkStats(bike);
    const ids = `data-client="${esc(client.id)}" data-bike="${esc(bike.id)}"`;

    return `

  /* --- tab: data -------------------------------------------------------- */

  dataTab(db, filter, search) {
    const stats = Domain.stats(db);

    // The changelog lives here and only here: an audit trail to review and

      .filter(({ event }) => filter === "all" || event.kind === filter)

    return `

            <span class="chip">Last saved: <strong>${db.updatedAt ? esc(new Date(db.updatedAt).toLocaleString(CONFIG.locale)) : "—"}</strong></span>

          <div class="row">
            <button class="btn btn-primary" data-action="data:export">⬇ Export JSON</button>
            <button class="btn" data-action="data:import">⬆ Import JSON…</button>
            <input type="file" id="import-file" accept="application/json,.json" class="sr-only">
          </div>
          <p class="hint">Importing replaces everything currently stored. Export first if in doubt.</p>

        <div class="card stack">

            ? `<ul class="timeline">${shown.map(({ client, bike, event }) => View.entry(client, bike, event)).join("")}</ul>
               ${matches.length > shown.length
                 ? `<p class="hint">Showing the latest ${shown.length} of ${matches.length}. Search or filter to narrow it down.</p>` : ""}`
            : `<p class="small muted">${stats.entries ? "No entries match." : "Nothing logged yet."}</p>`}
        </div>

        <div class="card stack">
          <h3>Sample data</h3>
          <p class="small muted">
            For trying the app out: two clients, a bike on the bench part-way through a tune-up,

          <div class="row">
            <button class="btn" data-action="data:sample">Load sample data</button>

          <p class="hint">Loading the sample replaces everything currently stored.</p>
        </div>

        <div class="card stack">

            <button class="btn btn-danger" data-action="data:reset">Delete everything</button>
